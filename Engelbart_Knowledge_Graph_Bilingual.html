    &quot;en&quot;: &quot;He noticed you wrinkle your face as you looked at the display. \&quot;It&#x27;s time to shift the topic a bit, and some of the things on the screen that are probably puzzling you can make a starting point for a new discussion phase. See, when I outlined a delivery for giving a feel for these techniques to the uninitiated, I could have sketched out the subject matter in a skeletal argument structure. From what we&#x27;ve been through so far, you might expect it to be like that. What I did, though, was to treat the matter as a process that I was going to execute the process of giving you a lecture demonstration. It is a rather trivial exercise of the techniques we have for developing and manipulating processes, but anyway that&#x27;s the form I chose for making the notes.&quot;
  },
  &quot;3b8c&quot;: {
    &quot;id&quot;: &quot;p_337&quot;,
    &quot;zh&quot;: &quot;“过程也是一种需要设计、构建和使用的东西，和任何工具一样。既然在广义上，我们把过程视为增强系统的一部分，那么，除了有效使用过程的能力，也绝对需要有效设计和构建过程的能力。首先，在我们看来，为一个问题设定目标、拟定解决途径，本身就是一种过程设计与构建。独立的问题解决者当然必须具备这种能力。事实上，我们发现，不论是在过程结构化的较高层次还是较低层次，设计并协调自己的步骤顺序，都是整个活动中极其重要的一部分。”&quot;,
    &quot;en&quot;: &quot;\&quot;A process is something that is designed, built, and used—as is any tool. In the general sense in which we consider processes to be a part of our augmentation system, it is absolutely necessary that there be effective capability for designing and building processes as well as for using them. For one thing, the laying out of objectives and a method of approach for a problem represent a form of process design and building, to our way of looking at it. And an independent problem solver certainly has to have this capability. Indeed, we find that designing and coordinating one&#x27;s sequence of steps, in high levels or in low levels of such process structuring, is an extremely important part of the total activity.&quot;
  },
  &quot;3b8e&quot;: {
    &quot;id&quot;: &quot;p_339&quot;,
    &quot;zh&quot;: &quot;“当然，我们还使用纯粹由计算机执行的过程。按照我们的理念，得到增强的人，也应当能够为自己设计和构建这些过程。我们研究组以外有不少人，坚决认为实用的增强系统不应要求使用者进行任何计算机编程；他们觉得，这种能力太专门，不该成为人的负担。但在我们看来，换成家庭工作间的情境，这等于说：不能要求使用工具的人知道怎样调工具、装夹具、换不同规格的钻头，等等。你看，在学习使用工具本来就必须掌握的知识背景中，这些技能并不难学；而且，它们能大大增加灵活性，使人更容易找到方便的工具使用方式，来加工材料。”&quot;,
    &quot;en&quot;: &quot;\&quot;There are, of course, the explicit computer processes which we use, and which our philosophy requires the augmented man to be able to design and build for himself. A number of people, outside our research group here, maintain stoutly that a practical augmentation system should not require the human to have to do any computer programming—they feel that this is too specialized a capability to burden people with. Well, what that means in our eyes, if translated to a home workshop, would be like saying that you can&#x27;t require the operating human to know how to adjust his tools, or set up jigs, or change drill sizes, and the like. You can see there that these skills are easy to learn in the context of what the human has to learn anyway about using the tools, and that they provide for much greater flexibility in finding convenient ways to use the tools to help shape materials.&quot;
  },
  &quot;3b8o&quot;: {
    &quot;id&quot;: &quot;p_349&quot;,
    &quot;zh&quot;: &quot;“但我不想在计算机过程上花掉不成比例的时间。得到增强的人，更多时候是在构建我们所说的复合过程，而不只是计算机过程。比如，规划一个研究项目，或者安排一天的工作，都是复合过程结构化的例子。记住，复合过程由人的过程和计算机过程共同组织而成；当然，其中也可能包括较低阶的复合过程。这里的结构化，与纯计算机过程结构化的主要区别，在于能够指定给人执行的子过程有多复杂。有些要求，必须用适配人那套丰富工作概念框架的语言来表达；我们刚才一直用英语演示，正是为了这个目的。但是，许多由人执行的过程，也可以用高级计算机处理语言加以指定，尽管我们还不知道怎样用这种语言把这些过程具体描述出来。这意味着，对于相当多的复合过程结构，计算机都能替我们回答很有用的问题。”&quot;,
    &quot;en&quot;: &quot;\&quot;But I don&#x27;t want to spend a disproportionate amount of time on the computer processes. The augmented man is engaged more often in structuring what we call composite processes than he is in structuring computer processes. For instance, planning a research project, or a day&#x27;s work, are examples of structuring composite processes. A composite process, remember, is organized from both human processes and computer processes—which includes, of course, the possible inclusion of lower-order composite processes. The structuring here differs from that of a computer process mainly in the sophistication of the sub-processes which can be specified for the human to do. Some of these specifications have to be given in a language which matches the human&#x27;s rich working framework of concepts—and we have been demonstrating here with English for that purpose—but quite a few human-executed processes can be specified in the high-level computer-processing language even though we don&#x27;t know how to describe them in that language. This means that there are quite a few composite-process structures about which the computer can answer very useful questions for us.&quot;
  },
  &quot;3b8p&quot;: {
    &quot;id&quot;: &quot;p_350&quot;,
    &quot;zh&quot;: &quot;“具体一些说，设定目标、设计解决途径，再实施这个途径，当然就是我们基本的操作顺序；这个顺序在活动的许多层次上反复出现。刚才已经说过，计算机过程与复合过程在结构上的典型差别。但对我们来说，也许更重要的，是处理复合过程结构时，工作方式有什么不同。可以用一种粗略但简洁的说法来表达：只要人的贡献参与其中，过程越复杂，就越能看出，人的贡献价值取决于他在行动中能有多大不按部就班的自由。例如，我们尽量帮助他制定行动计划，然后尽量帮助他执行。但同时，也必须允许他几乎在任何时刻改变主意，想要修改计划。因此，我们提供增强帮助，让他追踪计划、了解自己走到哪里、迄今执行中发生过什么，并评估突然想到的计划修改可能性。事实上，我们甚至在学习怎样让计算机留意某些可修改计划的机会，并在它们出现时提醒人。”&quot;,
    &quot;en&quot;: &quot;\&quot;But to be more specific—we find that setting up objectives, designing a method of approach, and then implementing that method are of course our fundamental operating sequence—done over and over again in the many levels of our activity. We mentioned above what the characteristic structural difference was between computer processes and composite processes. But perhaps more important to us is the difference in the way we work with composite-process structures. Here is a crude but succinct way to put this. With the human contributing to a process, we find more and more as the process becomes complex that the value of the human&#x27;s contribution depends upon how much freedom he is given to be disorderly in his course of action. For instance, we provide him as much help as possible in making a plan of action. Then we give him as much help as we can in carrying it out. But we also have to allow him to change his mind at almost any point, and to want to modify his plans. So, we provide augmentation help to him for keeping track of his plans where he is in them, what has been happening in carrying them out to date—and for evaluating possibilities that might occur to him for changing the plans. In fact, we are even learning how the computer can be made to watch for some kinds of plan-change possibilities, and to point them out to the human when they arise.&quot;
  },
  &quot;3b8q&quot;: {
    &quot;id&quot;: &quot;p_351&quot;,
    &quot;zh&quot;: &quot;“这里有一个简单例子。去年冬天，我们设计了一个计算机过程，能够在指定时间段内，自动监测若干指定类型的计算机使用情况，并从所得数据推导出大量信息，说明人怎样利用了那段时间；信息之丰富，颇令人惊讶。这对评价工作方式很有帮助。随后，我们又增加功能，让计算机偶尔打断人的活动，显示一些待回答的问题。结合这些回答与常规监测数据，程序就能提供评价资料，说明不同工作方法各自有多成功。我们的增强研究人员对这一方向产生了兴趣，又深入做了一些工作。他们开发出一套整合的过程，向人提供多种关于进展和工作方式的反馈。现在，我把它纳入日常习惯，每小时花大约五分钟使用一次。它几乎总能让我发现一些东西，至少会改变下一小时工作方法的侧重点，而且常常促使我对短期计划作出相当重要的调整。”&quot;,
    &quot;en&quot;: &quot;\&quot;Here&#x27;s a simple example of this sort of help for the human. Last winter, we designed a computer process that can automatically monitor the occurrence of specified types of computer usage over a specified period of time, and which, from the resulting data, can deduce a surprising amount of information regarding how the human made use of that time. This was quite helpful to us for evaluating our ways of doing things. Then we added more features to the program, in which the computer occasionally interrupts the human&#x27;s activity and displays some questions to be answered. From these answers, together with its normal monitoring data, the program can provide evaluative data regarding the relative success of his different work methods. Our augmentation researchers became intrigued by this angle and bore down a little on it. They came up with a package process which gives the human many different types of feedback about his progress and way of doing things. Now, as part of my regular practice, I spend about five minutes out of each hour exercising with this package. This almost always reveals things to me that change at least the slant of my approach during the next hour, and often stimulates a relatively significant change in my short-range plans.&quot;
  },
  &quot;3b8r&quot;: {
    &quot;id&quot;: &quot;p_352&quot;,
    &quot;zh&quot;: &quot;“当然，你知道，我现在一小时完成的有意义步骤，比过去多得多，也比你目前通常一小时所能完成的多得多。因此，如果按照两次回顾之间走过的距离来比较，我现在每小时回顾一次，大概相当于你每天回顾一次。”&quot;,
    &quot;en&quot;: &quot;\&quot;You appreciate, of course, that I accomplish many more meaningful steps in an hour now than I used to, or than would be your norm now. This once-an-hour review for me now might compare with a once-a-day review for you, as far as the distance travelled between reviews is concerned.&quot;
  },
  &quot;3b8s&quot;: {
    &quot;id&quot;: &quot;p_353&quot;,
    &quot;zh&quot;: &quot;“这种回顾过程，影响了我们组织目标陈述、计划设计论证以及计划工作陈述的方式。我们发现，可以在构建这些规划结构时，附加某些特殊标签和描述代码，使以后的人机协作回顾更方便。我们建立这些结构的方法，也逐渐演变得更便于日后修改。例如，按照标准的论证结构化方式，每条规划陈述所依据的基本考虑因素，都应与它链接起来。在此基础上，我们又在规划论证中加入特殊标记代码，向计算机区分依据链接中不同类型的依赖关系。以后考虑改变计划时，这些标签常常使我们能够调用专门的计算机过程，自动分离出与某一类拟议变更有关的考虑因素。”&quot;,
    &quot;en&quot;: &quot;\&quot;Our way of structuring the statement of our objectives, the arguments which lead to the design of our plans, and the working statements of our plans, has been influenced by this review process. We found special types of tags and descriptive codes which we could append to these respective planning structures as we developed them which later facilitated our man-computer cooperative review of them. Also, our methods of developing these structures have evolved to facilitate their later modification. For instance, every basic consideration upon which a given planning statement is based is linked to that statement as a matter of standard argument structuring. But we have taken to linking special tagging codes into these argument structures involving our planning, to identify for the computer some of the different types of dependency relationships in the antecedent linkages. Later, if we consider changing the plan, these special tags often enable us to make use of some special computer processes that automatically isolate the considerations relevant to a particular type of change we have in mind.&quot;
  },
  &quot;3b8t&quot;: {
    &quot;id&quot;: &quot;p_354&quot;,
    &quot;zh&quot;: &quot;“也许举个例子更清楚。我目前使用一个计划，规定怎样把各种零碎信息输入自己的整体符号结构。这个计划的设计目的，是让这些碎片以后有较大机会得到有用的整合。它在设计论证上，与回顾过程结构的总体计划密切联系；实际上，也与回顾符号结构的计划密切联系。最近我想到，可以给这个过程增加一个小功能，使它特别适合我自己处理零星想法的偏好。通过几种方法，我很快弄清：只要把输入一条信息时所执行的子过程步骤A与B对调，实现这个功能就很容易。于是，我需要知道，能不能安全地交换它们的顺序，而不在系统其他地方引起问题。”&quot;,
    &quot;en&quot;: &quot;\&quot;Maybe an example will help here. There is a plan I am currently using for the way I go about entering miscellaneous scraps of information into my total symbol structure. It is designed so that there will be a good chance for these scraps later to be usefully integrated. It turns out that this plan is closely coupled in its design argument to the general plan for reviewing process structures—and symbol-structures, too, for that matter. Recently, I got an idea as to how I might add a little feature to that process that specially suited my particular way of wanting to deal with miscellaneous thoughts that I get. By various means, I very quickly learned that this would be easy to do if I could but reverse the order in which I execute the sub-process Steps A and B, when I enter a piece of information. I had to find out if I could safely reverse their order without getting into trouble someplace in my system.&quot;
  },
  &quot;3b8u&quot;: {
    &quot;id&quot;: &quot;p_355&quot;,
    &quot;zh&quot;: &quot;“我可以沿依据路径向下追查，寻找与这个时间顺序问题有关的陈述；按你的标准，这已经相当快了。实际上，我还有一个半自动过程，可以专门加速这种检索。计算机会记住我查过哪里，哪些地方被标成‘是’‘否’或‘可能’，并承担引导我按最优检索策略前进所需的记录与计算。不过，建立过程结构时使用的特殊标签，使涉及某些关系的检索能够完全自动进行；相对时间顺序，恰好就是其中一种关系。”&quot;,
    &quot;en&quot;: &quot;\&quot;This I could do relatively rapidly, by your standards, by snooping down the antecedent trails, looking for statements relevant to this timing question. There is, in fact, a semi-automatic processes available to me for speeding just such searches. The computer keeps track of where I have looked, where I&#x27;ve marked things as yes, or no, or possible, and does the bookkeeping and calculating necessary to guide me through an optimum search strategy. But the special tagging we do when we make a process structure lets this search be fully automatic when certain kinds of relationships are involved—and relative timing happens to be one of these relationships.&quot;
  },
  &quot;3b8v&quot;: {
    &quot;id&quot;: &quot;p_356&quot;,
    &quot;zh&quot;: &quot;“所以，我拟了一个问题，实质上就是询问：哪些考虑因素与这两步的执行次序有关，然后就让计算机去做。大约三秒钟后，结果出来了。你此前还没见过我请求一个任务，需要花上人能明显察觉的机器时间，对吧？总之，计算机找到了一条相关性路径，最终表明：在零碎信息录入过程中交换A与B，会破坏计划回顾过程中的某项功能。那项功能原本要从这份存储中搜集各种零星想法与可能性，供回顾计划时考虑。”&quot;,
    &quot;en&quot;: &quot;\&quot;So I phrased a question which essentially asked for considerations relevant to the order in which these two steps were executed, and turned the computer loose. It took about three seconds for the results to be forthcoming—you haven&#x27;t yet seen me request a task that took a noticeable period of machine time, have you? But anyway, the computer discovered a relevance trail that ended up showing that reversing the order of Steps A and B during the information-scrap entry process would cripple a certain feature in the planning-review process, where miscellaneous thoughts and possibilities are gleaned from this store to be considered relative to the planning.&quot;
  },
  &quot;3b8z&quot;: {
    &quot;id&quot;: &quot;p_360&quot;,
    &quot;zh&quot;: &quot;“同样，在执行计划好的一组操作时，你会发现，他不能把所有过程都替你完成。他处理复杂规则和程序非常在行；但碰到需要对情境有更大范围理解的步骤，就会束手无策。不过，这也不坏。那些他能够独立完成的常规过程，已经给你很大帮助；事实上，你会开始改进自己的制作方式，以充分利用他在这些任务上的高效率。超出他能力的过程，则由你们共同完成：他负责全部常规部分，你处理他力所不及的步骤。你需要处理的步骤，常常夹在一个复杂例程的中间；为了正确执行这个例程，你们任何一方都不必独自理解它的全部性质。助手负责追踪复杂程序，执行所有能够执行的步骤。遇到一个超出他能力的步骤，就交给你足够的信息，让你完成；随后，他再次接手，直到遇见下一个这样的步骤。”&quot;,
    &quot;en&quot;: &quot;\&quot;Similarly, when it came to carrying out a planned set of operations, it turned out that he couldn&#x27;t carry out all of the processes for you—he could manage complex rules and procedures beautifully, but he would break down when it came to steps that required what you might call a larger view of the situation. But this wasn&#x27;t so bad. The set of routine processes which he could manage all alone still provided you with a great deal of help—in fact, you got to developing ways to build things so as to capitalize upon his efficiency at these tasks. Then the processes which were too much for him would be done by the two of you together. He filled in all the routine stuff and you took care of the steps that were beyond his capability Often the steps you had to take care of were buried in the middle of a complex routine whose over-all nature didn&#x27;t have to be understood by either of you for proper execution. Your helper would keep track of the complex procedure and execute all the steps he could. When he came to a step that was too big for him, he would hand you enough information to allow you to take that step, whereupon he would take over again until he met another such step.&quot;
  },
  &quot;3b9a&quot;: {
    &quot;id&quot;: &quot;p_371&quot;,
    &quot;zh&quot;: &quot;“再说一个不容易事先预见到的额外好处。我们做过实验，让几个人分别在工作站上合作，工作站通过一台或多台计算机相互通信。也就是说，每个人都配有我这样的设备，并能自由访问共同的工作结构。与我们经历过的任何旧式合作相比，团队效能出现了惊人的提高。大家可以在同一个符号结构上，选择任何希望处理的地方开展工作。如果两个人想同时处理同一份材料，只需复制一份，各自改造自己的版本，以后很容易把贡献合并。整个团队可以随时集中力量，一起处理某个棘手的小问题，或者作出集体决策。随着论证结构逐渐发展，它会支持某一方、另一方，或者两方都不支持；于是，许多争议经过一段时间，就会自然解决。”&quot;,
    &quot;en&quot;: &quot;\&quot;Let me mention another bonus feature that wasn&#x27;t easily fore seen. We have experimented with having several people work together from working stations that can provide inter-communication via their computer or computers. That is, each person is equipped as I am here, with free access to the common working structures. There proves to be a really phenomenal boost in group effectiveness over any previous form of cooperation we have experienced. They can all work on the same symbol structure, wherever they might wish. If any two want to work simultaneously on the same material, they simply duplicate and each starts reshaping his version—and later it is easy to merge their contributions. The whole team can join forces at a moment&#x27;s notice to &#x27;pull together&#x27; on some stubborn little problem, or to make a group decision. Most points of contention are resolved quite naturally, over a period of time, as the developing structure of argument bears out one, or the other, or neither stand.&quot;
  },
  &quot;3b9b&quot;: {
    &quot;id&quot;: &quot;p_372&quot;,
    &quot;zh&quot;: &quot;“谁也无法独占整个场面，因为你很少需要在别人开展工作时，同时坐着‘听’他说；但是任何时候，其他人又都能接入，查看他做过什么、正在做什么。你在结构中的任何地方，发现别人所做的某一部分有问题，可以立即与他本人讨论，也可以把异议及相关论证附在分歧发生的位置，配上一个专门提示，表明这里有个最终必须解决的争议点。任何成员当下想到的任何想法，都很容易链接到能够发挥作用的地方。这有点像一场人人都能加入的热闹大混战，极其振奋，也极其令人满足，而且事情真的能够做成。你会发现，自己几乎一直都在‘超水平发挥’。”&quot;,
    &quot;en&quot;: &quot;\&quot;No one can dominate the show, since seldom do you have to &#x27;listen&#x27; to the person concurrent to the developments he is pursuing—and yet at any time another person can tune in on what he has done and is doing. One can either take immediate personal issue with another about some feature, anywhere in the structure where he might find something done by the other to which he wants to take issue, or he can append his objection and the associated argument there where the disagreement lies, and tag this with a special cue that signals a point of contention that must ultimately be resolved. Any idea of the moment by any member can easily be linked to where it can do some good. It gets to be like a real whing-ding free-for-all—tremendously stimulating and satisfying, and things really get done. You find yourself &#x27;playing over your head&#x27; almost all of the time.&quot;
  },
  &quot;3b9c&quot;: {
    &quot;id&quot;: &quot;p_373&quot;,
    &quot;zh&quot;: &quot;“我们也在试验跨学科团队，结果尤其令人兴奋。例如，不同术语体系过去造成的障碍，大大减轻了。从前，除非按某位专家习惯的方式陈述和界定情境，否则他很难充分运用自己的经验、直觉和概念感受；但其他人又无法用他的术语工作。在这里，双方在概念和术语的交界处碰面，对意义和用法作些小调整；这些调整在各自的系统里都能够被理解，并使双方都能在自己的体系中，相当精确地定义对方的术语与概念。以后研究对方的结构时，任何一方都可以让自己的定义，自动替换对方的专门术语。减少这种语言障碍，再让大家能够在共同结构上独立并行地工作，结果似乎就是各自不同能力的放大。”&quot;,
    &quot;en&quot;: &quot;\&quot;We have been experimenting with multi-disciplinary teams and are becoming especially excited over the results. For instance, there is a great reduction of the barrier that their different terminologies used to represent, where one specialist couldn&#x27;t really apply his experience, intuition, or conceptual feel very well unless the situation could be stated and framed in his accustomed manner, and yet the others couldn&#x27;t work with his terminology. Here, they meet at their concept and terminology interface and work out little shifts in meaning and use which each can find digestible in his system, and which permit quite precise definitions in each system of the terms and concepts in the others. In studying the other&#x27;s structuring then, either of them can have his own definitions automatically substituted for the other&#x27;s special terms. Reduce this language barrier, and provide the feature of their being able to work in parallel independence on the joint structure, and what seems to result is amplification of their different capabilities.&quot;
  },
  &quot;3b9d&quot;: {
    &quot;id&quot;: &quot;p_374&quot;,
    &quot;zh&quot;: &quot;“还记得文献中与一般结构化理论联系在一起的‘协同作用’这个词吗？这里就有一个例子。三个人以这种增强方式共同解决复杂问题，其效能似乎超过一个得到增强的人独自工作的三倍；也许，还能达到三个条件相似、但没有这种计算机增强的人共同工作时的十倍。和一些优秀的人这样独立并行地工作，是一种全新而令人振奋的体验。我们觉得，这些增强发展对于群体方法和群体能力的影响，实际上会比对于个人方法和能力的影响更显著。我们非常希望加强这一方向的研究。”&quot;,
    &quot;en&quot;: &quot;\&quot;Remember the term, synergesis, that has been associated in the literature with general structuring theory? Well, here is something of an example. Three people working together in this augmented mode seem to be more than three times as effective in solving a complex problem as is one augmented person working alone—and perhaps ten times as effective as three similar men working together without this computer-based augmentation. It is a new and exhiliarating experience to be working in this independent-parallel fashion with some good men. We feel that the effect of these augmentation developments upon group methods and group capability is actually going to be more pronounced than the effect upon individuals methods and capabilities, and we are very eager to increase our research effort in that direction.\&quot;&quot;
  },
  &quot;3c&quot;: {
    &quot;id&quot;: &quot;p_397&quot;,
    &quot;zh&quot;: &quot;现在，请退出刚才那场讲解演示中你所扮演的角色。这段经历的设计目的，是让你感受到：在我们看来，从这个概念框架出发，可以预期哪些类型的未来发展。第二章试图以“直陈”的方式，介绍框架中不同的概念部分；第三章则希望补充这种正式论述，让你更完整地了解我们的观察方向，以及推动我们前进的种种可能性。&quot;,
    &quot;en&quot;: &quot;Let yourself be disengaged now from your role in the above discussion-demonstration. You have been through an experience that was designed to give you a feel for the sort of future developments that (to us) are predictable from our conceptual framework. What is presented in Section II is an attempt at giving a \&quot;straight\&quot; presentation of the various conceptual segments of this framework, and Section III hopefully supplemented the formal presentation to provide you with a more complete picture of how we are oriented and what sorts of possibilities impel us.&quot;
  },
  &quot;4a1&quot;: {
    &quot;id&quot;: &quot;p_401&quot;,
    &quot;zh&quot;: &quot;本报告提出了一个假说：人的智力活动效能，取决于一些可以直接重新设计的因素；通过重新设计这些因素，就可能提高这种效能。我们提供了一个概念框架，帮助考察这一假说；又以较大篇幅，从个人使用的角度推演未来可能的发展，使读者感受到假说和概念结构中蕴含的可能性与前景。&quot;,
    &quot;en&quot;: &quot;The report has put forth the hypothesis that the intellectual effectiveness of a human being is dependent upon factors which are subject to direct redesign in pursuit of an increase in that effectiveness. A conceptual framework is offered to help in giving consideration to this hypothesis, and an extensive and personalized projection into possible future developments is presented to help develop a feeling for the possibilities and promise implicit in the hypothesis and conceptual structure.&quot;
  },
  &quot;4a2&quot;: {
    &quot;id&quot;: &quot;p_402&quot;,
    &quot;zh&quot;: &quot;如果这一假说及其令人振奋的推演，在未来发展中得到证实，那么结果将极其激动人心，并且可以认为，会造福于这个问题重重的世界。现在需要做的，是检验假说，并衡量：从整体系统设计的角度关注人的智力活动效能，究竟能带来什么收益，或者是否真的能带来收益。如果检验和衡量的结果是积极的，我们就可以着手，为问题解决者开发越来越好的增强系统。&quot;,
    &quot;en&quot;: &quot;If this hypothesis and its glowing extrapolations were borne out in future developments, the consequences would be most exciting and assumedly beneficial to a problem-laden world. What is called for now is a test of this hypothesis and a calibration on the gains if any that might be realized by giving total-system design attention to human intellectual effectiveness. If the test and calibration proved to be favorable, then we can set to work developing better and better augmentation systems for our problem solvers.&quot;
  },
  &quot;4a3&quot;: {
    &quot;id&quot;: &quot;p_403&quot;,
    &quot;zh&quot;: &quot;因此，我们建议开展一项研究计划，面向三个目标：目标1，检验这一假说；目标2，开发用于设计更好增强系统的工具与技术；目标3，开发能用于现实世界的增强系统，在今后若干年中，尽可能帮助那些解决艰难而关键问题的人。诚然，这些目标，以及由此形成的追求目标的设计，具有理想化色彩；但它们仍然包含有价值的内容。&quot;,
    &quot;en&quot;: &quot;In this light, we recommend a research program approach aimed at (Goal 1) testing the hypothesis, (Goal 2) developing the tools and techniques for designing better augmentation systems, and (Goal 3) producing real-world augmentation systems that bring maximum gains over the coming years to the solvers of tough, critical problems. These goals and the resulting design for their pursuit are idealized, to be sure, but the results nonetheless have valuable aspects.&quot;
  },
  &quot;4b1&quot;: {
    &quot;id&quot;: &quot;p_405&quot;,
    &quot;zh&quot;: &quot;这应当是一种基于整体系统的经验性研究途径。也就是说，对纳入问题范围的全部因素，协调地开展研究与创新，并通过实验，使这些变量在真实条件下发挥作用、相互影响。如何限定这些因素，将在本章稍后讨论。对于这种经验性、整体系统的研究，我们建议的环境，是一个实验室，配有大致类似第三章B节所描述的、由计算机支持的显示与通信系统。所提供的能力不应吝啬：弄清某个器具功能对整个系统可能有什么价值，非常重要；而知道其价值的唯一途径，就是实际试验它。这个阶段，不应花时间为同时向许多使用者提供实时服务，而对分时技术作复杂改进。那类开发，应作为独立的支撑性工作进行。实验室应采取立即可行的措施，为实验环境中的人提供他所需要的全部服务。&quot;,
    &quot;en&quot;: &quot;This should be an empirical approach on a total-system basis—i.e., doing coordinated study and innovation, among all the factors admitted to the problem, in conjunction with experiments that provide realistic action and interplay among these variables. The question of limiting these factors is considered later in the section. The recommended environment for this empirical, total-system approach, is a laboratory providing a computer-backed display and communication system of the general sort described in Section III-B. There should be no stinting on the capabilities provided—it is very important to learn what value any given artifact feature may offer the total system, and the only way to learn the value is to experiment with the feature. At this point no time will be taken to develop elaborate improvements in the art of time sharing, to provide real-time service to many users. This kind of development should be done as separate, backup work. The experimental lab should take the steps that are immediately available to provide all the service to the human that he needs in the experimental environment.&quot;
  },
  &quot;4b2&quot;: {
    &quot;id&quot;: &quot;p_406&quot;,
    &quot;zh&quot;: &quot;如果出于经济考虑，不能让计算机在实验参与者不用它时闲置——这部分时间可能占总时间相当大的比例——而与其他实时使用者共享又会造成请求延迟，那么唯一应考虑的共享方式，就是与没有实时服务要求的脱机计算共享。只要联机工作者需要任何服务，计算机就可以立即放下脱机用户的任务，转来响应他。&quot;,
    &quot;en&quot;: &quot;Where economy demands that a computer not be idle during the time the augmented subject is not using it (which would be a rather large net fraction of the time, probably), and where sharing the computer with other real-time users for which demand delays are a problem, then the only sharing that should be considered is that with off-line computations for which there are no real-time service demands to be met. The computer can turn away from off-line users whenever the on-line worker needs attention of any sort.&quot;
  },
  &quot;4c1a&quot;: {
    &quot;id&quot;: &quot;p_409&quot;,
    &quot;zh&quot;: &quot;1. 程序员处理的许多问题，包括规模大而且真实的问题，都可以在不与其他人交互的情况下解决。这使实验问题简单一些。&quot;,
    &quot;en&quot;: &quot;The programmer works on many problems, including large and realistic ones, which can be solved without interaction with other humans. This eases the experimental problem.&quot;
  },
  &quot;4c1c&quot;: {
    &quot;id&quot;: &quot;p_411&quot;,
    &quot;zh&quot;: &quot;3. 程序员的许多工作数据，本身就是计算机程序；当然，我们假定他也有自己的推理和规划笔记。程序具有明确、不含歧义的句法和语义形式，因此很容易让计算机针对这些工作数据，为程序员完成有用任务。这非常有利于我们尽早获得经验，了解人能从这类计算机帮助中得到什么价值。&quot;,
    &quot;en&quot;: &quot;Much of the programmer&#x27;s working data are computer programs (he also has, we assume, his own reasoning and planning notes), which have unambiguous syntactic and semantic form so that getting the computer to do useful tasks for him on his working data will be much facilitated—which helps very much to get early experience on the value a human can derive from this kind of computer help.&quot;
  },
  &quot;4c1d&quot;: {
    &quot;id&quot;: &quot;p_412&quot;,
    &quot;zh&quot;: &quot;4. 与大多数其他复杂问题解决者相比，程序员相对于其他程序员的效能，可能更容易衡量。例如，除了程序，很少有其他复杂的解决方案或设计，能如此容易地接受“它实际上能运行吗？”这样的严格检验。&quot;,
    &quot;en&quot;: &quot;A programmer&#x27;s effectiveness, relative to other programmers, can probably be measured more easily than would be the case for most other complex-problem solvers. For example, few other complex solutions or designs beside a program can so easily be given the rigorous test of \&quot;Does it actually work?\&quot;&quot;
  },
  &quot;4c1h&quot;: {
    &quot;id&quot;: &quot;p_416&quot;,
    &quot;zh&quot;: &quot;8. 程序员是“现实世界”中最自然的首批使用者，适合率先采用我们正在考虑的这类增强手段。他们已经懂得怎样按形式化的方法体系与计算机共同工作，而且大多数人从事的活动，无论如何本来就需要计算机。因此，新的技术、概念、方法和设备，对他们来说不至于显得太过陌生，学习和获取也相对容易。&quot;,
    &quot;en&quot;: &quot;Computer programmers are a natural group to be the first in the \&quot;real world\&quot; to incorporate the type of augmentation means we are considering. They already know how to work in formal methodologies with computers, and most of them are associated with activities that have to have computers anyway, so that the new techniques, concepts, methods, and equipment will not seem so radical to them and will be relatively easy for them to learn and acquire.&quot;
  },
  &quot;4c1i&quot;: {
    &quot;id&quot;: &quot;p_417&quot;,
    &quot;zh&quot;: &quot;9. 成功的成果可以用回增强研究计划本身，提高研究与开发增强系统时所需的计算机编程活动的效能。设计、实现和修改计算机程序的能力，对研究进展的速度将非常重要。&quot;,
    &quot;en&quot;: &quot;Successful achievements can be utilized within the augmentation-research program itself, to improve the effectiveness of the computer programming activity involved in studying and developing augmentation systems. The capability of designing, implementing, and modifying computer programs will be very important to the rate of research progress.&quot;
  },
  &quot;4c2&quot;: {
    &quot;id&quot;: &quot;p_418&quot;,
    &quot;zh&quot;: &quot;增强研究实验室的工作者，是最自然不过的首批使用者，可以最先使用他们自己开发的增强手段。我们认为，提高这群人的工作效能，具有极其重要的意义。&quot;,
    &quot;en&quot;: &quot;Workers in an augmentation-research laboratory are the most natural people in the world to be the very first users of the augmentation means they develop, and we think that they represent an extremely important group of people to make more effective at their work.&quot;
  },
  &quot;4d1&quot;: {
    &quot;id&quot;: &quot;p_420&quot;,
    &quot;zh&quot;: &quot;上述第9条理由提出的特征，对研究目标具有极大价值：把积极的研究成果反馈回来，改善研究者自己开展工作的手段。随着本章推进，读者会看清，我们描述的计划，正是为了尽可能充分利用这一特征。这种正反馈，也就是循环强化的可能性，来自两个事实：第一，我们的研究者正在开发手段，提高人处理复杂智力问题的效能；第二，我们的研究者自己，也正在处理复杂的智力问题。换言之，他们是在为一个自己也属于其中的群体，开发更好的工具。如果最初工作需要集中于一种具体工具，以形成统一焦点，那就选择一种对研究者重要、改进后确实能帮助他们自身工作的工具。&quot;,
    &quot;en&quot;: &quot;The feature brought forth in Reason 9 above is something that offers tremendous value to the research objectives—i.e., the feeding back of positive research results to improve the means by which the researchers themselves can pursue their work The plan we are describing here is designed to capitalize upon this feature as much as possible, as will be evident to the reader as he progresses through this section. This positive-feedback (or regenerative) possibility derives from the facts that: (1) our researchers are developing means to increase the effectiveness of humans dealing with complex intellectual problems, and (2) our researchers are dealing with complex intellectual problems. In other words, they are developing better tools for a class to which they themselves belong. If their initial work needs the unifying focus of concentrating upon a specific tool, let that tool be one important to them and whose improvement will really help their own work.&quot;
  },
  &quot;4f1&quot;: {
    &quot;id&quot;: &quot;p_427&quot;,
    &quot;zh&quot;: &quot;活动A1的首要目标，也就是图3中的目标1，是检验我们的假说。增强程序员能力这一总体探索，既为这个目标服务，也为日后直接追求目标2和目标3作准备：开发增强研究所需的工具与技术，以及生产适用于现实世界的增强系统。&quot;,
    &quot;en&quot;: &quot;The dominant goal of Activity A 1 (Goal 1, as in Fig 3) is to test our hypothesis. Its general pursuit of augmenting a programmer is designed to serve this goal, but also to be setting the stage for later direct pursuit of Goals 2 and 3 (i.e., developing tools and techniques for augmentation research and producing real-world augmentation systems).&quot;
  },
  &quot;4f3&quot;: {
    &quot;id&quot;: &quot;p_429&quot;,
    &quot;zh&quot;: &quot;现在，我们仍然坚持长期和全局规划的精神，但看法有所不同。原因之一，是我们更充分地认识到利用循环强化的可能性。因此，我们现在建议一条相当不同的途径。基本要求是，A1研究应遵守为实现以下两点所必需的正式方法体系：一，知道什么时候确实提高了效能；二，知道怎样比较两项相互竞争的创新所产生改变的相对价值。&quot;,
    &quot;en&quot;: &quot;Still in the spirit of the long-range and global sort of planning, but with a different outlook (based, among other things, upon an increased appreciation for the possibilities of capitalizing upon regeneration), we would now recommend that the approach be quite different. We basically recommend A 1 research adhering to whatever formal methodology is required for (a) knowing when an improvement in effectiveness has been achieved, and (b) knowing how to assign relative value to the changes derived from two competing innovations.&quot;
  },
  &quot;4f4&quot;: {
    &quot;id&quot;: &quot;p_430&quot;,
    &quot;zh&quot;: &quot;除此之外，只要参与者忠于目标，有相当的成熟度，并具备充沛的精力、智力和想象力，我们建议放手让一个四至六人的小组，或者若干这样的小组，开发增强自己编程能力的手段。工作可以先从第三章B节第2小节描述的方式开始，发展构写和修改简单符号结构的能力；再沿着一系列中间能力层层上升，最终达到那个涵盖计算机编程的高层能力。这样，他们那门刚刚萌芽、自由探索的“增强研究技艺”，就能在一连串越来越复杂的系统问题中成长，并逐步解决自身的毛病。而且，从底向上重新设计一个层级体系，看来也确实是最好的途径。&quot;,
    &quot;en&quot;: &quot;Beyond this, and assuming dedication to the goal, reasonable maturity, and plenty of energy, intelligence, and imagination, we would recommend turning loose a group of four to six people (or a number of such groups) to develop means that augment their own programming capability We would recommend that their work begin by developing the capability for composing and modifying simple symbol structures, in the manner pictured in Section III-B-2, and work up through a hierarchy of intermediate capabilities toward the single high-level capability that would encompass computer programming. This would allow their embryonic and free wheeling \&quot;art of doing augmentation research\&quot; to grow and work out its kinks through a succession of increasingly complex system problems—and also, redesigning a hierarchy from the bottom up somehow seems the best approach&quot;
  },
  &quot;4f5&quot;: {
    &quot;id&quot;: &quot;p_431&quot;,
    &quot;zh&quot;: &quot;至于应该告诉他们，要擅长哪一种编程，答案是：“你们在研究中发现自己必须做的那种编程。”换句话说，他们的工作任务，就是开发使自己更有效完成工作的手段。图4对此作了示意。在图3的基础上，多了一条联系：把研究的对象成果，也就是针对他们那类编程问题的增强手段，直接反馈到研究活动中，成为研究者自己使用的改进工具与技术。&quot;,
    &quot;en&quot;: &quot;As for the type of programming to tell them to become good at—tell them, \&quot;the kind that you find you have to do in your research.\&quot; In other words, their job assignment is to develop means that will make them more effective at doing their job. Figure 4 depicts this schematically, with the addition to what was shown in Figure 3 of a connection that feeds the subject-matter output of their research (augmentation means for their type of programming problems) right back into their activity as improved tools and techniques to use in their research.&quot;
  },
  &quot;4f6&quot;: {
    &quot;id&quot;: &quot;p_433&quot;,
    &quot;zh&quot;: &quot;如果他们正在取得进展，就不需要精雕细琢的效能标准，也不需要特别复杂的测量技术，就能看出：使用增强手段，比不使用时更有效。例如，他们能够更快地“设计并构建”一个可运行的程序，满足给定处理规格；或者，更快接手一个复杂的已有程序，形成必要理解，找出缺陷，或者重新构建它。另一方面，如果一年左右以后仍然没有明显收益，那么就该在研究方式中加入更多科学性。到那时，我们对于要运用“科学”来处理的问题性质，也已经有了相当的基本认识。&quot;,
    &quot;en&quot;: &quot;If they are making head way, it won&#x27;t take any carefully worded criterion of effectiveness nor any great sophistication in measurement technique to tell that they are more effective with the augmentation means than without—being quicker to \&quot;design and build\&quot; a running program to meet given processing specifications or being quicker to pick up a complex existing program, gain comprehension as necessary, and find its flaws or rebuild it. On the other hand, if no gains are really obvious after a year or so, then it is time to begin incorporating more science in their approach. By then there will be a good deal of basic orientation as to the nature of the problem to which \&quot;science\&quot; is to be applied.&quot;
  },
  &quot;4f7&quot;: {
    &quot;id&quot;: &quot;p_434&quot;,
    &quot;zh&quot;: &quot;从某种意义上说，我们建议，这个小组建立的增强能力层级体系，应当更像一副快速搭起的粗略脚手架，而不是一座精心设计的工程结构。先迅速爬上去看一眼，所得到的方向感可能极有价值。例如，起初认定的关键概念，如果沿着严密工程的路线推进，本来可能会被费尽心力地铆进结构里；但从层级体系较高处看到的“景象”，却可能让它们显得已经过时。此外，似乎也最好先把快速、粗略的改进做出来并用起来。这样，研究不仅能从获得的方向感受益，还能把这些改进作为工具与技术，用来处理更困难、进展更慢的可能性。随着目标1取得进展，图3就会发生变化：研究对象的输出成果，也就是给程序员使用的增强手段，被反馈到输入端，成为研究者的新工具与技术。&quot;,
    &quot;en&quot;: &quot;What we are recommending in a way is that the augmented capability hierarchy built by this group represent more a quick and rough scaffolding than a carefully engineered structure. There is orientation to be derived from climbing up quickly for a look that will be of great value. For instance, key concepts held initially, that would have been laboriously riveted into the well-engineered structure, could well be rendered obsolete by the \&quot;view\&quot; obtained from higher in the hierarchy. And besides, it seems best to get the quick and rough improvements built and working first, so that the research will benefit not only from the orientation obtained, but from the help that these improvements will provide when used as tools and techniques to tackle the tougher or slower possibilities. As progress begins to be made toward Goal 1, the diagram of Figure 3 will become modified by feeding the subject-matter output (augmentation means for computer programmers) back into the input as new tools and techniques to be used by the researchers.&quot;
  },
  &quot;4f8&quot;: {
    &quot;id&quot;: &quot;p_435&quot;,
    &quot;zh&quot;: &quot;我们建议，在A1内部设立一项子活动，专门负责关注整体活动，评估其进展，并尽力提供方向上的判断：目前处于什么状态，把注意力投向哪里可能有益。&quot;,
    &quot;en&quot;: &quot;We would suggest establishing a sub-activity within A 1, whose purpose and responsibility is to keep an eye on the total activity, assess and evaluate its progress and try to provide orientation as to where things stand and where attention might be beneficial.&quot;
  },
  &quot;4g1&quot;: {
    &quot;id&quot;: &quot;p_439&quot;,
    &quot;zh&quot;: &quot;A1的研究也许能够无限地螺旋上升；但一旦假说得到合理验证，见第四章A节，也就是我们提出的第一个目标已经实现，最好就重新组织计划。为了说明建议，不妨设立A2和A3两项研究活动，取代A1。究竟是把A1一分为二，还是把A1改为A2，再另组一个A3小组，在这里并不重要。我们说的是分别承担不同目标、又能从密切合作中受益的两种活动。&quot;,
    &quot;en&quot;: &quot;The research of A 1 could probably spiral upwards indefinitely, but once the hypothesis (see Section IV-A) has been reasonably verified and the first of our stated objectives satisfied, it would be best to re-organize the program. To describe our recommendation here, let us say that two research activities, A 2 and A 3, are set up in place of A 1. Whether A 1 is split, or turned into A 2 and a new group formed for A 3, does not really matter here—we are speaking of separate activities, corresponding to the responsible pursuit of separate goals, that will benefit from close cooperation.&quot;
  },
  &quot;4g10&quot;: {
    &quot;id&quot;: &quot;p_449&quot;,
    &quot;zh&quot;: &quot;换句话说，CAUG-I是一套基本的问题解决工具箱，外加一套辅助性的“工具制造者工具箱”；借助后者，可以扩展基本工具箱，使它适配特定工作与特定工作者。在后续阶段，A3可以接连推出CAUG-II、CAUG-III等各代系统；每一代都纳入新的特点，以越来越高效的方式，把越来越强大的能力层级体系，与人的基本能力匹配起来。&quot;,
    &quot;en&quot;: &quot;In other words, CAUG-I represents a basic problem-solving tool kit, plus an auxiliary tool-makers tool kit with which to extend the basic tool kit to match the particular job and particular worker. In subsequent phases, Activity A 3 could be turning out successive generations (CAUG-II, CAUG-III, etc.) each incorporating features that match an ever-more-powerful capability hierarchy in an ever-more-efficient manner to the basic capabilities of the human.&quot;
  },
  &quot;4g2&quot;: {
    &quot;id&quot;: &quot;p_440&quot;,
    &quot;zh&quot;: &quot;把开发增强手段的工作分配给A2，专门供A2和A3的研究者作为工具与技术使用。这就建立了对第四章A节目标2的持续追求。A2还应设立一项子活动，研究A2和A3全体工作者面对的问题，陆续找出需要增强的能力，由A2开发相应手段。A2应配备实验室所能获得的最佳器具。&quot;,
    &quot;en&quot;: &quot;To Activity A 2 assign the job of developing augmentation means to be used specifically as tools and techniques by the researchers of both A 2 and A 3. This establishes a continuing pursuit for Objective 2 of Section IV-A. A 2 will now set up a sub-activity that studies the problems of all the workers in A 2 and A 3 and isolates a succession of capabilities for which the research of A 2 will develop means to augment. Activity A 2 should be equipped with the best artifacts available to an experimental laboratory.&quot;
  },
  &quot;4g3&quot;: {
    &quot;id&quot;: &quot;p_441&quot;,
    &quot;zh&quot;: &quot;把开发能够实际采用到现实问题情境中的增强系统的工作分配给A3。这就为第四章A节的目标3，建立了直接而持续的推进活动。可以假定，A3设计的第一个现实系统，将面向程序员。为此，它很可能可以整理完善A1开发的“实验室模型”，根据现实中的经济条件、工作环境等实际限制加以修改，作为供实际采用的原型；也可能吸收第一个模型的经验，重新设计。&quot;,
    &quot;en&quot;: &quot;To Activity A 3 assign the job of developing augmentation systems that can be practically adopted into real-world problem situations. This provides a direct and continuing pursuit of Goal 3 of Section IV-A. It is to be assumed that the first real-world system that A 3 will design will be for computer programmers. For this it might well be able to clean up the \&quot;laboratory model\&quot; developed in A 1, modify it to fit the practical limitations represented by real-world economics, working environments, etc., and offer it as a prototype for practical adoption. Or Activity A 3 might do a redesign, benefitting from the experience with the first model.&quot;
  },
  &quot;4g4&quot;: {
    &quot;id&quot;: &quot;p_442&quot;,
    &quot;zh&quot;: &quot;A3需要一项子活动，研究潜在使用者，为持续开发提供指导。A2在理想化环境中不断追求工作者效能的提高，将成为A3开发所需基本研究对象材料，以及工具与技术的来源。凭借A2不断扩展的知识与成果，A3可以陆续组织出适用范围越来越广的实用系统。&quot;,
    &quot;en&quot;: &quot;Activity A 3 will need a subactivity to study its potential users and guide the succession of developments that it pursues. Activity A 2 in its continued pursuit of increased effectiveness among workers in idealized environment, will be the source for basic subject matter in the developments of A 3, as well as for its tools and techniques. From the continuously expanding knowledge and developments of A 2, A 3 can organize successive practical systems suitable for ever more general utilization.&quot;
  },
  &quot;4g5&quot;: {
    &quot;id&quot;: &quot;p_443&quot;,
    &quot;zh&quot;: &quot;我们此前假定，A1开发的主要是语言和方法体系，研究期间不会显著改变器具。到第二阶段时，我们对于这种联机人机合作的趋势与可能性，已经有了足够认识，可以提出有根据的指导：怎样修改和扩展器具能力，最有价值。A2可以继续为设备发展提供长期指导，也许会在实验室里开发计算机、显示系统、存储系统或通信系统的创新；至少，也应试验把别人提出的新器具创新纳入系统。&quot;,
    &quot;en&quot;: &quot;We have assumed that what was developed in A 1 was primarily language and methodology, with the artifacts not being subject to appreciable modification during the research. By this second phase, enough has been learned about the trends and possibilities for this type of on-line man-computer cooperation that some well-based guidance can be derived for the types of modifications and extensions to artifact capability that would be most valuable. Activity A 2 could continue to derive long-range guidance for equipment development, perhaps developing laboratory innovations in computers, display systems, storage systems, or communication systems, but at least experimenting with the incorporation of the new artifact innovations of others.&quot;
  },
  &quot;4g7&quot;: {
    &quot;id&quot;: &quot;p_445&quot;,
    &quot;zh&quot;: &quot;显然，本报告来自一种概括性的“大视野”思考。为了把研究建议推进到某种总体图景，我们给出图5。到这里，它大体上已经不言自明。A2通过自举，不断提高自身智力能力；其成果则通过A3流向外部世界。到那时，让这些新技术得到接受，并用于解决社会最关键的问题，事实上可能本身就是最关键的问题。因此，A4这项活动，应当得到A3的特别帮助。&quot;,
    &quot;en&quot;: &quot;It is obvious that this report stems from generalized \&quot;large-view\&quot; thinking. To carry this to something of a final view, relative to the research recommendations, we present Figure 5, which should be largely self-explanatory by this time. Activity A 2 is lifting itself by the bootstraps up the scale of intellectual capability, and its products are siphoned to the world via A 3. Getting acceptance and application of the new techniques to the most critical problems of our society might in fact be the most critical problem of all by then, and Activity A 4 would be one which should be given special help from A 3.&quot;
  },
  &quot;4g8&quot;: {
    &quot;id&quot;: &quot;p_446&quot;,
    &quot;zh&quot;: &quot;还有一幅一般性、长期性的图景需要提出。它涉及一个实用系统目标，A3应当争取尽早实现。我们可以把它叫作第一个通用计算机增强系统：CAUG-I，读作“cog-one”。&quot;,
    &quot;en&quot;: &quot;There is another general and long-range picture to present. This is in regard to a goal for a practically usable system that A 3 would want to develop as soon as possible. You might call this the first general Computer Augmentation System—CAUG-I (pronounced \&quot;cog-one\&quot;).&quot;
  },
  &quot;4g9&quot;: {
    &quot;id&quot;: &quot;p_448&quot;,
    &quot;zh&quot;: &quot;这个系统将来自一套经评估后确定的基本能力：一般问题解决者与增强研究者，都需要这些能力。把CAUG-I交给几乎任何学科中的现实问题解决者，他就能获得构建论证和计划、组织专门档案等基本能力；几乎任何人都可能需要这些能力。不过，除了这些可直接应用的能力，系统还应提供分析问题任务、开发和评价新过程能力等所需的能力，使他能够扩展CAUG-I，适配自己问题领域的特殊性质，以及自己喜欢的工作方式。&quot;,
    &quot;en&quot;: &quot;It would be derived from what was assessed to be the basic set of capabilities needed by both a general-problem-solving human and an augmentation researcher. Give CAUG-I to a real-world problem solver in almost any discipline, and he has the basic capabilities for structuring his arguments and plans, organizing special files, etc., that almost anyone could expect to need. In addition to these direct-application on capabilities, however, are provided those capabilities necessary for analyzing problem tasks, developing and evaluating new process capabilities, etc., as would be required for him to extend the CAUG-I system to match to the special features of his problem area and the way he likes to work.&quot;
  },
  &quot;5a&quot;: {
    &quot;id&quot;: &quot;p_451&quot;,
    &quot;zh&quot;: &quot;本报告讨论了增强人类智力的一种整体观点，完成了四件事：提出一个假说；构建一个概念框架；描绘一幅得到增强的人的“图景”；概述一条研究途径。下面作简要回顾。&quot;,
    &quot;en&quot;: &quot;This report has treated one over-all view of the augmentation of human intellect. In the report the following things have been done: (1) An hypothesis has been presented. (2) A conceptual framework has been constructed. (3) A \&quot;picture\&quot; of augmented man has been described. (4) A research approach has been outlined. These aspects will be re viewed here briefly:&quot;
  },
  &quot;5a1&quot;: {
    &quot;id&quot;: &quot;p_452&quot;,
    &quot;zh&quot;: &quot;1. 我们提出一个假说：以类似工程的方法，重新设计系统中可改变的组成部分，能够显著提高人的智力活动效能。&quot;,
    &quot;en&quot;: &quot;An hypothesis has been stated that the intellectual effectiveness of a human can be significantly improved by an engineering-like approach toward redesigning changeable components of a system.&quot;
  },
  &quot;5a2e&quot;: {
    &quot;id&quot;: &quot;p_458&quot;,
    &quot;zh&quot;: &quot;（e）把与每时每刻的心智过程相联系的符号操作自动化，似乎是智力能力演化合乎逻辑的下一步。&quot;,
    &quot;en&quot;: &quot;The automation of the symbol manipulation associated with the minute-by-minute mental processes seems to offer a logical next step in the evolution of our intellectual capability.&quot;
  },
  &quot;6c&quot;: {
    &quot;id&quot;: &quot;p_464&quot;,
    &quot;zh&quot;: &quot;第二，我们提出的思想，应当同时从上述两方面来考虑：一是直接发展能力，二是发展“发展能力的技艺”。这些可能性当然具有长期意义，但探索它们并取得初步收益，现在就可以开始。在我们看来，不必等到弄清人类心智过程怎样运作，也不必等到学会把计算机造得更“聪明”、更大或更快；凭借现有的知识与条件，就可以开始开发强大而经济可行的增强系统。对更深的基础知识和更好机器的追求，将持续到无限的未来，也需要不断纳入这门“技艺”及其改进后的增强系统。但是，现在就开始，不仅能为这些探索提供方向与刺激，也能先提高我们的问题解决效能，帮助我们开展这些探索。&quot;,
    &quot;en&quot;: &quot;Second, the ideas presented are to be considered in both of the above senses: the direct-development sense and the \&quot;art of development\&quot; sense. To be sure, the possibilities have long-term implications, but their pursuit and initial rewards await us now. By our view, we do not have to wait until we learn how the human mental processes work, we do not have to wait until we learn how to make computers more \&quot;intelligent\&quot; or bigger or faster, we can begin developing powerful and economically feasible augmentation systems on the basis of what we now know and have. Pursuit of further basic knowledge and improved machines will continue into the unlimited future, and will want to be integrated into the \&quot;art\&quot; and its improved augmentation systems—but getting started now will provide not only orientation and stimulation for these pursuits, but will give us improved problem-solving effectiveness with which to carry out the pursuits.&quot;
  },
  &quot;6d&quot;: {
    &quot;id&quot;: &quot;p_465&quot;,
    &quot;zh&quot;: &quot;第三，越来越清楚的是，我们现在就应行动，而且越早越好；多个研究群体，都应积极地、大规模地采取行动。我们提出了一个概念框架和一项行动计划，建议认真考虑，把它们作为行动基础。如果经过考虑认为不能接受，那么至少也应持续、严肃地努力，发展一个更可接受的概念框架，以考察整体途径；或者发展一项更可接受的行动计划；也可以两者并进。&quot;,
    &quot;en&quot;: &quot;Third, it becomes increasingly clear that there should be action now—the sooner the better—action in a number of research communities and on an aggressive scale. We offer a conceptual framework and a plan for action, and we recommend that these be considered carefully as a basis for action If they be considered but found unacceptable, then at least serious and continued effort should be made toward developing a more acceptable conceptual framework within which to view the over-all approach, toward developing a more acceptable plan of action, or both.&quot;
  },
  &quot;6e&quot;: {
    &quot;id&quot;: &quot;p_466&quot;,
    &quot;zh&quot;: &quot;这是向研究者，以及最终激励、资助或领导他们的人发出的公开呼吁：请认真关注一种可能性，发展一门充满活力的学科，从整体意义上处理提高智力活动效能的问题。这门学科应致力于形成持续的改进循环：加深对问题的理解，改善开发新增强系统的手段，开发更好的增强系统，既为世界上的问题解决者服务，也特别为这门学科自身的工作者服务。毕竟，我们已经为旨在理解和利用核能的学科投入巨额经费。为什么不考虑发展一门旨在理解和利用“神经力量”的学科？从长远看，在这两种力量中，人类智力的力量，实际上重要得多。&quot;,
    &quot;en&quot;: &quot;This is an open plea to researchers and to those who ultimately motivate, finance, or direct them, to turn serious attention toward the possibility of evolving a dynamic discipline that can-treat the problem of improving intellectual effectiveness in a total sense. This discipline should aim at producing a continuous cycle of improvements—increased understanding of the problem, improved means for developing new augmentation systems, and improved augmentation systems that can serve the world&#x27;s problem solvers in general and this discipline&#x27;s workers in particular. After all, we spend great sums for disciplines aimed at understanding and harnessing nuclear power. Why not consider developing a discipline aimed at understanding and harnessing \&quot;neural power?\&quot; In the long run, the power of the human intellect is really much the more important of the two.&quot;
  }
};

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;

    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );

    storage = null;

    widgetState: state,

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;

      if (!Number.isSafeInteger(data.id) || data.id <= 0) {

          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));

      }

        typeof height === "number" &&
        Number.isFinite(height) &&

      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );

})();
