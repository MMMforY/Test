    &quot;en&quot;: &quot;We can confidently expect the development of much more powerful concepts pertaining to the manner in which symbol structures can be manipulated and portrayed, and correspondingly more complex manipulation processes that in the first pass would have been beyond the human&#x27;s power to organize and execute without the better symbol, concept, and mental structuring which his augmented system provided him. These new concepts and processes, beyond our present capabilities to use and thus never developed, will provide a tremendous increased-capability payoff in the future development of our augmentation means.&quot;
  },
  &quot;2c5d2&quot;: {
    &quot;id&quot;: &quot;p_158&quot;,
    &quot;zh&quot;: &quot;考察能力库层级体系中某一层次上的一项能力，称它为“能力1”。构成它的较低阶能力，似乎可以按一种相对固定的方式归为两类：我们不妨称之为“统筹类”和“直接贡献类”。统筹类包括理解、规划和执行能力1所代表过程时所使用的能力；直接贡献类则包括由统筹类组织起来、直接实现能力1的那些能力。例如，电话响了，我拿起听筒并说“喂”，这就是直接贡献过程。统筹过程先理解当前情境，再指示一个较低阶的统筹过程去拿起听筒；等听筒拿到位，即第一个过程完成后，又指示执行下一个过程，也就是说“喂”。这就构成了我接电话的能力。&quot;,
    &quot;en&quot;: &quot;Consider a given capability (Capability 1) at some level in the repertoire hierarchy. There seems to be a sort of standard grouping of lower-order capabilities from which this is composed, and these exist in two classes—what we might call the executive class and what we might call the direct-contributive class. In the executive class of capabilities we find those used for comprehending, planning, and executing the process represented by Capability 1. In the direct-contributive class we find the capabilities organized by the executive class toward the direct realization of Capability 1. For example, when my telephone rings, I execute the direct-contributive processes of picking up the receiver and saying hello. It was the executive processes that comprehended the situation, directed a lower-order executive-process that the receiver be picked up and, when the receiver was in place (first process accomplished), directed the next process, the saying hello. That represents the composition of my capability for answering the phone.&quot;
  },
  &quot;2c5e1&quot;: {
    &quot;id&quot;: &quot;p_165&quot;,
    &quot;zh&quot;: &quot;H-LAM/T系统的最终能力，依托于过程能力的能力库层级体系。这个层级体系很像层层叠叠的白领人才，位于实际劳动者之上，支配着后者的才干。为了说明这种统筹上层结构，我们可以把它想象成一个承包商与分包商的网络：能力库层级体系中的每一项能力，都由一个独立承包商来代表；他的工作方式是制定计划、拟定规格要求、把实际工作分包出去，并监督分包商的表现。这意味着，每个分包商也依次做着同样的事情。在这个层级体系的最底端，才是那些实际从事“生产工作”的独立承包商。&quot;,
    &quot;en&quot;: &quot;It is the repertoire hierarchy of process capabilities upon which the ultimate capability of the H-LAM/T system rests. This repertoire hierarchy is rather like a mountain of white-collar talent that sits atop and controls the talents of the workers. We can illustrate this executive superstructure by considering it as though it were a network of contractors and subcontractors in which each capability in the repertoire hierarchy is represented by an independent contractor whose mode of operation is to do the planning, make up specifications, subcontract the actual work, and supervise the performance of his subcontractors. This means that each subcontractor does the same thing in his turn. At the bottom of this hierarchy are those independent contractors who do actual \&quot;production work.\&quot;&quot;
  },
  &quot;2c5e5&quot;: {
    &quot;id&quot;: &quot;p_169&quot;,
    &quot;zh&quot;: &quot;H-LAM/T系统往往以多轮推进的方式，也就是反复试探的方式，执行复杂过程。在真正复杂的情境中，理解与解决办法并不会等候在一条笔直道路的尽头；相反，随着理解加深，新的可能性不断出现，计划也随之改变。在承包商网络这个模型中，这种工作方式会给上层结构增加大量工作：参与过程的每个承包商，都会发现自己据以投标的规格要求不断变化；他必须不断重新研究情境、修改计划、调整给分包商的规格要求，并更新记录。这是一种极其沉重的额外负担，但它带来的行动自由，对系统向外部世界表现出来的效能至关重要。&quot;,
    &quot;en&quot;: &quot;A complex process is often executed by the H-LAM/T system in a multi-pass fashion (i.e., cut and try). In really complex situations, comprehension and problem solutions do not stand waiting at the end of a straightforward path; instead, possibilities open up and plans shift as comprehension grows. In the model using a network of contractors, this type of procedure would entail a great deal of extra work within the superstructure—each contractor involved in the process would have the specifications upon which he bid continually changed, and would continually have to respond to the changes by restudying the situation, changing his plans, changing the specifications to his subcontractors, and changing his records. This is a terrific additional burden, but it allows a freedom of action that has tremendous importance to the effectiveness the system exhibits to the outside world.&quot;
  },
  &quot;2c5e6&quot;: {
    &quot;id&quot;: &quot;p_170&quot;,
    &quot;zh&quot;: &quot;即使计算机只能提高统筹过程的效能，把H-LAM/T系统自动化也足以带来显著收益。人就能把更多时间、精力和有成效的思考投入直接贡献过程，而这些过程也能得到更精细、更灵活、更高效的协调。不过，我们有充分理由相信：自动化所带来的、更好的符号结构化与过程结构化，不仅会改善统筹过程，也会直接改善系统中的直接贡献过程。&quot;,
    &quot;en&quot;: &quot;We could expect significant gains from automating the H-LAM/T system if a computer could do nothing more than increase the effectiveness of the executive processes. More human time, energy, and productive thought could be allocated to direct-contributive processes, which would be coordinated in a more sophisticated, flexible and efficient manner. But there is every reason to believe that the possibilities for much-improved symbol and process structuring that would stem from this automation will directly provide improvements in both the executive and direct-contributive processes in the system.&quot;
  },
  &quot;2c5f3&quot;: {
    &quot;id&quot;: &quot;p_174&quot;,
    &quot;zh&quot;: &quot;今天，人们用来构建和操作这些符号结构的手段，既费力，又缺乏灵活性。建立一个初步的图文结构已经够困难了，而修改它所需的工作量，往往大得令人却步；于是，人只好接受僵化。更进一步说，真正有帮助的充分灵活性，还要求我们增加符号结构，单是为了追踪结构发展过程中出现的各种尝试、分支，以及相应的推理。只要想比原先稍微灵活得多一些，所涉及的复杂性，就会使现有的符号操作手段很快彻底陷入困境。&quot;,
    &quot;en&quot;: &quot;The means available to humans today for developing and manipulating these symbol structures are both laborious and inflexible. It is hard enough to develop an initial structure of diagrams and text, but the amount of effort required to make changes is often prohibitively great; one settles for inflexibility. Also, the kind of generous flexibility that would be truly helpful calls for added symbol structuring just to keep track of the trials, branches, and reasoning thereto that are involved in the development of the subject structure; our present symbol-manipulation means would very soon bog down completely among the complexities that are involved in being more than just a little bit flexible.&quot;
  },
  &quot;2c5f5&quot;: {
    &quot;id&quot;: &quot;p_176&quot;,
    &quot;zh&quot;: &quot;当行动过程必须响应新的理解、新的洞见，以及突然闪现的、关于可能解释或解决办法的直觉时，它就不会是一个井然有序的过程。现有的符号结构构写与操作手段，会让这种不按部就班的过程付出极高代价。明日自动化H-LAM/T系统的真正前景之一，正是让人能够拥有这种非有序过程带来的自由与力量。&quot;,
    &quot;en&quot;: &quot;When the course of action must respond to new comprehension, new insights and new intuitive flashes of possible explanations or solutions, it will not be an orderly process. Existing means of composing and working with symbol structures penalize disorderly processes very heavily, and it is part of the real promise in the automated H-LAM/T systems of tomorrow that the human can have the freedom and power of disorderly processes.&quot;
  },
  &quot;2c5g1&quot;: {
    &quot;id&quot;: &quot;p_178&quot;,
    &quot;zh&quot;: &quot;执行系统中一个较高层次的过程，会涉及层级体系中许多层次上的许多过程。因此，凡是普遍影响过程执行的因素，都会层层叠加，对系统表现产生高度复合放大的总体影响。有几个这样的因素，值得特别注意。&quot;,
    &quot;en&quot;: &quot;Since many processes in many levels of the hierarchy are involved in the execution of a single higher-level process of the system, any factor that influences process execution in general will have a highly compounded total effect upon the system&#x27;s performance. There are several such factors which merit special attention.&quot;
  },
  &quot;2c5g2&quot;: {
    &quot;id&quot;: &quot;p_179&quot;,
    &quot;zh&quot;: &quot;人的基本认知能力，例如记忆、智力或模式感知能力，都可能产生这种复合放大效应。今天使用的增强手段，通常是在大量人群中演化出来的，并没有刻意适配个人的需要和能力。每个人都倾向于发展出自己的变体，但变异和选择活动不够充分，选择所产生的反馈也不够多，因此难以形成非常显著的改变。一个良好的自动化H-LAM/T系统，应当使增强手段有机会充分适配个人特点。基本认知能力所具有的复合放大效应，还意味着：若要把系统设计得尽可能有效，就必须通过训练、特殊的心智技巧、改进的语言和新的方法体系，让这些能力得到尽可能充分的发展。&quot;,
    &quot;en&quot;: &quot;Basic human cognitive powers, such as memory intelligence, or pattern perception can have such a compounded effect. The augmentation means employed today have generally evolved among large statistical populations, and no attempt has been made to fit them to individual needs and abilities. Each individual tends to evolve his own variations, but there is not enough mutation and selection activity, nor enough selection feedback, to permit very significant changes. A good, automated H-LAM/T system should provide the opportunity for a significant adaptation of the augmentation means to individual characteristics. The compounding effect of fundamental human cognitive powers suggests further that systems designed for maximum effectiveness would require that these powers be developed as fully as possible—by training, special mental tricks, improved language, new methodology.&quot;
  },
  &quot;2c5g3&quot;: {
    &quot;id&quot;: &quot;p_180&quot;,
    &quot;zh&quot;: &quot;在我们设想的自动化系统中，人应当能在能力库层级体系的许多层次上，调用纯器具过程能力；而今天，器具只是直接参与较低阶的能力。例如，在未来系统中，计算机过程应当可以对人的许多不同层次的过程，提供直接而重要的帮助。因此，我们预计计算机在系统中的作用会被大幅复合放大。这里蕴含着自动化H-LAM/T系统未来极其丰富的可能性，远远超过那些仅仅把计算机想象为“帮助我做现在已经在做的事情”的人所意识到的范围。这种复合放大，与第二章A节讨论过的、反复传播的变革波动有关。&quot;,
    &quot;en&quot;: &quot;In the automated system that we contemplate, the human should be able to draw on explicit-artifact process capability at many levels in the repertoire hierarchy; today, artifacts are involved explicitly in only the lower-order capabilities. In the future systems, for instance, it should be possible to have computer processes provide direct and significant help in his processes at many levels. We thus expect the effect of the computer in the system to be very much compounded. A great deal of richness in the future possibilities for automated H-LAM/T systems is implied here—considerably more than many people realize who would picture the computer as just helping them do the things they do now. This type of compounding is related to the reverberating waves of change discussed in Section II-A.&quot;
  },
  &quot;3a5f7&quot;: {
    &quot;id&quot;: &quot;p_202&quot;,
    &quot;zh&quot;: &quot;“除了把现有机械装置和小器械向未来延伸以外，以上还都属于常规做法。不过，它们使我们可以顺势迈向关联式索引。其基本思想，是让任何一项资料都能按照使用者的意愿，立即、自动地选出另一项资料。这是memex的核心特征。把两项资料连接起来的过程，才是关键所在。&quot;,
    &quot;en&quot;: &quot;\&quot;All this is conventional, except for the projection forward of present-day mechanisms and gadgetry. If affords an immediate step, however, to associative indexing, the basic idea of which is a provision whereby any item may be caused at will to select immediately and automatically another. This is the essential feature of the memex. The process of tying two items together is the important thing.&quot;
  },
  &quot;3a5f9&quot;: {
    &quot;id&quot;: &quot;p_204&quot;,
    &quot;zh&quot;: &quot;“此后任何时候，只要其中一项资料显示在眼前，按一下相应代码格下方的按钮，就能立即调出另一项。而且，许多资料一旦这样连接成一条路径，使用者就能拨动类似翻书操纵杆的装置，或快或慢地依次查看。它就像把这些实物资料汇集成了一本新书。但它又不止于此，因为同一项资料，可以加入许多条不同的路径。&quot;,
    &quot;en&quot;: &quot;\&quot;Thereafter, at any time, when one of these items is in view, the other can be instantly recalled merely by tapping a button below the corresponding code space. Moreover, when numerous items have been thus joined together to form a trail, they can be reviewed in turn, rapidly or slowly, by deflecting a lever like that used for turning the pages of a book. It is exactly as though the physical items had been gathered together to form a new book. It is more than this, for any item can be joined into numerous trails.&quot;
  },
  &quot;3a6a&quot;: {
    &quot;id&quot;: &quot;p_218&quot;,
    &quot;zh&quot;: &quot;这篇文章有许多重要内容，不过，我们在这里主要讨论memex的使用及其含义。布什用相当篇幅描述了如何在档案中建立和使用关联路径。这是一个极好的例子：新的器具过程能力，带来了新的符号结构化能力，而后者又提供了构建和呈现概念结构的新方式。任何档案都是一种符号结构；它的目的，是在器具与人共同执行符号结构操作过程的能力所允许的限度内，以尽可能便于使用、尽可能有帮助的方式，表示各种概念和概念结构，以满足人的心智结构发展的需要。使用者借助比较普通的摄影设备和档案系统，本来也能做memex所做的事情；memex只是让他做得更方便，耗费更少精力，速度也更快。但是，如果没有它，人就得在较低层次的操作上花费大量时间；受记忆与耐心的时间限制，这套系统根本无法像布什描述的那样，细致而贴身地投入使用。&quot;,
    &quot;en&quot;: &quot;There are many significant items in the article, but the main ones upon which we shall comment here will be those relative to the use and implications of his Memex. The associative trails whose establishment and use within the files he describes at some length provide a beautiful example of a new capability in symbol structuring that derives from new artifact-process capability, and that provides new ways to develop and portray concept structures. Any file is a symbol structure whose purpose is to represent a variety of concepts and concept structures in a way that makes them maximally available and useful to the needs of the human&#x27;s mental-structure development—within the limits imposed by the capability of the artifacts and human for jointly executing processes of symbol-structure manipulation. The Memex allows a human user to do more conveniently (less energy, more quickly) what he could have done with relatively ordinary photographic equipment and filing systems, but he would have had to spend so much time in the lower-level processes of manipulation that his mental time constants of memory and patience would have rendered the system unusable in the detailed and intimate sense which Bush illustrates.&quot;
  },
  &quot;3a6c&quot;: {
    &quot;id&quot;: &quot;p_220&quot;,
    &quot;zh&quot;: &quot;还应注意，布什谈到一个使用者复制一条路径，也就是自己结构的一部分，把它交给朋友；朋友可以将它放进自己的memex，并融入自己的路径或结构。这一做法有着深远含义。此外，还有“全新形式的百科全书”、“路径开拓者”这个职业，以及大师传承中包含的、支撑其成果建立起来的“整套脚手架”。这些都说明，个体能力的增强，能够引起人们智力合作方式怎样的变化。直接研究如何使个人的智力活动更有效，其潜在价值中十分重要的一部分，正体现在这种变化上。&quot;,
    &quot;en&quot;: &quot;Note, too, the implications extending from Bush&#x27;s mention of one user duplicating a trail (a portion of his structure) and giving it to a friend who can put it into his Memex and integrate it into his own trail (structure). Also note the \&quot;wholly new forms of encyclopedia\&quot;, the profession of \&quot;trail blazers,\&quot; and the inheritance from a master including \&quot;the entire scaffolding\&quot; by which such additions to the world&#x27;s record were erected. These illustrate the types of changes in the ways in which people can cooperate intellectually that can emerge from the augmentation of the individuals. This type of change represents a very significant part of the potential value in pursuing research directly on the means for making individuals intellectually more effective.&quot;
  },
  &quot;3a7a&quot;: {
    &quot;id&quot;: &quot;p_222&quot;,
    &quot;zh&quot;: &quot;通过开发和使用一些相对简单、主要由机电部件组成而且比较便宜的设备，我们能够为个人提供若干有用的新结构化过程。下面先介绍一个例子：我在过去八年中开发并使用的、手工操作的边缘开槽卡片系统。&quot;,
    &quot;en&quot;: &quot;A number of useful new structuring processes can be made available to an individual through development and use of relatively simple equipment that is mostly electromechanical in nature and relatively cheap. We can begin developing examples of this by describing the hand operated, edge-notched card system that I developed and used over the past eight years.&quot;
  },
  &quot;3a7b1&quot;: {
    &quot;id&quot;: &quot;p_224&quot;,
    &quot;zh&quot;: &quot;这里的“单元记录”，与memex例子中的不同，通常是打字或手写在卡片上的零碎文字。卡片大小与IBM卡片相当，边缘可以开槽。这些文字是小小的“内核”：数据、思考、事实、考虑因素、概念、想法、忧虑等，都与我专业生活中的某个问题领域有关。每个具体问题领域的笔记卡片，分别保存在一叠卡片中；每叠都有一张主卡，把描述词与卡片周边的各个孔位对应起来。其中有一组孔，专门通过开槽来编码：所记录的，可能是这条笔记来源文献的序号，也可能是直接提供信息的某个人的序号；其中也有代表我自己的代码，用来标记我自己产生的想法。&quot;,
    &quot;en&quot;: &quot;The \&quot;unit records\&quot; here, unlike those in the Memex example, are generally scraps of typed or handwritten text on IBM-card sized edge-notchable cards. These represent little \&quot;kernels\&quot; of data, thought, fact, consideration, concepts, ideas, worries, etc., that are relevant to a given problem area in my professional life. Each such specific problem area has its notecards kept in a separate deck, and for each such deck there is a master card with descriptors associated with individual holes about the periphery of the card. There is a field of holes reserved for notch coding the serial number of a reference from which the note on a card may have been taken, or the serial number corresponding to an individual from whom the information came directly (including a code for myself, for self-generated thoughts).&quot;
  },
  &quot;3a7b2&quot;: {
    &quot;id&quot;: &quot;p_225&quot;,
    &quot;zh&quot;: &quot;这里使用的索引或分类原则，没有一项是新的：采用组配索引描述词，直接在边缘开槽卡片上编码，再用针式分检来检索。主要的新意，在于使用更小的信息单位，把它们组织成主题范围有限的集合，也就是笔记卡片叠。这样，在我逐分逐秒进行分析性和构思性思考、实际处理思考成果的那个层次上，就获得了很大的操作灵活性。不仅我自己的思考会以这种方式产生结果；消化别人的文章时，我通常也会从对方的结构中，挑出一组特定的事实、考虑因素和想法，融入自己的结构。抽取出来的不同项目，往往适合放在我的结构中的不同位置；或者，当我修改、扩展对方的概念时，它们会被纳入特定的子结构。把这些项目或内核抽出来，各自写在一张笔记卡片上，对这个过程帮助很大：在笔记结构的发展中，每一项的角色和位置都是独立的；但需要时，又能对文献序号的开槽区作简单的针式分检，迅速把它们全部分离、抽取出来。&quot;,
    &quot;en&quot;: &quot;None of the principles of indexing or sorting used here is new: coordinate-indexing descriptors with direct coding on edge notched cards, with needle-sort retrieval. Mainly what is new is the use of the smaller units of information, in restricted-subject sets (notedecks) so that I gain considerable flexibility in the manipulations of my thought products at the level at which I actually work in my minute-by-minute struggle with analytical and formulative thought. Not only do my own thoughts produce results in this fashion, but when I digest the writings of another person, I find generally anyway that I have extracted from his structure and integrated into my own a specific selection of facts, considerations, ideas, etc. Often these different extracted items fit into different places in my structure, or become encased in special substructures as I modify or expand his concepts. Extracting such items or kernels and putting each on its own notecard helps this process considerably—the role or position of each such item in the growth of the note structure is independent, and yet if desired all can quickly be isolated and extracted by simple needle sorting on the reference-number notching field.&quot;
  },
  &quot;3a7b3&quot;: {
    &quot;id&quot;: &quot;p_226&quot;,
    &quot;zh&quot;: &quot;这些笔记卡片远不只是一份信息档案。它们为我提供了一个工作空间，使我可以相当自由地浏览、增补、修正，或者建立新的思想内核集合。我可以留下给自己的建议或问题，让它们在以后适当的时候被筛选出来。借助针式分检，寻找属于相关描述词类别的笔记，我也能相当高效地检索参考文献。凡是含有相关笔记的卡片，都会指向原始来源：我总把来源序号与页码一起写在卡片顶部。当我要写成一份综合文稿，涵盖整叠卡片的部分或全部材料时，就能用分检针迅速抽出与眼前主题有关的一组卡片，把其他卡片叠放在一旁；需要用手逐张查找，或者按细小类别重新分堆的工作，便减到最低。如果使用了别人提供的特定信息，只需把卡片顶部的来源序号写入文稿初稿，就可以记录应致谢的出处；以后再请秘书整理脚注条目和编号，只是一项简单的事务工作。&quot;,
    &quot;en&quot;: &quot;These notecards represent much more than just an in formation file. They provide a workspace for me, in which I can browse, make additions or corrections, or build new sets of thought kernels with a good deal of freedom. I can leave notes with suggestions or questions for myself that will drop out at an appropriate later time. I can do document-reference searches with good efficiency, too, by needle sorting for notes within relevant descriptor categories Any notecard with relevant notes on it points to the original source (by the source serial number, which I always write, together with the page, at the top of the card). When I am in the process of developing an integrated writeup covering some or all of the notedeck&#x27;s material, I can quickly needle out a set of cards relevant to the topic under consideration at the moment—with all other cards in one pile to the side—and I need do a very minimum of hand searching or stacking in special little category piles. If I utilize specific information from another person, I can register my acknowledgment in my draft writeup merely by writing in the source serial number that is at the top of the notecard—it is a straightforward clerical job for a secretary later to arrange footnote entries and numbering.&quot;
  },
  &quot;3a7c2&quot;: {
    &quot;id&quot;: &quot;p_229&quot;,
    &quot;zh&quot;: &quot;如果我的心智过程更强大，我就可以不用这些卡片，把所有卡片大小的概念结构，连同工作过程中形成的分类联系，一起保存在记忆里；那时，我尽可以闭上眼睛，把脚搁在那些器具上。然而，现实情况是——而且无论我们怎样发展或训练心智能力，很可能永远都是这样——我想研究的问题领域，其中各种因素的数量，以及它们相互关系的复杂程度，都超过了我能够在脑中保存和操作的范围。因此，我的头脑有意识地形成概念集合，或者从别人的工作中辨认并选取这些概念；随后，它指挥建立一个外部符号结构，把那些我无法可靠记住、或者无法在脑中想象其操作过程的概念保存下来，再向头脑呈现。获得这种增强所付出的代价，就是操作器具所需的时间与精力：通过操作器具来操作符号，为我提供这种人工记忆，以及概念及其操作的可视化呈现。&quot;,
    &quot;en&quot;: &quot;If my mental processes were more powerful, I could dispense with the cards, and hold all of the card-sized concept structures in my memory, where also would be held the categorization linkages that evolved as I worked (with my feet up on the artifacts and my eyes closed). As it is, and as it probably always will be no matter how we develop or train our mental capabilities, I want to work in problem areas where the number and interrelationship complexity of the individual factors involved are too much for me to hold and manipulate within my mind. So, my mind develops conscious sets of concepts, or recognizes and selects them from what it perceives in the work of others, and it directs the organization of an external symbol structure in which can be held and portrayed to the mind those concepts I cannot (reliably) remember or whose manipulations I cannot visualize. The price I pay for this augmentation shows up in the time and energy involved in manipulating artifacts to manipulate symbols to give me this artificial memory and visualization of concepts and their manipulation.&quot;
  },
  &quot;3a7e3&quot;: {
    &quot;id&quot;: &quot;p_237&quot;,
    &quot;zh&quot;: &quot;事情渐渐清楚了：我的最终成果，也就是备忘录本身，只不过是一个复杂符号结构的某一侧面；这个结构会随着工作推进不断生长。它包含三个主要子结构，而每个子结构，又有自己明确可辨的内部结构。我意识到，这样分析颇有一点哲学式自我反省的意味；但我很好奇，如果未来的增强手段能让我明确地处理这些结构化形式，会产生怎样的潜在价值。因此，我继续做下去，让卡片的各组、各子组保持分开，并尝试组织和发展它们。&quot;,
    &quot;en&quot;: &quot;It became apparent that the final issuance from my work, the memo itself, would represent but one facet of a complex symbol structure that would grow as the work progressed—a structure comprising three main substructures, each of which had definite substructuring of its own that was apparent. I realized that I was being rather philosophically introspective with all of this analysis, but I was curious as to the potential value of future augmentation means in allowing me to deal explicitly with these types of structuring. So I went ahead, keeping the groups and sub-groups of cards separated, and trying to organize and develop them.&quot;
  },
  &quot;3a7e5&quot;: {
    &quot;id&quot;: &quot;p_239&quot;,
    &quot;zh&quot;: &quot;我还发现，如果能够标记和追踪关联路径，也会极有价值。一条陈述常常与同组中的其他陈述存在隐含联系；能把这些联系追踪下来，非常有用。例如，几条考虑因素陈述可能共同支持某条成果陈述；后来，这条成果陈述又因为另一项考虑而被修改。这时，往往不容易记起它最初为什么写成那个样子。如果能把与它相连的其他考虑因素找出来，就会大有帮助。&quot;,
    &quot;en&quot;: &quot;I also found that there would have been great value in having available the associative-trail marking and following processes. Statements very often had implicit linkages to other statements in the same group, and it would have been very useful to keep track of these associations. For instance, when several consideration statements bore upon a given product statement, and when that product statement came to be modified through some other consideration, it was not always easy to remember why it had been established has it had. Being able to fish out the other considerations linked to that statement would have helped considerably.&quot;
  },
  &quot;3a9b&quot;: {
    &quot;id&quot;: &quot;p_270&quot;,
    &quot;zh&quot;: &quot;不过，对于我们接触到的、与利用计算机同人实时协作、提高工作效能最直接相关的思想与工作，我们仍然希望予以确认和致谢。它们可以分为两类。第一类，也包括本报告，提出设想与可能性，但不报告重要的实验结果。布什[6]的文章出现得最早，也是最直接带来启发的作品之一。利克莱德[15]为使用现代计算机给出了最具一般性、又清楚明白的论证，并创造了“人机共生”这一说法，指人和计算机在互利合作中形成的紧密交互关系。乌拉姆[16]在一章题为“协同作用”（synergesis）的文字中，明确主张紧密的人机交互，并相当详细地指出哪些数学工作可以得到帮助。古德[17]比较概括地设想了人通过与计算机紧密合作获得智力辅助的可能性；他还提出一些有趣的想法，利用网络模型组织信息中的概念内核，以促成一种自组织的检索系统。拉莫多次演讲，讨论计算机未来“扩展人类智力”的可能性，也写过数篇文章[18，19]。与上述文章以及我们的最初目标相比，他的设想似乎更倾向于较大规模的人群与计算机交互，而不那么强调贴身的个人使用。费恩[20]在全面展望“计算机相关科学”的发展及其动态相互关系时，明确谈到了人、机械装置与自动机通过合作活动来增强人类智力。他创造了“synnoetics”一词，用来泛指人、机械装置、植物或动物有机体，以及自动机之间的合作交互；它们组成一个系统，整体的心智能力超过各组成部分。他还描绘了一幅很好的图景：今天彼此分离的许多学科，未来应当怎样以整合的方式发展和教授，才能充分体现它们在这个称为“synnoetics”的重要元学科中相互关联的作用。&quot;,
    &quot;en&quot;: &quot;However, we do want to acknowledge thoughts and work we have come across that bear most directly upon the possibilities of using a computer in real-time working association with a human to improve his working effectiveness. These fall into two categories. The first category, which would include this report, presents speculations and possibilities but does not include reporting of significant experimental results. Of these, Bush[6] is the earliest and one of the most directly stimulating. Licklider[15] provided the most general clear case for the modern computer, and coined the expression, \&quot;man-computer symbiosis\&quot; to refer to the close interaction relationship between the man and computer in mutually beneficial cooperation. Ulam[16] has specifically recommended close man-computer interaction in a chapter entitled, \&quot;synergesis,\&quot; where he points out in considerable detail the types of mathematical work which could be aided. Good[17] includes some conjecture about possibilities of intellectual aid to the human by close cooperation with a computer in a rather general way, and also presents a few interesting thoughts about a network model for structuring the conceptual kernels of information to facilitate a sort of self-organizing retrieval system. Ramo has given a number of talks dealing with the future possibilities of computers for \&quot;extending man&#x27;s intellect,\&quot; and wrote several articles.[18, 19] His projections seem slanted more toward larger bodies of humans interacting with computers, in less of an intimate personal sense than the above papers or than our initial goal. Fein[20] in making a comprehensive projection of the growth and dynamic inter-relatedness of \&quot;computer-related sciences,\&quot; includes specific mention of the enhancement of human intellect by cooperative activity of men, mechanisms, and automata. He coined the term \&quot;synnoetics\&quot; as applicable generally to the cooperative interaction of people, mechanisms, plant or animal organisms, and automata into a system whose mental power is greater than that of its components, and presented a good picture of the integrated way in which many currently separate disciplines should be developed and taught in the future to do justice to their mutual roles in the important metadiscipline defined as \&quot;synnoetics.\&quot;&quot;
  },
  &quot;3b10b&quot;: {
    &quot;id&quot;: &quot;p_377&quot;,
    &quot;zh&quot;: &quot;“我采用这种方式介绍系统，是希望避免让你产生一种误解：除非先学会一大套复杂的新语言、逻辑和数学，否则个人就无法有效使用这些技术。那样，你就不会再觉得这些可能性与自己有关。确实，掌握的复杂技巧越多，你能够调动的计算机能力也越多，你自己就越有力量。但也有不少实验参与者，只在这种工作站上接受十五个小时的训练，就获得了十分显著、令自己兴奋不已的实际问题解决能力。顺便说，这些训练全由计算机提供，没有人在旁边授课。参与者来自社会学、生物学、工程管理、应用数学和法律等不同领域，都是水平相当高的人。他们毫无保留地一致相信：只要计算机行业真正重视这种潜在市场，那么，按照我们对五年后这类工作站的资本与运行成本的预测，他们能力的提高，就完全足以证明这笔支出是值得的。”&quot;,
    &quot;en&quot;: &quot;\&quot;What I hoped to avoid by presenting the system in this way, was losing your identification with these possibilities by letting you get the mistaken impression that an individual couldn&#x27;t harness these techniques usefully unless he first learned a lot of very sophisticated new language, logic and math. It is true that the more of the sophisticated tricks you learn, the more computer power you can harness and the more powerful you become—but very significant and personally thrilling practical problem-solving capabilities have been developed by quite a few subjects who were given only fifteen hours of training at one of these stations. The training, incidentally, was all provided by the computer without the presence of a human instructor. And the people were of such diverse fields as sociology, biology, engineering management, applied mathematics, and law. These were all relatively high-level people, and they were completely and unreservedly unanimous in their faith that their increased capability would easily justify the capital and operating outlay that we predicted for work stations of this sort in five years, if the computer industry really were to take this type of potential market seriously.&quot;
  },
  &quot;3b10e&quot;: {
    &quot;id&quot;: &quot;p_380&quot;,
    &quot;zh&quot;: &quot;“例如，起初我们觉得，界定类别与关系、制定行动计划，应该尽快做完，好让自己赶紧开始工作。但随着我们越来越能精确、轻松、灵活地处理定义和计划，我们开始认识到：这些事情实际上可能就是工作最重要的部分。面对彼此交织的目标、计划和论证层级体系，我们处理复杂记录事务的能力大幅提升。于是我们发现，定义一个新类别、寻找它的成员或实例，或者运用它的筛选标准，都变成越来越自觉、越来越明确的任务。”&quot;,
    &quot;en&quot;: &quot;\&quot;For instance, we initially felt that defining categories and relationships, and making a plan for action, were things to be done as quickly as possible so that we could get on with the work. But, as our means developed for dealing with definitions and plans more precisely, easily, and flexibly, we began to realize that they in reality might be the most significant part of that work. With our immensely increased capability for complex bookkeeping relative to our interlaced hierarchies of objectives, plans, and arguments, we found that defining a new category, searching for members or instances of it, or applying its selection criteria were becoming ever conscious and specific tasks.&quot;
  },
  &quot;3b10f&quot;: {
    &quot;id&quot;: &quot;p_381&quot;,
    &quot;zh&quot;: &quot;“例如，我们越来越觉得，区分不同类别或类型的过程、论证、关系和描述，非常有用。举个具体例子，阮冈纳赞曾列举两个术语之间可能存在的五种特定关系，其中一个术语修饰另一个。他把它们称为‘相位关系’：一个术语可以使另一个带有某种倾向，可以是研究它的工具，可以是它的一个方面，可以与它相比较，也可以影响它。〔原注2〕维克里又举出更多例子：一个可以对另一个产生效果，可以是它的原因、用途、替代物、来源、含义、解释或表示。文献中还提到了更多类别。”&quot;,
    &quot;en&quot;: &quot;\&quot;For instance, we began to find it more and more useful to distinguish different categories or types of process, different types of arguments, different types of relationships, and different types of descriptions. For a specific example, Ranganathan*2* once cited five specific relationships that could obtain between two terms, where one modifies the other. He called these phase relations, and named how one term could relate to the other as either biasing it, being a tool used to study it, being an aspect of it, being in comparison with it, or influencing it. Vickery gave more examples, saying one could also have an effect on the other, be a cause of it, be a use for it, be a substitute for it, a source for it, an implication of it, be an explanation of it, or be a representation of it. There are even more categories mentioned in the literature.&quot;
  },
  &quot;3b10g&quot;: {
    &quot;id&quot;: &quot;p_382&quot;,
    &quot;zh&quot;: &quot;“建立标签和链接很容易，因此我们试验了：有意识地规定并标示类别，能带来什么好处。结果，这是一项很能激发活力的创新，于是我们开始更认真地对待结构化。不错，在结构中建立链接和节点，会花更多时间；但一方面，结构变得清楚得多，所需构件更少；另一方面，计算机能够提供复杂得多的帮助，替我们完成重要的事务工作。”&quot;,
    &quot;en&quot;: &quot;\&quot;It was easy to form tags and links, and we experimented with the gains to be made by consciously specifying and indicating categories. It turned out to be a very invigorating innovation, and we began to take more pains with our structuring. It took longer to set up links and nodes in our structures, to be sure, but we found on the one hand that the structures became much cleaner and required fewer members, and on the other hand that we could get considerably more sophisticated help from the computer in doing significant chores for us.&quot;
  },
  &quot;3b10h&quot;: {
    &quot;id&quot;: &quot;p_383&quot;,
    &quot;zh&quot;: &quot;“我们开始编制一些过程，帮助自己建立类别、给出良好定义、检查它们与已有类别的关系、判断某个东西是否属于某一类别，以及在指定子结构中寻找所有可能成员，等等。正因为我们在结构中采用了这种细致的分类，计算机才能在这些分类过程中提供更有力的帮助。还应提到，对于句子中术语之间的关系，也就是你所说的句法，我们添加了比先前展示的更详细的规定性标签，消除那些妨碍计算机回到一条陈述、解析其句法结构的歧义。此外，术语意义上的模糊也开始限制我们，因此我们发展了一些方法，去除相当一部分语义歧义。像我说过的，这使工作慢了一些，但并没有你想的那么多。”&quot;,
    &quot;en&quot;: &quot;\&quot;We began to work up processes that would help us establish categories, give them good definitions, check their relationship with other established categories, decide whether something fit a given category or not, search for all possible members of it within a given substructure, and so forth. The very fact of using this careful classification within our structures allowed us to get more powerful help from the computer in these classification processes. I should mention that the relationships among the terms in a sentence—the syntax if you wish—had been given further specification tags than those I showed you earlier, to remove ambiguities that hindered the computer from going back to a statement and resolving the syntactical structure. Also, ambiguities in the meaning of the terms began to limit us, and we developed methods for removing a good deal of this semantic ambiguity. This slowed us down, as I&#x27;ve mentioned, but not as much as you&#x27;d think.&quot;
  },
  &quot;3b10m&quot;: {
    &quot;id&quot;: &quot;p_388&quot;,
    &quot;zh&quot;: &quot;“实际上，我现在演示的是一种协作执行过程的技术。这个过程使用非常精细的标准和分析技术；它的安排，是让计算机此刻真正处在统筹位置。虽然是我调用了它，但执行时，基本上是计算机向我提问，再根据我的回答连续提出下一个问题。同时，它也在大量处理代表我那份描述的符号结构。在我的少量帮助下，它正在相当复杂地分析：这个尚在形成的概念对我意味着什么，以及我对它可能有哪些类型的心智联想。我不需要记住涉及的专门规则和分析形式；然而，这项相当精细的小能力，已经可以随时由我调用，既不会过度耗费我的精力，也不会过度耗费计算机的能力。”&quot;,
    &quot;en&quot;: &quot;\&quot;Actually, right now I&#x27;m demonstrating a cooperative process execution technique. This process is applying some very sophisticated criteria and using some very sophisticated analytical techniques, and it is set up so that it is actually the computer that is now in the executive seat. I called for the process, but its execution essentially involves the computer&#x27;s asking me questions, and feeding me successive questions according to how I&#x27;ve answered the previous ones. It also is doing a lot of work on the symbol structure that represents my description. It, with some small help from me, is proceeding through a quite complex analysis of the meaning that this incipient concept has to me, and of certain types of mental associations that I may have with it. I don&#x27;t have to remember the special rules and forms of analysis involved—nevertheless, a very sophisticated little capability is mine to use at will, taxing neither me nor the computer.\&quot;&quot;
  },
  &quot;3b10o&quot;: {
    &quot;id&quot;: &quot;p_390&quot;,
    &quot;zh&quot;: &quot;“第四行，你大概看得出是一条陈述。它就是计算机生成的定义，采用一种特殊语言，我就不解释了。这里只说，我现在可以研究它，把它拆开，核查它的依据；也许还可以看看，能不能与计算机一起作些修改或改进。不过，这个过程经过了相当深入的打磨，我们现在得到的定义，已经很难再改得更好了。”&quot;,
    &quot;en&quot;: &quot;\&quot;The fourth line you recognize as a statement form, perhaps. This is the definition, as developed by the computer. It&#x27;s in a special language and I won&#x27;t try to explain. I&#x27;ll just mention that I can now study it, take it apart, check its references, so to speak, and perhaps even see if the computer and I might work out any changes or improvements. But this process has been worked on pretty hard, and we&#x27;re getting definitions that are hard to improve.&quot;
  },
  &quot;3b10s&quot;: {
    &quot;id&quot;: &quot;p_394&quot;,
    &quot;zh&quot;: &quot;“我们再看看，到目前为止，这种新语言，以及它赋予计算机的新语义识别能力，带来了一些什么结果。如果计算机能把握并操作结构中所含意义的重要方面，就能回答一些问题；而这些问题所需的数据，原本只是隐含在概念中的。经过练习，加上好的策略，提出这类问题，已经证明是理解一个结构的极其有效的方法。我们甚至有专门的过程和符号结构化方法，帮助组织提问与回答。不过，有些答案代价不低，既花计算时间，也花钱；所以必须注意提问方式。我们的一些研究人员，正在针对这个问题研究语言和结构化技术；他们觉得已经看到了修改方向，可以让问答过程整体上更高效。不过，至少从现在看，这类事情大概总免不了成本问题。”&quot;,
    &quot;en&quot;: &quot;\&quot;Let&#x27;s run over some of the results we&#x27;ve seen to date, stemming from this new language and the new semantic awareness thus given the computer. If it can get hold of and manipulate important aspects of the meaning that is contained in our structures, it can develop answers to some questions for which there existed only conceptually implicit data. With practice and good strategy, asking questions like this proves to be a tremendously effective way to gain comprehension about a structure. We even have special processes and symbol-structuring methods to help organize the questioning and the answers. Some of the answers are a bit costly, however—in computer time and charges—and we have to watch the way we ask questions. Some of our researchers are studying the language and structuring techniques relative to this problem, and they think they see ways to change them to make question answering generally more efficient. But this sort of thing will likely always have its cost problems, as far as we can see now.\&quot;&quot;
  },
  &quot;3b10t&quot;: {
    &quot;id&quot;: &quot;p_395&quot;,
    &quot;zh&quot;: &quot;乔接着说，计算机如今已经成了这样一种聪明的帮手，虽然其聪明程度仍远不如他们会雇用的任何人类助手，但他们已经把它叫作“事务助手”（the Clerk）。构建结构时，他们可以先提出一条试验性的新陈述，再让事务助手检查整个结构，寻找不一致或冗余。它也能指出陈述的某些薄弱之处，以及这条陈述对结构其余部分可能产生的某些影响。他们发现，人需要亲自操心的结构构建细节越来越少；事实上，角色已经稍微反转。过去，是人设置标签与链接，让计算机替自己跑腿时能够在结构中找到路；如今，则是计算机认真地安装类似的设施，供人研究结构时使用。&quot;,
    &quot;en&quot;: &quot;He went on to say that the computer now represents such an intelligent helper—although much less so than any human helper they would hire—that they refer to it as the Clerk. They can make a tentative new statement in the development of a structure, and have the clerk look over the structure to detect inconsistency or redundancy. The Clerk can also point out some of the weaknesses in the statement, as well as some of the effects of the statement upon the rest of the structure. They find that they need to give less and less human concern for the details of structure building—in fact, the roles have reversed a little. Where the human used to set up tags and links so the computer could find its way around the structure as it ran errands for him, they now have the computer studiously installing similar things that are for the benefit of the human when he is studying the structure.&quot;
  },
  &quot;3b2&quot;: {
    &quot;id&quot;: &quot;p_276&quot;,
    &quot;zh&quot;: &quot;我们关于增强手段、能力层级体系，以及心智、概念、符号、过程和物理结构化的概括，也许在未来仍然有效。例如，我们总体上预期，概念、符号和过程结构化的新发展，会被证明极其重要。但实际演化出来的具体概念、符号结构与过程，很可能不同于我们现在熟悉和使用的形式。事实上，即使我们能够用某种方式，现在就知道经过譬如十年研究以后会出现什么，恐怕除了概括性的描述之外，也很难用今天的术语把它表达出来。&quot;,
    &quot;en&quot;: &quot;Although our generalizations (about augmentation means, capability hierarchies, and mental-, concept-, symbol-, process-, and physical-structuring) might retain their validity in the future—for instance, our generalized prediction that new developments in concept, symbol, and process structuring will prove to be tremendously important—the specific concepts, symbol structures, and processes that evolve will most likely differ from what we know and use now. In fact, even if we in some way could know now what would emerge after say, ten years of research, it is likely that any but a general description would be difficult to express in today&#x27;s terminology.&quot;
  },
  &quot;3b3a&quot;: {
    &quot;id&quot;: &quot;p_278&quot;,
    &quot;zh&quot;: &quot;尽管如此，为了让你这位读者对我们的主张有具体感受，我们还是要描绘下面这幅基于计算机的增强图景。请设想，一位友善的人，名叫乔，正在为你作一场面对面的讲解和演示。他参与的实验研究计划，比我们当前所处的阶段超前了几年；他已经受过训练，也是这种增强系统的熟练使用者。我们假定，你来观看这场演示、参加这次访谈时，所具备的背景与本报告前面提供的大致相同：你听过或读过一套概括性的说明，也看过几个相当初步的例子，但仍不太能具体感受到，基于计算机的增强系统究竟怎样真正帮助一个人。&quot;,
    &quot;en&quot;: &quot;To try to give you (the reader) a specific sort of feel for our thesis in spite of this situation, we shall present the following picture of computer-based augmentation possibilities by describing what might happen if you were being given a personal discussion-demonstration by a friendly fellow (named Joe) who is a trained and experienced user of such an augmentation system within an experimental research program which is several years beyond our present stage. We assume that you approach this demonstration-interview with a background similar to what the previous portion of this report provides—that is, you will have heard or read a set of generalizations and a few rather primitive examples, but you will not yet have been given much of a feel for how a computer-based augmentation system can really help a person.&quot;
  },
  &quot;3b3d&quot;: {
    &quot;id&quot;: &quot;p_281&quot;,
    &quot;zh&quot;: &quot;你又有一点意外：他的两只手，各自操作显示画面两侧的一组按键，所以两手相距将近两英尺。不过，这种安排显然使他能够自然地保持在画面上方的姿势。光笔平时悬在空中，由带关节的支撑臂，以及对连线张力和回卷进行控制的系统托住；他伸手取笔时，手恰好就在从键组移向显示画面的途中。在画面上用完光笔后，他一松手，连线就回卷，光笔重新归位。因此，转而在画面上工作所需的力气、动作和时间，都降到了最低。换句话说，他不必移动头部、转身或倾斜身体，就能让任意一只手在键组和光笔之间轻松来回切换；每只手旁边各有一支光笔。&quot;,
    &quot;en&quot;: &quot;Another slight surprise, though—you see that each hand operates on a set of keys on its own side of the display frames, so that the hands are almost two feet apart. But it is plain that this arrangement allows him to remain positioned over the frames in a rather natural position, so that when he picks the light pen out of the air (which is its rest position, thanks to a system of jointed supporting arms and a controlled tension and rewind system for the attached cord) his hand is still on the way from the keyset to the display frame. When he is through with the pen at the display frame, he lets go of it, the cord rewinds, and the pen is again in position. There is thus a minimum of effort, movement, and time involved in turning to work on the frame. That is, he could easily shift back and forth from using keyset to using light pen, with either hand (one pen is positioned for each hand), without moving his head, turning, or leaning.&quot;
  },
  &quot;3b4c&quot;: {
    &quot;id&quot;: &quot;p_288&quot;,
    &quot;zh&quot;: &quot;不过，在构写任务中，还可以得到其他帮助。乔向你展示，只要在键组上迅速按几下，就能调出任何已输入词语的词典定义；同义词和反义词，也同样容易调出。这似乎又是一项微不足道、显而易见的功能，而乔好像早就知道你会这样想。“实际情况是，这项简单能力，使能力层级体系上层的一些艰难任务变得可行。在那里，精确使用专门术语有很大价值；如果人只依靠未经辅助的记忆，记住定义和‘标准’，就无法做到那么精确；而按通常方式查词典和参考书，又会如此分散注意力、如此耗费时间，以至于任务根本无法顺利进行。我们曾在某些高层过程里取消这项功能；相信我，结果一团糟。”&quot;,
    &quot;en&quot;: &quot;But there were other ways in which help was derived for this composition task. He showed you how he could call up the dictionary definition to any word he had typed in, with but a few quick flicks on the keyset. Synonyms or antonyms could just as easily be brought forth. This also seemed sort of trivially obvious, and Joe seemed to know that you would feel so. \&quot;It turns out that this simple capability makes it feasible to do some pretty rough tasks in the upper levels of the capability hierarchy—where precise use of special terms really pays off, where the human just couldn&#x27;t be that precise by depending upon his unaided memory for definitions and &#x27;standards,&#x27; and where using dictionary and reference-book lookup in the normal fashion would be so distracting and time-consuming that the task execution would break down. We&#x27;ve tried taking this feature away in some of these processes up there, and believe me, the result was a mess.&quot;
  },
  &quot;3b4d&quot;: {
    &quot;id&quot;: &quot;p_289&quot;,
    &quot;zh&quot;: &quot;看过他工作一阵以后，你多少能体会他说的意思。不过，接下来这项演示更直接地令人印象深刻，你不禁松了一口气。乔可以选出一组词，称为“目标符号串”，简称“目标串”；然后用自己任意选择的一串符号，定义一个缩写，使它在计算机存储中与目标串关联起来。此后，只要他还没有从工作词汇中删除这个缩写，输入它，就会自动在显示屏上“打印”出整个目标串。乔还演示了这项缩写功能的另一种用法：他可以安排计算机按原样显示输入的缩写，而不展开。以后阅读时，如果忘记缩写代表什么，就让系统用完整目标串替换它，唤起记忆。&quot;,
    &quot;en&quot;: &quot;You could get some dim feeling for what he meant, having watched him working for a while, but you were nevertheless much relieved to find the next thing he showed you to be more directly impressive. He showed you how he could single out a group of words (called the \&quot;object symbol string,\&quot; or simply \&quot;object string\&quot;) and define an abbreviation term, composed of any string of symbols he might choose, that became associated with the object string in computer storage. At any later time (until he chose to discard that particular abbreviation from his working vocabulary) the typing of the abbreviation term would call forth automatically the \&quot;printing\&quot; on the display of the entire object string. Joe showed you another way in which this abbreviation feature might work. He \&quot;arranged\&quot; for the computer to print the abbreviation on the display, just the way he typed it in. At a subsequent reading, if he had for gotten what the abbreviation stood for, he could call for substitution of the full object string to refresh his memory.&quot;
  },
  &quot;3b4e&quot;: {
    &quot;id&quot;: &quot;p_290&quot;,
    &quot;zh&quot;: &quot;接着，乔展示了如何进一步精细地扩展这种功能，使它成为一种相当强大的速记方式。他能够在键组上按出大量不同组合；也就是说，手每按一下，可以同时压下若干键，因此任意一只手，都能向计算机发出一千多种不同的单次按键信号。其中一些信号，代表整个单词的缩写。例如，一种自然语言中最常用的150个词，似乎就构成了这种语言普通文本中约一半的用词。乔说，因此，学会并使用覆盖自己约一半用词的单次按键缩写，是完全可行的；再往上，每增加一个百分点，所需掌握的缩写就会多得不合算。不过，许多词尾、双字母组合和三字母组合也非常常见，值得各用一次按键来缩写。整词缩写，不但省去逐个输入字母，还省去单词两侧的空格；词尾缩写，则省去相应字母和词后的空格。他声称，自己能轻松地每分钟输入约180个词，比轻松说话时还快。等他把你说的一分钟左右的话转录出来，你就相信了。看着自己的词句几乎即时以整齐的印刷形式出现，你有一种近乎不可思议的感觉。&quot;,
    &quot;en&quot;: &quot;Then he showed you how this sort of facility had been extended, in a refined way, to provide a rather powerful sort of shorthand. He could hit a great many combinations of keys on his keyset—i.e., any one stroke of his hand could depress a number of keys, which gave him over a thousand unique single-stroke signals to the computer with either hand. Some of these signals were used as abbreviations for entire words. It seems that, for instance, the 150 most commonly used words in a natural language made up about half of any normal text in that language. Joe said that it was thus quite feasible to learn and use the single-stroke abbreviations for about half of the words he used, but beyond that each added percent began to require him to have too many abbreviations under his command. But he said that there were a lot of word endings, letter pairs (diagrams), and letter triplets (trigrams) that were so common as to make it pay to abbreviate them to a single stroke. A whole word so abbreviated saved typing all the letters as well as the spaces at either side of the word, and a word-ending abbreviated by a single stroke saved typing the letters and the end-of-word space. He claimed that he could comfortably rattle off about 180 words a minute—faster than he could comfortably talk. You believed him after he transcribed your talking for a minute or so, and it gave you an eerie feeling to see the near instantaneous appearance of your words and sentences in neat printed form.&quot;
  },
  &quot;3b4f&quot;: {
    &quot;id&quot;: &quot;p_291&quot;,
    &quot;zh&quot;: &quot;乔说，还有各种其他简单功能，以及一些相当复杂的功能，可以帮助构写。他简略提到，计算机能够统计性地预测你接下来要输入什么；等你足够熟练，就能在输入信息时，“在外推出来的预测范围中掌舵前行”，常常节省时间和精力。你猜，他大概觉得在这个话题上你已经听得够多了，因为他转向了下一项。&quot;,
    &quot;en&quot;: &quot;Joe said that there were other miscellaneous simple features, and some quite sophisticated features to help the composition process. He made some brief references to statistical predictions that the computer could make regarding what you were going to type next, and that if you got reasonably skillful you could \&quot;steer through the extrapolated prediction field\&quot; as you entered your information and often save energy and time. You gathered that he thought you would saturate about there on this particular subject, because he went on to the next.&quot;
  },
  &quot;3b5a&quot;: {
    &quot;id&quot;: &quot;p_293&quot;,
    &quot;zh&quot;: &quot;“即使我在这里输入新符号的速度，完全不比使用打字机快，单是这个计算机系统在修改屏幕内容方面提供的极大灵活性，就足以使我写成定稿的效能，远远超过使用打字机时所能达到的水平。”说完，乔开始演示。屏幕上还显示着刚才转录的你的讲话，措辞笨拙，思路衔接缺乏逻辑，正是即兴讲话常见的样子。乔右手拿起光笔，熟练地轻点一下，同时左手在键组上按了一下，一个多余的词便无声无息、瞬间被删除。那个词从画面中消失，其余文字同时重新排列，恢复了整齐、没有空缺、各行排满的样子。&quot;,
    &quot;en&quot;: &quot;\&quot;Even if I couldn&#x27;t actually specify new symbols here any faster than with a typewriter, the extreme flexibility that this computer system provides for making changes in what is presented on the display screen would make me very much more effective in creating finished text than I could ever be on a typewriter.\&quot; With this statement, Joe proceeded to show you what he meant. The frame full of your transcribed speech was still showing, and it represented the clumsy phrasing and illogical progression of thought so typical of extemporaneous speech. Joe took the light gun in his right hand, and with a deft flick of it, coordinated with a stroke of his left hand on its keyset, caused the silent and instantaneous deletion of a superfluous word. The word disappeared from the frame, and the rest of the text simultaneously readjusted to present the neat, no-gap, full-line appearance it had had.&quot;
  },
  &quot;3b5b&quot;: {
    &quot;id&quot;: &quot;p_294&quot;,
    &quot;zh&quot;: &quot;只需把光笔的动作稍微增加一点，他就能用同样方式删除任意一串词或字母。他删去了一段我认为仍然相关的文字，接着演示，系统怎样容许人对自己发起的过程反悔：被删的词会自动保留一小段时间，以备他想调回。乔让光笔仍然指着刚才那串符号所在的空位，左手按一下，就能瞬间把它恢复。&quot;,
    &quot;en&quot;: &quot;With but slightly more motion of his light pen, he could similarly delete any string of words or letters. He demonstrated this by cutting out what I thought to be some relevant prose, and then he showed how the system allowed for second thoughts about such human-directed processes—those words were automatically saved for a brief period in case he wanted to call them back. Leaving his light pen pointed at the space where a deleted symbol string used to be, Joe could reinstate it instantaneously with one stroke of his left hand.&quot;
  },
  &quot;3b5c&quot;: {
    &quot;id&quot;: &quot;p_295&quot;,
    &quot;zh&quot;: &quot;在删除任意符号串所需的操作之外，只增加一次光笔指点，乔就能让计算机把那串符号从原处移走，插入光笔指定的新位置。它同样会立即从原处消失；但这次，在新画面中，指定位置的旧文字会恰好让出足够空间，容纳这串符号。所有文字仍然整齐得像刚刚重新打过。用类似的键组与光笔操作，乔可以改变段落分界，交换任意两串符号的位置——词、句子、段落或其中的片段都可以——还可以重新设定任何部分文字的边距。基本上，校对者用专用符号标出的任何修改，他都能立即实现；区别只在于，这里的校对者始终面对干净的文字，仿佛每作一个标记，全文就瞬间重打了一遍。&quot;,
    &quot;en&quot;: &quot;Adding one more light-pen pointing to what it took to delete an arbitrary string of symbols, Joe could direct the computer to move that string from where it was to insert it at a new point which his light pen designated. Again it would disappear instantaneously from where it had been, but now the modified display would show the old text to have been spread apart just enough at the indicated point to hold this string. The text would all still look as neat as if freshly retyped. With similar types of keyset and light-pen operations, Joe could change paragraph break points, transpose two arbitrary symbol strings (words, sentences, paragraphs, etc., or fragments thereof), readjust margins of arbitrary sections of text—essentially being able to affect immediately any of the changes that a proofreader might want to designate with his special marks, only here the proofreader is always looking at clean text as if it had been instantaneously retyped after each designation had been made.&quot;
  },
  &quot;3b5d&quot;: {
    &quot;id&quot;: &quot;p_296&quot;,
    &quot;zh&quot;: &quot;乔还展示了怎样要求系统，把某个术语的每一次出现，都替换成新指定的术语；同样也是立即完成。他还可以任意设定某部分文字左右边界的位置，行长与行数会自动调整。为了说明这在并排显示平行论证或相反论证时的用处，他把两段论证各压缩到一半宽度，并排放置，中间随即出现一条竖线；不过，他说，这个功能实际使用起来还要更精细一些。其中一段比另一段长约三分之一；乔左手快速按两下，计算机就自动调整：中间的分隔线向较短文字那边移动，两部分的行长随之改变，直到它们在画面上占据相同的高度。是的，你开始体会“操作符号结构的灵活新方法”到底意味着什么了；至少，在这个基本能力层次上，你开始有了感觉。&quot;,
    &quot;en&quot;: &quot;Joe also demonstrated how he could request that each instance of the use of a given term be changed to a newly designated term, and this would again be instantaneously accomplished. Also, he could arbitrarily set the margins between which any section of text must appear, and its line lengths and number of lines would automatically be adjusted. He showed how this was useful in displaying parallel or counter arguments—although he said that actual use of this feature was a bit more sophisticated—by squeezing each into half width and putting them side by side (with a vertical line suddenly separating them). One of the sections of text was about a third longer than the other—but two quick strokes with Joe&#x27;s left hand caused the computer to adjust the display automatically. The middle separator line was moved toward the shorter piece of text, and the line lengths of the two sections were adjusted so that they occupied the same length along the display frame. Yes, you were beginning to get a feel for what the expression \&quot;flexible new methods for manipulating symbol structures\&quot; might really imply, at least on this basic-capability level.&quot;
  },
  &quot;3b6a&quot;: {
    &quot;id&quot;: &quot;p_298&quot;,
    &quot;zh&quot;: &quot;“接下来，若要上升到更高层次的能力，让你体会重建后的能力层级体系怎样工作，有个办法会比较快：看看怎样把刚才演示的那些较基础能力，组织成一些新的、更好的方法，建立我们所说的‘论证’。这里宽泛地说，‘论证’指一组陈述；这些陈述，我们称为‘成果陈述’，代表围绕某个目标工作一段时间后得到的产物。有点不清楚？那就先看最简单的情况：一项论证最终产生一条成果陈述。比如，你工作到某个地方，必须决定下一步做什么。你经过一番推理，通常会涉及若干陈述，最后得到一条规定下一步行动的陈述。最后这条就是成果陈述，代表产生它的论证或推理过程的产物。”&quot;,
    &quot;en&quot;: &quot;\&quot;If we want to go on to a higher-level capability to give you a feeling for how our rebuilt capability hierarchy works, it will speed us along to look at how we might organize these more primitive capabilities which I have demonstrated into some new and better ways to set up what we can call an &#x27;argument.&#x27; This refers loosely to any set of statements (we&#x27;ll call them &#x27;product statements&#x27;) that represents the product of a period of work toward a given objective. Confused? Well, take the simple case where an argument leads to a single product statement. For instance, you come to a particular point in your work where you have to decide what to do for the next step. You go through some reasoning process—usually involving statements—and come up with a statement specifying that next step. That final statement is the product statement, and it represents the product of the argument or reasoning process which led to it.&quot;
  },
  &quot;3b6ab&quot;: {
    &quot;id&quot;: &quot;p_325&quot;,
    &quot;zh&quot;: &quot;“此外，在我们当前集中注意的某个局部区域，网络里可以显示额外的细部结构和标签细节。等注意力转到另一处，这些细节就淡去，余下的粗略结构被压缩，好腾出空间放大新的关注点。这很像浏览结构时，使用放大倍率不同的区域：正在检查细节的地方，放大得多；周围区域，放大得少。这样，你对整体结构，以及自己所处位置的感觉，就能够始终保留下来。”&quot;,
    &quot;en&quot;: &quot;\&quot;Also, we can display extra fine-structure and labelling detail within the network in the specific local area we happen to be concentrating upon. This finer detail is washed out as we move to another spot with our close attention, and the coarser remaining structure is compressed, so that there is room for our new spot to be blown up. It is a lot like using zones of variable magnification as you scan the structure—higher magnification where you are inspecting detail, lower magnification in the surrounding field so that your feel for the whole structure and where you are in it can stay with you.\&quot;&quot;
  },
  &quot;3b6b&quot;: {
    &quot;id&quot;: &quot;p_299&quot;,
    &quot;zh&quot;: &quot;“通常，你把论证想象为一串线性排列的推理步骤，从已知事实、假设等出发，逐步走向结论。不错，我们确实必须依次思考这些步骤；写下来时，也通常把它们排成一串，因为纸张和书籍差不多就只能这样呈现。它们允许我们采用的符号结构形式，非常有限。你见过那种正文次序被‘打散’、需要按指引跳转的程序教学书吗？它就是一个有趣的例子：不再把步骤完全按一条直线来呈现。”&quot;,
    &quot;en&quot;: &quot;\&quot;You usually think of an argument as a serial sequence of steps of reason, beginning with known facts, assumptions, etc., and progressing toward a conclusion. Well, we do have to think through these steps serially, and we usually do list the steps serially when we write them out because that is pretty much the way our papers and books have to present them—they are pretty limiting in the symbol structuring they enable us to use. Have you even seen a &#x27;scrambled-text&#x27; programmed instruction book? That is an interesting example of a deviation from straight serial presentation of steps.&quot;
  },
  &quot;3b6c&quot;: {
    &quot;id&quot;: &quot;p_300&quot;,
    &quot;zh&quot;: &quot;“但是，从概念上说，论证并不是单线串行的。我承认，它有先后次序，因为有些陈述必须跟在另一些陈述之后；可是，这并不意味着它在性质上必然是线性的一串。我们通常把陈述B排在A之后，再依次排上C、D、E、F，等等。这是符号的串行组织。也许，每一条陈述在逻辑上，都由列表里排在它前面的全部陈述推出；倘若如此，概念结构本身也就是串行的，这种符号结构便很好地与之对应。”&quot;,
    &quot;en&quot;: &quot;\&quot;Conceptually speaking, however, an argument is not a serial affair. It is sequential, I grant you, because some statements have to follow others, but this doesn&#x27;t imply that its nature is necessarily serial. We usually string Statement B after Statement A, with Statements C, D, E, F, and so on following in that order—this is a serial structuring of our symbols. Perhaps each statement logically followed from all those which preceded it on the serial list, and if so, then the conceptual structuring would also be serial in nature, and it would be nicely matched for us by the symbol structuring.&quot;
  },
  &quot;3b6d&quot;: {
    &quot;id&quot;: &quot;p_301&quot;,
    &quot;zh&quot;: &quot;“但更常见的情形可能是：A是独立陈述，B依赖A，C与D各自独立，E依赖D和B，E依赖C，而F依赖A、D和E。看明白了吗？有先后约束，却不是单线串行；是一个概念网络，而不是一条概念链。旧有的纸笔符号操作方法，很难让我们建立并使用一种符号结构，去适配构建和运用概念结构的方式。有了这里这些新的符号操作方法，两者之间的匹配就有了极大的灵活性。说真的，这会极大地改变你投入工作的方式！”〔译者注：此例中的E在上传原文中出现两次，译文照录，不擅自改成其他字母。〕&quot;,
    &quot;en&quot;: &quot;\&quot;But a more typical case might find A to be an independent statement, B dependent upon A, C and D independent, E depending upon D and B, E dependent upon C, and F dependent upon A, D, and E. See, sequential but not serial? A conceptual network but not a conceptual chain. The old paper and pencil methods of manipulating symbols just weren&#x27;t very adaptable to making and using symbol structures to match the ways we make and use conceptual structures. With the new symbol-manipulating methods here, we have terrific flexibility for matching the two, and boy, it really pays off in the way you can tie into your work.&quot;
  },
  &quot;3b6n&quot;: {
    &quot;id&quot;: &quot;p_311&quot;,
    &quot;zh&quot;: &quot;“当你查看论证结构中间的一条陈述时，有几件事情是你想知道的。把情况简化一下，可以说你会问三个问题：‘这是什么意思？’‘根据什么？’以及‘那又怎样？’我们逐个来看，看看改变结构化方式，怎样帮助人更好地回答这些问题。”&quot;,
    &quot;en&quot;: &quot;\&quot;When you look at a given statement in the middle of your argument structure, there are a number of things you want to know. Let&#x27;s simplify the situation by saying that you might ask three questions, &#x27;What&#x27;s this?&#x27;, &#x27;How come?&#x27;, and &#x27;So what?&#x27; Let&#x27;s take these questions one at a time and see how some changes in structuring might help a person answer them better.&quot;
  },
  &quot;3b6o&quot;: {
    &quot;id&quot;: &quot;p_312&quot;,
    &quot;zh&quot;: &quot;“你看到一条陈述，想理解它的意思。你已经习惯于让陈述按照听见它时的形式呈现，也就是把词语排成一串。但是，正如论证中各条陈述之间的关系一样，一个句子中词语之间的概念关系，通常也不是线性串行的。如果我们能方便地使用某些非串行的句内符号结构形式，就能使符号更贴合概念结构，并从中受益。”&quot;,
    &quot;en&quot;: &quot;You look at a statement and you want to understand its meaning. You are used to seeing a statement portrayed in just the manner you might hear it—as a serial succession of words. But, just as with the statements within an argument, the conceptual relationship among the words of a sentence is not generally serial, and we can benefit in matching better to the conceptual structure if we can conveniently work with certain non-serial symbol-structuring forms within sentences.&quot;
  },
  &quot;3b6p&quot;: {
    &quot;id&quot;: &quot;p_313&quot;,
    &quot;zh&quot;: &quot;“我接下来要展示的大多数结构形式，都来自一项简单能力：在不同子结构之间建立任意链接，然后让计算机按照我们指定的相对位置，把一组相互链接的子结构显示出来。你可以规定任意多种链接类型，从而针对不同类型，指定不同的显示方式或操作方式。”&quot;,
    &quot;en&quot;: &quot;\&quot;Most of the structuring forms I&#x27;ll show you stem from the simple capability of being able to establish arbitrary linkages between different substructures, and of directing the computer subsequently to display a set of linked substructures with any relative positioning we might designate among the different substructures. You can designate as many different kinds of links as you wish, so that you can specify different display or manipulative treatment for the different types.\&quot;&quot;
  },
  &quot;3b6q&quot;: {
    &quot;id&quot;: &quot;p_314&quot;,
    &quot;zh&quot;: &quot;乔挑出你的一句话，把其余文字分别向上、向下推开几行，让它单独显露出来。随后，他展示怎样在键组上按几下，指定要建立的链接类型，再用光笔选中要连接的两个符号结构。他说，大多数链接都有方向，像从一个子结构指向另一个子结构的箭头；因此，建立链接时，必须按一定次序指定这两个子结构。&quot;,
    &quot;en&quot;: &quot;Joe picked out one of your sentences, and pushed the rest of the text a few lines up and down from it to isolate it. He then showed you how he could make a few strokes on the keyset to designate the type of link he wanted established, and pick the two symbol structures that were to be linked by means of the light pen. He said that most links possessed a direction, i.e., they were like an arrow pointing from one substructure to another, so that in setting up a link he must specify the two substructures in a given order.&quot;
  },
  &quot;3b6r&quot;: {
    &quot;id&quot;: &quot;p_315&quot;,
    &quot;zh&quot;: &quot;他操作了一小会儿，迅速在你的句子内部建立链接。然后，他向你展示，查看并理解一条陈述时能够得到怎样的帮助。“这是一种标准呈现方式。我已经建立了一个计算机过程，让它根据词语之间的链接，自动完成这种结构安排。”他在键组上按了几下，句子忽然散开了：不同部分被放在不同位置，用一些线条连接起来。“还记得学习语法时画句子结构图吗？有了好的方法，再稍加练习，你会吃惊地发现：用图解来拆分句子，对迅速浏览并理清复杂陈述，帮助有多大。”&quot;,
    &quot;en&quot;: &quot;He went to work for a moment, rapidly setting up links within your sentence. Then he showed you how you could get some help in looking at a statement and understanding it. \&quot;Here is one standard portrayal, for which I have established a computer process to do the structuring automatically on the basis of the interword links.\&quot; A few strokes on the keyset and suddenly the sentence fell to pieces—different parts of it being positioned here and there, with some lines connecting them. \&quot;Remember diagramming sentences when you were studying grammar? Some good methods, plus a bit of practice, and you&#x27;d be surprised how much a diagrammatic breakdown can help you to scan a complex statement and untangle it quickly.&quot;
  },
  &quot;3b6s&quot;: {
    &quot;id&quot;: &quot;p_316&quot;,
    &quot;zh&quot;: &quot;“我们还开发了不少帮助处理单条陈述的小办法。不过，我不想用太多细节把你弄糊涂。你大概看得出，迅速查词典会很有帮助。”他用光笔指向一个术语，在键组上按几下，原有文字就进一步让开，定义出现在图解上方，而被解释的术语，比图中其余部分更亮。他还展示了怎样把辅助短语或句子，链接到陈述的相应部分，以提供更详细的说明。平时查看陈述时，这些辅助子结构不会出现；需要仔细研究时，一个简单请求，就能把它们调出来。&quot;,
    &quot;en&quot;: &quot;\&quot;We have developed quite a few more little schemes to help at the statement level. I don&#x27;t want to tangle you up with too much detail, though. You can see, probably, that quick dictionary-lookup helps.\&quot; He aimed at a term with the light pen and hit a few strokes on the keyset, and the old text jumped farther out of the way and the definition appeared above the diagram, with the defined term brighter than the rest of the diagram. And he showed you also how you could link secondary phrases (or sentences) to parts of the statement for more detailed description. These secondary substructures wouldn&#x27;t appear when you normally viewed the statement, but could be brought in by simple request if you wanted closer study.&quot;
  },
  &quot;3b6u&quot;: {
    &quot;id&quot;: &quot;p_318&quot;,
    &quot;zh&quot;: &quot;“你看到一条陈述，问‘根据什么？’时，通常会向前回看已经排成一串的陈述，寻找它成立的依据。但在这些前面的陈述中，有些对于理解依据特别重要，另一些则没有那么重要。我们可以用所谓‘依据链接’指向那些重要陈述。我来让你大致看看，我们怎样构建论证，使人能够迅速追溯某一陈述所依托的关键依据。”&quot;,
    &quot;en&quot;: &quot;\&quot;When you look at a statement and ask, &#x27;How come?&#x27;, you are used to scanning back over a serial array of previously made statements in search of an understanding of the basis upon which this statement was made. But some of these previous statements are much more significant than others to this search for understanding. Let us use what we call &#x27;antecedent links&#x27; to point to these, and I&#x27;ll give you a basic idea of how we structure an argument so that we can quickly track down the essential basis upon which a given statement rests.\&quot;&quot;
  },
  &quot;3b6v&quot;: {
    &quot;id&quot;: &quot;p_319&quot;,
    &quot;zh&quot;: &quot;你帮助乔，找出刚才研究的那条陈述的直接依据项，他把链接一一建立起来。这些陈述散布在你原先排列的陈述列表中。乔展示，只需要求计算机对指定陈述的全部直接依据项执行操作，就能让它们变亮，或者加上下划线，在眼前突出出来。不过，他说，很快你就会对查看所有陈述的线性列表不再那么感兴趣。于是，他又通过键组发出一个请求：除直接依据项外，其他先前陈述都从屏幕上撤下。正在研究的陈述移到画面底部，依据陈述则整齐地排列在它上方。&quot;,
    &quot;en&quot;: &quot;You helped him pick out the primary antecedents of the statement you had been studying, and he established links to them. These statements were scattered back through the serial list of statements that you had assembled, and Joe showed you how you could either brighten or underline them to make them stand out to your eye—just by requesting the computer to do this for all direct antecedents of the designated statement. He told you, though, that you soon get so you aren&#x27;t very much interested in seeing the serial listing of all of the statements, and he made another request of the computer (via the keyset) that eliminated all the prior statements, except the direct antecedents, from the screen. The subject statement went to the bottom of the frame, and the antecedent statements were neatly listed above it.&quot;
  },
  &quot;3b6x&quot;: {
    &quot;id&quot;: &quot;p_321&quot;,
    &quot;zh&quot;: &quot;“每个直接依据项，也可以同样链接到它自己的直接依据项；如此追溯下去，直到那些代表初始前提、已接受事实，以及建立本项论证所依据目标的陈述。等论证中所有陈述的依据链接都建好以后，你查看某条陈述时提出的‘那又怎样？’，就可以通过寻找哪些陈述以它为依据来回答。我们已经拥有通往这些后继项的链接；只要把依据链接的箭头反过来，就是后继链接。因此，我们很容易调出一个没有杂乱干扰的后继陈述画面，帮助自己看清：为什么这项论证需要眼前这条陈述。”&quot;,
    &quot;en&quot;: &quot;\&quot;Each primary antecedent can similarly be linked to its primary antecedents, and so on, until you arrive at the statements representing the premises, the accepted facts, and the objectives upon which this argument had been established. When we had established the antecedent links for all the statements in the argument, the question &#x27;So what?&#x27; that you might ask when looking at a given statement would be answered by looking for the statements for which the given statement was an antecedent. We already have links to these consequents—just turn around the arrows on the antecedent links and we have consequent links. So we can easily call forth an uncluttered display of consequent statements to help us see why we needed this given statement in the argument.&quot;
  },
  &quot;3b6z&quot;: {
    &quot;id&quot;: &quot;p_323&quot;,
    &quot;zh&quot;: &quot;乔展示了怎样利用这幅图研究论证结构。用光笔指向任意节点，在键组上按几下，对应的陈述就会出现在另一块屏幕上，那个节点也会变亮。在第二块屏幕上调出依据项，选中一个特别感兴趣的，撤掉其余的显示；然后再沿着依据路径继续追溯。一块屏幕随时用来查看细节，另一块则显示较大的整体图景；相关节点会自动变亮，指出这些细节在整体中的位置。&quot;,
    &quot;en&quot;: &quot;Joe demonstrated some ways in which you could make use of the diagram to study the argument structure. Point to any node, give a couple of strokes on the keyset, and the corresponding statement would appear on the other screen—and that node would become brighter. Call the antecedents forth on the second screen, and select one of special interest—deleting the others. Follow back down the antecedent trail a little further, using one screen to look at the detail at any time, and the other to show you the larger view, with automatic node-brightening indication of where these detailed items fit in the larger view.&quot;
  },
  &quot;3b7a&quot;: {
    &quot;id&quot;: &quot;p_327&quot;,
    &quot;zh&quot;: &quot;“无论你处理的问题规模如何，不管它占用你半小时还是两年，在我们看来，与你的工作有关的全部陈述、草图、计算、文献来源和摘录，都构成一个单一的符号结构。从单个符号的层次，到整个集合的层次，中间可能有许多层子结构。刚才，你和我处理的是一些较低阶的子结构：单条陈述，以及由多条陈述组成的论证；我们也粗略看过一些建立和操作它们的方法。小型论证的结果，通常会被整合进更高层次的论证网络或概念发展网络；后者又被整合进更高层次的网络，如此类推。但无论在哪个层次，对论证内核之间的相互关系进行标记、呈现、研究和操作的方法，都与我们刚才看到的差不多。”&quot;,
    &quot;en&quot;: &quot;\&quot;If you are tangling with a problem of any size—whether it involves you for half an hour or two years—the entire collection of statements, sketches, computations, literature sources, and source extracts that is associated with your work would in our minds constitute a single symbol structure. There may be many levels of substructuring between the level of individual symbols and that represented by the entire collection. You and I have been working with some of the lower-ordered substructures—the individual statements and the multistatement arguments—and have skimmed through some of the ways to build and manipulate them. The results of small arguments are usually integrated in a higher level network of argument or concept development, and these into still higher-level networks, and so on. But at any such level, the manner in which the interrelationship between the kernels of argument can be tagged, portrayed, studied and manipulated is much the same as those which we have just been through.&quot;
  },
  &quot;3b7b&quot;: {
    &quot;id&quot;: &quot;p_328&quot;,
    &quot;zh&quot;: &quot;“代表数学或形式逻辑论证的子结构，可以直接与由非形式化陈述构成的子结构链接起来。代表图表、曲线、工程图和其他图形形式的子结构，也可以同样整合进来。还可以把任意大小的特殊子结构，附接到其他特定子结构上。一个常见用途，是附加说明材料；有点像脚注，但灵活得多。也可以挂上一些特别的留言，提出如何简化论证、怎样绕开阻碍之类的想法，留待以后发现和考虑。平时，这些不同的附加子结构可以不让工作者看见，直到他希望它们进入视野。他随时可以要求网络图显示提示符号，指明哪里有附加内容、链接在什么位置、分别属于什么类型，然后调出自己需要的部分。如果只对某一种附加子结构感兴趣，他就只要求显示这一类的提示。”&quot;,
    &quot;en&quot;: &quot;\&quot;Substructures that might represent mathematical or formal-logic arguments may be linked right in with substructures composed of the more informal statements. Substructures that represent graphs, curves, engineering drawings, and other graphical forms can likewise be integrated. One can also append special substructures, of any size, to particular other substructures. A frequent use of this is to append descriptive material—something like footnotes, only much more flexible. Or, special messages can be hung on that offer ideas such as simplifying an argument or circumventing a blocked path—to be uncovered and considered at some later date. These different appended substructures can remain invisible to the worker until such time as he wants to flush them into view. He can ask for the cue symbols that indicate their presence (identifying where they are linked and what their respective types are) to be shown on the network display any time he wishes, and then call up whichever of them he wishes If he is interested in only one type of appended substructure, he can request that only the cues associated with that type be displayed.&quot;
  },
  &quot;3b7c&quot;: {
    &quot;id&quot;: &quot;p_329&quot;,
    &quot;zh&quot;: &quot;“你还应当意识到，子结构不一定是大结构通常形态中，一块整齐分隔、独立存在的数据。你可以从一个符号结构，或者一般而言，从某个子结构中，任意选取若干子结构；再把它们与希望新增的子结构，按任意方式组织起来，由此定义一个新子结构。以后，计算机随时可以把它从大结构中梳理出来，呈现给你。布什提出的关联路径，就是这种做法的一个初步例子。在某个工作阶段的早期，内容还在不断变化时，会有大量这种活动；刚才你收集试验性的论证链时，就已经见过。但在这里，我们又不断找到令人欣喜的新方式，用那些看似简单的能力，发展新的高层能力；当然，等这些能力发展出来，它们本身也会显得挺简单。”&quot;,
    &quot;en&quot;: &quot;\&quot;You should also realize that a substructure doesn&#x27;t have to be a hunk of data sitting neatly distinct within the normal form of the larger structure. One can choose from a symbol structure (or substructure, generally) any arbitrary collection of its substructures, designate any arbitrary structuring among these and any new substructures he wants to add, and thus define a new substructure which the computer can untangle from the larger structure and present to him at any time. The associative trails that Bush suggested represent a primitive example of this. A good deal of this type of activity is involved during the early, shifting development of some phase of work, as you saw when you were collecting tentative argument chains. But here again, we find ever more delightful ways to make use of the straightforward-seeming capabilities in developing new higher-level capabilities—which, of course, seem sort of straightforward by then, too.&quot;
  },
  &quot;3b7e&quot;: {
    &quot;id&quot;: &quot;p_331&quot;,
    &quot;zh&quot;: &quot;“我想，你一定有过这样的经历：认真研读一篇期刊文章，努力理解它，也许还要得出一些针对特定目的的结论，纳入自己的工作。一旦你熟练掌握了在我们展示的这种符号结构中穿行的方法，再为同样目的去研究别人按这种方式组织的工作，你就会发现，体验有天壤之别：弄清他做了什么、为什么这样做，找出你要采用的内容，并确认在什么条件下可以采用，都会容易得多。即使他的结构还保持着日常工作时的原样，没有专门替外来者安排指路设施，也是如此。不过，我们已经学会了不少简单技巧，在工作结构上附加路标、补充信息、问题和辅助链接；这些东西不会妨碍自己的工作，却能让来访者在令人惊讶的短时间内形成理解，找出所需内容。其中有些技术，与自动化教学程序采用的技术密切相关；也许你知道‘教学机器’吧？”&quot;,
    &quot;en&quot;: &quot;\&quot;I&#x27;m sure that you&#x27;ve had the experience of working over a journal article to get comprehension and perhaps some special-purpose conclusions that you can integrate into your own work. Well, when you ever get handy at roaming over the type of symbol structure which we have been showing here, and you turn for this purpose to another person&#x27;s work that is structured in this way, you will find a terrific difference there in the ease of gaining comprehension as to what he has done and why he has done it, and of isolating what you want to use and making sure of the conditions under which you can use it. This is true even if you find his structure left in the condition in which he has been working on it—that is, with no special provisions for helping an outsider find his way around. But we have learned quite a few simple tricks for leaving appended road signs, supplementary information, questions, and auxiliary links on our working structures—in such a manner that they never get in our way as we work—so that the visitor to our structure can gain his comprehension and isolate what he wants in marvelously short order. Some of these techniques are quite closely related to those used in automated-instruction programming—perhaps you know about &#x27;teaching machines?&#x27;&quot;
  },
  &quot;3b7g&quot;: {
    &quot;id&quot;: &quot;p_333&quot;,
    &quot;zh&quot;: &quot;“我们这里有好几个人，正在用增强系统开展项目研究。我们发现，对一份参考资料处理过几遍以后，就很少再回到它的原始形式了。它留在档案中，像一块橘子皮，大部分真正的汁液已经挤出。这些参考资料所作的贡献，成为我们结构中坚实的构件，并且都妥善标明来源，所以应有的出处确认始终保留着。任何一个人对资料所作的分析与消化，都完全可以供其他人使用。令人惊讶的是，那些论文包含了多少冗余文字；它们的作用，只是试图弥补印刷文本在符号结构化方面少得可怜的可能性。”&quot;,
    &quot;en&quot;: &quot;\&quot;A number of us here are using the augmented systems for our project research, and we find that after a few passes through a reference, we very rarely go back to it in its original form. It sits in the archives like an orange rind, with most of the real juice squeezed out. The contributions from these references form sturdy members of our structure, and are duly tagged as to source so that acknowledgment is always implicitly noted. The analysis and digestion that any of us makes on such a reference is fully available to the others. It is rather amazing how much superfluous verbiage is contained in those papers merely to try to make up for the pitifully sparse possibilities available for symbol structuring in printed text.\&quot;&quot;
  },
  &quot;3b8ab&quot;: {
    &quot;id&quot;: &quot;p_362&quot;,
    &quot;zh&quot;: &quot;“现在，回到我们正在讨论的工作领域。这是一个智力领域，所加工和塑造的是概念材料，而不是物理材料。但在这两个领域中，就非例行工作者能够采用的过程与技术的多样性和复杂程度而言，我们仍然能发现很贴切的相似关系。设想一位创造性问题解决者的智力工作领域，听我随口列出几个专门学科：形式逻辑，各种数学，包括统计学，决策理论，博弈论，时间与动作分析，运筹学，分类理论，文献工作理论，关于时间、精力或金钱的成本核算，动态规划，以及计算机编程。这些深奥的学科，很可能为智力领域中的普通工作者贡献专门过程与技术。我相信，这只是全部可能来源中的一小部分。”&quot;,
    &quot;en&quot;: &quot;\&quot;So let&#x27;s turn back to the working domain which we are considering here. It is an intellectual one, where the processing and shaping done is of conceptual material rather than physical material. But between these two types of working domains we nonetheless find closely analogous conditions relative to the variety and sophistication of the processes and techniques applicable to what nonroutine workers do. Consider the intellectual domain of a creative problem solver, and listen to me rattle off the names of some specialized disciplines that come to mind. These esoteric disciplines could very possibly contribute specialized processes and techniques to a general worker in the intellectual domain: Formal logic—mathematics of many varieties, including statistics—decision theory—game theory—time and motion analysis—operations research—classification theory—documentation theory—cost accounting, for time, energy, or money—dynamic programming—computer programming. These are only a few of the total, I&#x27;m sure.&quot;
  },
  &quot;3b8ad&quot;: {
    &quot;id&quot;: &quot;p_364&quot;,
    &quot;zh&quot;: &quot;“再回到工具的话题，以及那位得到设备和助手的发明家的比喻。得到增强的智力工作者，获得的基本上也是同类服务，只不过更多：这种服务会层层复合放大。细致、精确地构建过程，使计算机能够回答有限范围的问题，带你找到结构中的相关说明和规格要求，独立执行复杂但只需有限理解的过程，并在指导复杂复合过程的执行时，承担追踪繁复规则与程序所需的记录工作。这样，许多来自高度专门领域的过程与技术，才真正变得可以使用：我们能够迅速判断它们的适用性与限制，有见识地把它们纳入可能行动方案的设计和分析，并高效执行。”&quot;,
    &quot;en&quot;: &quot;\&quot;But back to the topic of tools, and the analogy of the inventor who was given the equipment and the helper. Our augmented intellectual worker gets essentially this same kind of service, only more so—a compounding of this kind of service. Structuring our processes with care and precision enables the computer to answer limited questions, to guide you to relevant descriptions and specifications within its structure, to execute complex but limited-grasp processes on its own, and to take care of complex rule and procedure-following bookkeeping in guiding the execution of sophisticated composite processes. This actually makes it practical to use many specialized processes and techniques from very esoteric fields—to assess their applicability and limitations quickly, to incorporate them intelligently into the design and analysis of possible courses of action, and to execute them efficiently.&quot;
  },
  &quot;3b8ae&quot;: {
    &quot;id&quot;: &quot;p_365&quot;,
    &quot;zh&quot;: &quot;“我们的专门过程，就像一套出色的专用工具。它们由专家设计，随附操作说明、排障提示和完整设计资料。另外，还有其他工具，能够替我们自动处理使用手册，帮助判断这些工具是否适用。更进一步，如果某个工具出了问题，如果我们想设计自己的新工具并借用其中一个模块，或者想重新安排某些可调特征，我们都可以得到大量帮助：迅速学会关于设计必须知道的内容，完成调整，或者把其中一部分与另一工具连接起来。我们的工作间里，有一个高效的工具制造部门；在那里，可以从头设计和制造自己的工具，也可以把手头任何其他工具的部分或全部纳入其中。”&quot;,
    &quot;en&quot;: &quot;\&quot;Our specialized processes represent a beautiful collection of special tools. These tools are designed by specialists, and they come equipped with operating instructions, trouble-shooting hints, and complete design data. Furthermore, we are provided with other tools that help us determine the applicability of these tools by automatically operating upon the instruction manual for us. Further, if something goes wrong with one of these tools, if we want to design a new tool of our own and make use of one of its modular components, or if we want to rearrange some of its adjustable features, we get considerable help in learning what we have to know about its design, and in making adjustments or coupling a part of it to another tool. Our shop contains an efficient tool-making section, where we can design and build our own tools from scratch, or by incorporating parts or all of any other tools we have.&quot;
  },
  &quot;3b8af&quot;: {
    &quot;id&quot;: &quot;p_366&quot;,
    &quot;zh&quot;: &quot;“让我再说一个有意思的特点，它来自这些改进后的过程结构化技术。把复杂问题有效分解成人能够处理的步骤，基本上正是过程结构化所追求的事情；一旦做到这一点，人到了每个关口，都会有事可做。当然，这件事可能是继续思考，也可能是去检索；我们不是说每一步都必定简单明确。我要强调的是，我再也不会茫然失措，不知道下一步干什么。不错，有时仍会卡住；但卡住时，我有清楚、直接的方法，使自己确信：眼下就是应该继续啃这个障碍。”&quot;,
    &quot;en&quot;: &quot;\&quot;Let me tell you of an interesting feature stemming from my using such improved Process-structuring techniques. An effective job of breaking down a complex problem into humanly manageable steps—and this is essentially what we seek in our process structuring—will provide the human with something to do at every turn. This may be to ponder or go searching, true enough—we aren&#x27;t saying that the steps are necessarily straightforward. But the point I want to make is that no longer am I ever at a loss as to what to do next. I get stuck at times, to be sure, but when I do I have clean and direct ways to satisfy myself that I should just beat away at that roadblock for the time being.&quot;
  },
  &quot;3b8ag&quot;: {
    &quot;id&quot;: &quot;p_367&quot;,
    &quot;zh&quot;: &quot;“而且，在啃这个障碍时，我对已经尝试过什么、收集了哪些可能性、自己的假设和目标是什么，都有充分记录。它们极大地帮助我避免打转和进退两难，仔细穷尽各种可能，并认真分析假设与目标。更重要的是，我不会不断生成成堆重复打转的论证、清单和计算；我不是在检查已建立结构的有效性，就是在修正或扩展它。换句话说，在成功或放弃之前，我的理解似乎都在扎实、稳定地增长。即使放弃，我留下的也是一个组织良好的结构；以后有了新数据、新可能性、新假设、新目标或新工具，可以方便地回来继续。我还会设置一个哨兵过程，让它今后运行，提醒我注意可能突破这个障碍的概念。”&quot;,
    &quot;en&quot;: &quot;\&quot;And then, for beating away at the roadblock, my bookkeeping regarding what I&#x27;ve tried, what possibilities I&#x27;ve collected, and what my assumptions and objectives are, is good enough to help tremendously in keeping me from getting into loops and quandaries, in carefully exhausting possibilities, and in really analyzing my assumptions and objectives. What&#x27;s more, I&#x27;m not generating reams of cyclic arguments, lists, calculations, or the like—either I&#x27;m checking the validity of what I&#x27;ve already structured, or I am correcting or expanding the structure. In other words, it seems that the growth of my comprehension is sure and steady up to the point at which I succeed or give up. If I give up, I leave a structure which is very well organized to accommodate a subsequent revisit with new data, possibilities, assumptions, objectives, or tools. Also, I set up a sentinel process that will operate in the future to help alert me to concepts which may clear the block.&quot;
  },
  &quot;3b8b&quot;: {
    &quot;id&quot;: &quot;p_336&quot;,
    &quot;zh&quot;: &quot;他注意到，你看屏幕时皱起了眉头。“现在该稍微换个话题了。屏幕上那些让你困惑的东西，正好可以成为下一阶段讨论的起点。你看，为了让初学者体会这些技术，我给演示拟提纲时，本来可以把内容写成一个骨架式的论证结构。根据刚才的内容，你大概会以为我就是这样做的。但实际上，我把这件事当作一个将要执行的过程：给你作讲解演示的过程。这只是我们构建和操作过程的技术的一项很简单的应用，不过，我选择了用这种形式作笔记。”&quot;,
