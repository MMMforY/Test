(()=&gt;{

 [&#x27;core&#x27;,&#x27;01 · 全文主线&#x27;],[&#x27;hlamt&#x27;,&#x27;02 · 人—语言—工具—方法—训练&#x27;],[&#x27;cap&#x27;,&#x27;03 · 能力层级与组织&#x27;],[&#x27;struct&#x27;,&#x27;04 · 五种结构与增强循环&#x27;],[&#x27;symbol&#x27;,&#x27;05 · 符号操作与思维&#x27;],[&#x27;work&#x27;,&#x27;06 · 工作站与具体例子&#x27;],[&#x27;arg&#x27;,&#x27;07 · 论证与知识网络&#x27;],[&#x27;proc&#x27;,&#x27;08 · 工作流程与人机分工&#x27;],[&#x27;team&#x27;,&#x27;09 · 团队协作&#x27;],[&#x27;research&#x27;,&#x27;10 · 研究路线与自举&#x27;],[&#x27;limits&#x27;,&#x27;11 · 证据与理解边界&#x27;]
];
// id, group, label, English, status, definition, significance, original paragraph IDs
const rows = [
 [&#x27;augment&#x27;,&#x27;core&#x27;,&#x27;增强人类智力&#x27;,&#x27;Augmenting human intellect&#x27;,&#x27;核心主张&#x27;,&#x27;提高人在复杂情境中形成理解、提出方案并解决问题的能力。作者关注理解与求解的速度、质量，以及原本无法处理的问题能否变得可处理。&#x27;,&#x27;评价对象是人在真实问题中的整体表现；工具的速度只是其中一个条件。&#x27;,&#x27;1a1,1a3,5a1&#x27;],
 [&#x27;complexity&#x27;,&#x27;core&#x27;,&#x27;复杂问题与紧迫性&#x27;,&#x27;Complex problem situations&#x27;,&#x27;问题背景&#x27;,&#x27;社会活动规模、相互联系和问题复杂性不断增长，解决问题所需的速度也随之提高。这是作者选择“增强问题求解能力”为研究方向的理由。&#x27;,&#x27;问题可以持续二十分钟，也可以持续二十年；增强应适用于持续的专业工作。&#x27;,&#x27;1a1,1a2&#x27;],
 [&#x27;outcomes&#x27;,&#x27;core&#x27;,&#x27;更快、更好、更可解&#x27;,&#x27;Comprehension and solutions&#x27;,&#x27;目标定义&#x27;,&#x27;增强包含三组结果：理解更快、理解更好、原先难以理解的情境变得可理解；求解更快、方案更好、原先似乎不可解的问题变得可解。&#x27;,&#x27;不能只统计文本产量或操作次数，还要观察理解质量、方案质量与可处理的复杂程度。后半句是本图谱的评价转译。&#x27;,&#x27;1a1&#x27;],
 [&#x27;system&#x27;,&#x27;core&#x27;,&#x27;H-LAM/T 整体系统&#x27;,&#x27;Human using LAM, in which trained&#x27;,&#x27;核心框架&#x27;,&#x27;研究单位是受过训练的人及其使用的语言、人工器具和方法。人的能力通过这套相互依赖的组织发挥作用，作者主张协调地重新设计其中可改变的部分。&#x27;,&#x27;同一工具进入不同的概念、方法与技能组合，可能产生完全不同的效果。&#x27;,&#x27;2a4,2a5,2a14,2b1&#x27;],
 [&#x27;synergy&#x27;,&#x27;core&#x27;,&#x27;协同组织产生能力&#x27;,&#x27;Synergistic structuring&#x27;,&#x27;解释性框架&#x27;,&#x27;复杂能力来自较简单过程的有组织配合。作者逐层分析计算机功能，说明所谓智能分布在组织层级中，并把协同视为理解智能来源的候选解释。&#x27;,&#x27;系统性重组能够产生单个部件独立使用时没有的能力；这是一种解释框架，而非本文完成证明的普遍定律。&#x27;,&#x27;2c1a,2c1e,2c5c1a&#x27;],
 [&#x27;human&#x27;,&#x27;hlamt&#x27;,&#x27;H · 人&#x27;,&#x27;Human&#x27;,&#x27;框架要素&#x27;,&#x27;人的感知、认知与动作能力提供基础；目的、动机、判断、直觉以及有意识和无意识活动参与实际求解。作者将人的理解与目标置于系统活动中心。&#x27;,&#x27;增强系统需要为人的探索、判断和学习提供支持。&#x27;,&#x27;2a2,2b3,2c3d&#x27;],
 [&#x27;language&#x27;,&#x27;hlamt&#x27;,&#x27;L · 语言&#x27;,&#x27;Language&#x27;,&#x27;框架要素&#x27;,&#x27;语言既包括如何把世界分解成概念，也包括赋予概念的符号及其组织方式。因此，图表、数学记号、分类体系和术语都属于这里的语言。&#x27;,&#x27;改善表达也涉及改善概念本身，以及概念之间的关系。&#x27;,&#x27;2a4b,2c5c3d,2c5c4a&#x27;],
 [&#x27;artifacts&#x27;,&#x27;hlamt&#x27;,&#x27;A · 人工器具／工具&#x27;,&#x27;Artifacts&#x27;,&#x27;框架要素&#x27;,&#x27;人工器具是人设计的物理对象，可用于操纵物质或符号。报告主要研究计算机及受其控制的存储、处理、显示与通信设备。&#x27;,&#x27;数字工具之所以有价值，在于它提供的新过程能力能否进入人的整体工作方式。&#x27;,&#x27;2a4a,2a5&#x27;],
 [&#x27;method&#x27;,&#x27;hlamt&#x27;,&#x27;M · 方法体系&#x27;,&#x27;Methodology&#x27;,&#x27;框架要素&#x27;,&#x27;方法体系是为目标组织活动的程序、策略和办法；它体现在怎样选择、排序、监督、调整子过程之中。&#x27;,&#x27;把任务分解、安排与复盘也当作需要设计的工作内容，才能用好新增的工具能力。&#x27;,&#x27;2a4c,2a17,2c5c5b&#x27;],
 [&#x27;training&#x27;,&#x27;hlamt&#x27;,&#x27;T · 训练&#x27;,&#x27;Training&#x27;,&#x27;框架要素&#x27;,&#x27;训练使人能够有效运用语言、工具与方法。它包括技能形成、操作熟练、理解新的组织方式，以及学会调动可用能力。&#x27;,&#x27;工具可用不等于能力已经形成；改进系统必须考虑学习过程和迁移成本。后者为本图谱的理解。&#x27;,&#x27;2a4d,2a6,2c5g2&#x27;],
 [&#x27;interface&#x27;,&#x27;hlamt&#x27;,&#x27;人域—工具域接口&#x27;,&#x27;Two-domain system&#x27;,&#x27;框架要素&#x27;,&#x27;人和人工器具构成系统的两个物理活动域。复合过程通过接口交换能量与信息，使人的认知、感知和动作过程与工具内部过程相互配合。&#x27;,&#x27;接口质量应放在完整任务链中考察，包括输入、观察结果、解释和继续行动。&#x27;,&#x27;2c3a,2c3c&#x27;],
 [&#x27;repertoire&#x27;,&#x27;cap&#x27;,&#x27;能力库层级体系&#x27;,&#x27;Repertoire hierarchy&#x27;,&#x27;核心机制&#x27;,&#x27;每个人拥有可选择、调整和组合的过程能力库。高阶能力由较低阶能力构成；同一子能力可以被多个高阶过程复用，因此整体是交织的层级网络。&#x27;,&#x27;阅读、写作、规划、检索和检查等通用能力，会在许多不同任务里反复发挥作用。&#x27;,&#x27;2a8,2a10,2a12&#x27;],
 [&#x27;basic&#x27;,&#x27;cap&#x27;,&#x27;基础能力与研究边界&#x27;,&#x27;Basic capabilities&#x27;,&#x27;分析方法&#x27;,&#x27;“基础”指在当前研究允许的改动范围内不能再有用地改变的能力。通过分解已有能力，可以找到已使用的基础成分；还要寻找未被利用的能力。&#x27;,&#x27;基础层取决于研究约束，不是固定不变的人类能力清单。&#x27;,&#x27;2c5b1,2c5b2,2c5b4&#x27;],
 [&#x27;composite&#x27;,&#x27;cap&#x27;,&#x27;人机复合过程&#x27;,&#x27;Composite processes&#x27;,&#x27;能力分类&#x27;,&#x27;系统过程分为人独立执行、工具独立执行，以及同时包含两者的复合过程。一个复合过程还可以嵌套更小的复合过程。&#x27;,&#x27;工作流应按子过程的特点分配职责，并保留人机之间必要的信息交换。&#x27;,&#x27;2a13,3b8o&#x27;],
 [&#x27;propagate&#x27;,&#x27;cap&#x27;,&#x27;改变沿层级传播&#x27;,&#x27;Reverberating changes&#x27;,&#x27;核心机制&#x27;,&#x27;低层能力的改变可使高层过程重新组织；新形成的高层能力又会启用先前难以使用的低层潜能，变化因而向上、向下传播。&#x27;,&#x27;一次编辑能力改进可能进一步改变起草、论证、资料组织和项目规划。&#x27;,&#x27;2a20,2a21,2a22&#x27;],
 [&#x27;executive&#x27;,&#x27;cap&#x27;,&#x27;统筹能力&#x27;,&#x27;Executive capability&#x27;,&#x27;能力分类&#x27;,&#x27;选择、规划、安排和监督子过程的能力。作者用承包商与分包商的层级作比喻，说明一个人如何在多个任务和层级上承担组织职责。&#x27;,&#x27;组织工作消耗有限的注意力，却决定其他能力能否在正确的时机发挥作用。&#x27;,&#x27;2a17,2c5d2,2c5e1&#x27;],
 [&#x27;contributive&#x27;,&#x27;cap&#x27;,&#x27;直接贡献过程&#x27;,&#x27;Direct-contributive capabilities&#x27;,&#x27;能力分类&#x27;,&#x27;被组织与调度过程安排、直接产出任务结果的能力。例如接电话时，拿起听筒和问候属于直接贡献过程；判断情境和安排顺序属于组织过程。&#x27;,&#x27;增强既可以改善实际执行，也可以通过减少协调负担，为执行释放资源。&#x27;,&#x27;2c5d2,2c5e6&#x27;],
 [&#x27;flexibility&#x27;,&#x27;cap&#x27;,&#x27;支持试探与改计划&#x27;,&#x27;Freedom of disorderly processes&#x27;,&#x27;设计原则&#x27;,&#x27;复杂问题的理解会在探索中变化，计划、目标和中间结果需要反复修改。系统应帮助保存分支、尝试、理由与当前位置，使调整保持可管理。&#x27;,&#x27;作者珍视人的试探、直觉与改变主意；灵活性本身需要强有力的记录和组织能力。&#x27;,&#x27;2c5e5,2c5f3,2c5f5,3b8p&#x27;],
 [&#x27;compound&#x27;,&#x27;cap&#x27;,&#x27;反复使用带来复合效应&#x27;,&#x27;Compound effects&#x27;,&#x27;核心机制&#x27;,&#x27;通用过程会在多个任务和层级中被反复调用。对这些过程的改进，以及计算机在多个层级上的帮助，可能形成远超单次操作节省的整体影响。&#x27;,&#x27;作者没有在这里给出固定收益倍数；效应来自使用频度、依赖关系和进一步重组。&#x27;,&#x27;2c5g1,2c5g3&#x27;],
 [&#x27;personalize&#x27;,&#x27;cap&#x27;,&#x27;按个人特点调整&#x27;,&#x27;Adaptation to the individual&#x27;,&#x27;设计方向&#x27;,&#x27;既有增强手段常面向大群体演化。自动化系统应允许工具、语言和方法适应个体特点，并通过训练发展其相关能力。&#x27;,&#x27;同一种工作组织未必适合所有人；个人能够继续调整系统，是长期有效性的组成部分。&#x27;,&#x27;2c5g2,4g9&#x27;],
 [&#x27;structures&#x27;,&#x27;struct&#x27;,&#x27;五种结构&#x27;,&#x27;Five kinds of structuring&#x27;,&#x27;核心框架&#x27;,&#x27;作者暂时区分心智、概念、符号、过程与物理五种结构，用于分析系统如何产生和使用能力；这些分类是研究中的工作模型。&#x27;,&#x27;五种结构是五个分析角度，不应被画成必须单向通过、互不反馈的五级流水线。&#x27;,&#x27;2c5c1c,2c5c7a&#x27;],
 [&#x27;mental&#x27;,&#x27;struct&#x27;,&#x27;心智结构&#x27;,&#x27;Mental structuring&#x27;,&#x27;结构类型&#x27;,&#x27;个人内部的意象、关联、概念等组织，为理解、判断、直觉和行动提供基础。作者承认其具体心理机制尚不清楚，因而建议借助经验性研究。&#x27;,&#x27;关键行动取决于当时形成的理解状态；系统应帮助人发展可用的理解。&#x27;,&#x27;2c5c2a,2c5c2b,2c5c2d&#x27;],
 [&#x27;concept&#x27;,&#x27;struct&#x27;,&#x27;概念结构&#x27;,&#x27;Concept structuring&#x27;,&#x27;结构类型&#x27;,&#x27;明确组织概念及其相互关系，以承载要理解的内容。某些概念组织方式可能比其他方式更容易形成有效的心智结构。&#x27;,&#x27;把一个问题怎样切分、哪些关系应明确，是设计工作的一部分。&#x27;,&#x27;2c5c3a,2c5c3b,2c5c3c&#x27;],
 [&#x27;symbol&#x27;,&#x27;struct&#x27;,&#x27;符号结构&#x27;,&#x27;Symbol structuring&#x27;,&#x27;结构类型&#x27;,&#x27;用文字、图形、表格、列表和其他标记表现概念。相同的概念结构可以有不同的符号表达，适合不同的观察和思考任务。&#x27;,&#x27;表达形式与转换速度都会影响理解；保存一种表达并不意味着只能从一个角度阅读。&#x27;,&#x27;2c5c4a,2c5c4b,2c5c4c&#x27;],

const citations = {
  &quot;1a1&quot;: {
    &quot;id&quot;: &quot;p_7&quot;,
    &quot;zh&quot;: &quot;所谓“增强人类智力”，是指提高一个人的能力，使他能够着手应对复杂的问题情境，形成满足其特定需要的理解，并求得问题的解决办法。在这方面，能力的提高可以体现为以下几种变化的组合：理解得更快，理解得更好；在过去过于复杂、难以理解的情境中，如今能够获得具有实际用处的理解；更快地找到解决办法，找到更好的解决办法；以及有可能解决过去看来无法解决的问题。我们所说的“复杂情境”，包括外交官、管理者、社会科学家、生命科学家、物理科学家、律师和设计人员所面对的专业问题——无论一个问题情境持续二十分钟，还是二十年。我们谈的不是一些只在特定情境下派得上用场的孤立小窍门，而是一种生活与工作方式：在一个整合起来的领域中，预感、反复试探、难以明言的因素，以及人对“局势的感觉”，都能够同有力的概念、精练的术语与记号、精密的方法和强大的电子辅助工具相互配合、共同发挥作用。&quot;,
    &quot;en&quot;: &quot;By \&quot;augmenting human intellect\&quot; we mean increasing the capability of a man to approach a complex problem situation, to gain comprehension to suit his particular needs, and to derive solutions to problems. Increased capability in this respect is taken to mean a mixture of the following: more-rapid comprehension, better comprehension, the possibility of gaining a useful degree of comprehension in a situation that previously was too complex, speedier solutions, better solutions, and the possibility of finding solutions to problems that before seemed insoluble. And by \&quot;complex situations\&quot; we include the professional problems of diplomats, executives, social scientists, life scientists, physical scientists, attorneys, designers—whether the problem situation exists for twenty minutes or twenty years. We do not speak of isolated clever tricks that help in particular situations. We refer to a way of life in an integrated domain where hunches, cut-and-try, intangibles, and the human \&quot;feel for a situation\&quot; usefully co-exist with powerful concepts, streamlined terminology and notation, sophisticated methods, and high-powered electronic aids.&quot;
  },
  &quot;1a10&quot;: {
    &quot;id&quot;: &quot;p_16&quot;,
    &quot;zh&quot;: &quot;为了让读者初步了解这种计算机辅助工作系统大致是什么样子，下面简要描述一个可能的系统。这个例子并不是说，研究计划最终实际产生的系统就会如此。它只是为了说明工作的总体方向；采用虚构的外衣，也只是为了便于想象。&quot;,
    &quot;en&quot;: &quot;To give the reader an initial orientation about what sort of thing this computer-aided working system might be, we include below a short description of a possible system of this sort. This illustrative example is not to be considered a description of the actual system that will emerge from the program. It is given only to show the general direction of the work, and is clothed in fiction only to make it easier to visualize.&quot;
  },
  &quot;1a14&quot;: {
    &quot;id&quot;: &quot;p_20&quot;,
    &quot;zh&quot;: &quot;随后，建筑师暂不理会显示出的图形，开始输入一系列规格与数据：六英寸厚的楼板，开挖区域内十二英寸厚、八英尺高的混凝土墙，等等。输入完毕，修改后的场景便出现在屏幕上。一个建筑结构开始成形。他检查它、调整它，不时停下来向助手索取手册或产品目录中的资料，再据此重新调整。他经常从助手那里调出自己的工作清单，其中记录着设计规格与需要考虑的事项，以便查阅、修改或补充。这些清单逐渐成长为一个越来越详尽、相互关联的结构，体现出实际设计背后日渐成熟的思考。&quot;,
    &quot;en&quot;: &quot;Ignoring the representation on the display, the architect next begins to enter a series of specifications and data—a six-inch slab floor, twelve-inch concrete walls eight feet high within the excavation, and so on. When he has finished, the revised scene appears on the screen. A structure is taking shape. He examines it, adjusts it, pauses long enough to ask for handbook or catalog information from the clerk at various points, and readjusts accordingly. He often recalls from the \&quot;clerk\&quot; his working lists of specifications and considerations to refer to them, modify them, or add to them. These lists grow into an evermore-detailed, interlinked structure, which represents the maturing thought behind the actual design.&quot;
  },
  &quot;1a16&quot;: {
    &quot;id&quot;: &quot;p_22&quot;,
    &quot;zh&quot;: &quot;现在，他开始输入室内的详细信息。在这里，助手能够按他的要求显示任何观察视角，显得格外重要：例如室内剖面，或者从上方道路看过来的建筑外观。他输入具体的固定设施设计，并考察它们在特定房间里的效果。他还检查窗户反射的阳光是否会使道路上的驾驶员眩目。助手计算后告诉他：盛夏的早晨六点到六点半之间，其中一扇窗户会向道路产生强烈反光。&quot;,
    &quot;en&quot;: &quot;Now he begins to enter detailed information about the interior. Here the capability of the clerk to show him any view he wants to examine (a slice of the interior, or how the structure would look from the roadway above) is important. He enters particular fixture designs, and examines them in a particular room. He checks to make sure that sun glare from the windows will not blind a driver on the roadway, and the \&quot;clerk\&quot; computes the information that one window will reflect strongly onto the roadway between 6 and 6:30 on midsummer mornings.&quot;
  },
  &quot;1a18&quot;: {
    &quot;id&quot;: &quot;p_24&quot;,
    &quot;zh&quot;: &quot;所有这些信息——建筑设计以及与之相连的“思考结构”——都可以存储在一卷磁带上，作为这座建筑的设计手册。另一位建筑师、施工人员或客户，只要把这卷磁带装入自己的助手，就能够在这份设计手册中自由查阅，追踪自己关心的细节或思路；他们还可以添加专门的注释，把它们整合进设计手册，以便自己或其他人日后使用。&quot;,
    &quot;en&quot;: &quot;All of this information (the building design and its associated \&quot;thought structure\&quot;) can be stored on a tape to represent the design manual for the building. Loading this tape into his own clerk, another architect, a builder, or the client can maneuver within this design manual to pursue whatever details or insights are of interest to him—and can append special notes that are integrated into the design manual for his own or someone else&#x27;s later benefit.&quot;
  },
  &quot;1a2&quot;: {
    &quot;id&quot;: &quot;p_8&quot;,
    &quot;zh&quot;: &quot;人类的人口与总产出正以相当快的速度增长，但人类所面对的问题，其复杂程度增长得更快。随着活动节奏加快、活动日益具有全球性质，寻找解决办法的紧迫性也在不断上升。只要能够指出一条合理的途径，并展示一些可信的收益，一个有远见的社会就有充分理由全力追求上述意义上的人类智力增强。&quot;,
    &quot;en&quot;: &quot;Man&#x27;s population and gross product are increasing at a considerable rate, but the complexity of his problems grows still faster, and the urgency with which solutions must be found becomes steadily greater in response to the increased rate of activity and the increasingly global nature of that activity. Augmenting man&#x27;s intellect, in the sense defined above, would warrant full pursuit by an enlightened society if there could be shown a reasonable approach and some plausible benefits.&quot;
  },
  &quot;1a3&quot;: {
    &quot;id&quot;: &quot;p_9&quot;,
    &quot;zh&quot;: &quot;本报告介绍一个旨在开发人类智力增强手段的研究计划的第一阶段。这些“手段”可以包含许多东西，而它们看起来都只是对既有手段的延伸：过去，人类就已发展并运用各种手段，帮助自己发挥天生的感觉、心智和运动能力。我们认为，应当把人及其增强手段所组成的整个系统，作为探索实际改进可能性的适当对象。这个系统对社会极为重要；而且，它与大多数系统一样，要改善其表现，最好的办法是把整体看成一组相互作用的组成部分，而不是孤立地看待每个部分。&quot;,
    &quot;en&quot;: &quot;This report covers the first phase of a program aimed at developing means to augment the human intellect. These \&quot;means\&quot; can include many things—all of which appear to be but extensions of means developed and used in the past to help man apply his native sensory, mental, and motor capabilities—and we consider the whole system of a human and his augmentation means as a proper field of search for practical possibilities. It is a very important system to our society, and like most systems its performance can best be improved by considering the whole as a set of interacting components rather than by considering the components in isolation.&quot;
  },
  &quot;1b2&quot;: {
    &quot;id&quot;: &quot;p_32&quot;,
    &quot;zh&quot;: &quot;这里有两点需要强调。第一，虽然概念框架已经建立，但它仍然只是初步的。框架要继续发展，还需要进一步探索和实际研究。第二，即便我们的概念框架已经准确、完整地分析了人的智力活动效能所依赖的系统，未来改进系统的具体面貌，仍将深受技术变化以及我们对人类自身认识变化的影响——而这些变化是可以预期的。&quot;,
    &quot;en&quot;: &quot;Two points need emphasis here. First, although a conceptual framework has been constructed, it is still rudimentary. Further search, and actual research, are needed for the evolution of the framework. Second, even if our conceptual framework did provide an accurate and complete basic analysis of the system from which stems a human&#x27;s intellectual effectiveness, the explicit nature of future improved systems would be highly affected by (expected) changes in our technology or in our understanding of the human being.&quot;
  },
  &quot;2a10&quot;: {
    &quot;id&quot;: &quot;p_48&quot;,
    &quot;zh&quot;: &quot;无论如何，讨论某个特定的过程层级，并不需要从最底层开始。没有人每次面对新事物时，都会使用一个完全独一无二的过程。相反，他从一组基本的感觉—心智—运动过程能力出发，再加上人工器具所提供的某些过程能力。可供使用的人类基本能力与器具基本能力，其种类是有限的。此外，即使两个高阶过程很不相同，它们也可能共享一些本身已相当高阶的子过程。&quot;,
    &quot;en&quot;: &quot;In any case, it is not necessary to begin from the bottom in discussing particular process hierarchies. No person uses a process that is completely unique every time he tackles something new. Instead, he begins from a group of basic sensory-mental-motor process capabilities, and adds to these certain of the process capabilities of his artifacts. There are only a finite number of such basic human and artifact capabilities from which to draw. Furthermore, even quite different higher order processes may have in common relatively high-order sub-processes.\&quot;&quot;
  },
  &quot;2a12&quot;: {
    &quot;id&quot;: &quot;p_50&quot;,
    &quot;zh&quot;: &quot;因此，每个人都会发展出一套“过程能力库”，从中选择并调整所需能力，组成自己要执行的过程。这套能力库就像一个工具箱。正如机械师必须知道自己的工具能做什么、怎样使用，脑力工作者也必须了解自己的工具具有什么能力，并掌握有效运用它们的方法、策略和经验法则。个人能力库中的一切过程能力，最终都建立在他自身或其器具的基本能力之上；整个能力库构成一个相互交织的层级结构，我们常把它称为“能力库层级体系”。&quot;,
    &quot;en&quot;: &quot;What happens, then, is that each individual develops a certain repertoire of process capabilities from which he selects and adapts those that will compose the processes that he executes. This repertoire is like a tool kit, and just as the mechanic must know what his tools can do and how to use them, so the intellectual worker must know the capabilities of his tools and have good methods, strategies, and rules of thumb for making use of them. All of the process capabilities in the individual&#x27;s repertoire rest ultimately upon basic capabilities within him or his artifacts, and the entire repertoire represents an inter-knit, hierarchical structure (which we often call the repertoire hierarchy).&quot;
  },
  &quot;2a13&quot;: {
    &quot;id&quot;: &quot;p_51&quot;,
    &quot;zh&quot;: &quot;在一个典型个体的能力库中，我们可以区分三大类过程能力。第一类完全在人体之内执行，我们称为“纯人过程能力”（explicit-human process capabilities）；第二类由人工器具拥有，能够不经人的介入执行过程，我们称为“纯器具过程能力”（explicit-artifact process capabilities）；第三类则是“复合过程能力”（composite process capabilities），它来自同时包含前两类能力的层级体系。&quot;,
    &quot;en&quot;: &quot;We find three general categories of process capabilities within a typical individual&#x27;s repertoire. There are those that are executed completely within the human integument, which we call explicit-human process capabilities; there are those possessed by artifacts for executing processes without human intervention, which we call explicit-artifact process capabilities; and there are what we call the composite process capabilities, which are derived from hierarchies containing both of the other kinds.&quot;
  },
  &quot;2a14&quot;: {
    &quot;id&quot;: &quot;p_52&quot;,
    &quot;zh&quot;: &quot;我们认为，每当使用这套能力库时，真正拥有相应能力并执行相应过程的，都是我们的H-LAM/T系统：即“运用语言、人工器具和方法体系，并接受了相应训练的人”（Human using Language, Artifacts, Methodology, in which he is Trained）。为了更具体地把握这个模型，让我们在过程结构内部寻找LAM/T的各项成分。以撰写一份重要备忘录为例。这个过程关联着一个特定概念：把信息整理成一种正式的信息包，再分发给一组人，请他们作某种考虑。与这个概念相对应的信息包，被赋予了“备忘录”这个专门名称。这个过程在系统的语言中已经留下了痕迹，也就是一个概念及其名称。&quot;,
    &quot;en&quot;: &quot;We assume that it is our H-LAM/T system (Human using Language, Artifacts, Methodology, in which he is Trained) that has the capability and that performs the process in any instance of use of this repertoire. Let us look within the process structure for the LAM/T ingredients, to get a better \&quot;feel\&quot; for our models. Consider the process of writing an important memo. There is a particular concept associated with this process—that of putting information into a formal package and distributing it to a set of people for a certain kind of consideration—and the type of information package associated with this concept has been given the special name of memorandum. Already the system language shows the effect of this process—i.e., a concept and its name.&quot;
  },
  &quot;2a17&quot;: {
    &quot;id&quot;: &quot;p_55&quot;,
    &quot;zh&quot;: &quot;只要在适当的时机、以适当的次序调用上述子过程能力，确实就可以完成撰写备忘录的过程。然而，组织和监督这些子过程能力的运用，本身也是撰写备忘录中一个极为重要的子过程。因此，要使上述子过程能力的清单完整，还必须加入第七项能力——我们称之为“统筹能力”（executive capability）。这种能力可能来自习惯、策略、经验法则、成见、学会的方法、直觉、无意识的指令，或它们的某种组合；它使人能够以特定的顺序和时机，调用适当的子过程能力。统筹过程——也就是统筹能力的运用——包含规划、选择和监督等子过程。真正体现H-LAM/T系统全部方法体系的，正是这些统筹过程。〔译者注：原文写“第七项”，但前段实际列出五项。这里保留原文说法；论点在于，组织和监督其他过程本身，也是一项不可遗漏的能力。〕&quot;,
    &quot;en&quot;: &quot;The set of sub-process capabilities discussed so far, if called upon in proper occasion and sequence, would indeed enable the execution of the memo-writing process. However, the very process of organizing and supervising the utilization of these sub-process capabilities is itself a most important sub-process of the memo-writing process. Hence, the sub-process capabilities as listed would not be complete without the addition of a seventh capability—what we call the executive capability. This is the capability stemming from habit, strategy, rules of thumb, prejudice, learned method, intuition, unconscious dictates, or combinations thereof, to call upon the appropriate sub-process capabilities with a particular sequence and timing. An executive process (i.e., the exercise of an executive capability) involves such sub-processes as planning, selecting, and supervising, and it is really the executive processes that embody all of the methodology in the H-LAM/T system.&quot;
  },
  &quot;2a2&quot;: {
    &quot;id&quot;: &quot;p_36&quot;,
    &quot;zh&quot;: &quot;一个人对世界产生的全部影响，本质上都来自他能够通过有限的运动通道向世界传递的东西。而这些又取决于：他通过有限的感觉通道从外界接收的信息；他自身内部产生的信息、驱力和需要；以及他对这些信息的处理。他的处理活动有两类：一类是他通常能意识到的活动，例如识别模式、记忆、形成心象、抽象、演绎和归纳；另一类则包括对外来信息与自生信息的无意识处理和调节，以及对有意识处理活动本身的无意识调节。&quot;,
    &quot;en&quot;: &quot;The entire effect of an individual on the world stems essentially from what he can transmit to the world through his limited motor channels. This in turn is based on information received from the outside world through limited sensory channels; on information, drives, and needs generated within him; and on his processing of that information. His processing is of two kinds: that which he is generally conscious of (recognizing patterns, remembering, visualizing, abstracting, deducing, inducing, etc.), and that involving the unconscious processing and mediating of received and self-generated information, and the unconscious mediating of conscious processing itself.&quot;
  },
  &quot;2a20&quot;: {
    &quot;id&quot;: &quot;p_58&quot;,
    &quot;zh&quot;: &quot;这种书写机器将使你能够采用新的文字构写过程。例如，你可以把旧稿中的片段重新排列，间或停下来打入新词或新段落，从而迅速形成试拟稿。第一稿可以是思绪不受顺序约束的自由流露；你不断回看已经写下的想法，又会受到启发，产生新的考虑和念头，再把它们写进去。如果草稿中的思绪纠缠得太复杂，你可以迅速编排出一份次序重整的新稿。这样，在寻找适合自身需要的思考路径时，你就能实际驾驭更复杂的思路。&quot;,
    &quot;en&quot;: &quot;This writing machine would permit you to use a new process of composing text. For instance, trial drafts could rapidly be composed from re-arranged excerpts of old drafts, together with new words or passages which you stop to type in. Your first draft could represent a free outpouring of thoughts in any order, with the inspection of foregoing thoughts continuously stimulating new considerations and ideas to be entered. If the tangle of thoughts represented by the draft became too complex, you would compile a reordered draft quickly. It would be practical for you to accommodate more complexity in the trails of thought you might build in search of the path that suits your needs.&quot;
  },
  &quot;2a21&quot;: {
    &quot;id&quot;: &quot;p_59&quot;,
    &quot;zh&quot;: &quot;如果能够迅速而灵活地改动工作记录，你就更容易把新想法整合进去，也就能更持续地发挥创造力。如果工作记录的任何部分都容易更新，以适应思路或情境的新变化，你就会更容易把复杂一些的程序纳入自己的工作方式。这很可能使你能够承担额外的工作负担，例如建立和使用一些专门资料库：当前任何一项工作，都可以灵活地向它们提供内容，也可以利用其中的内容。而这又使你能够设计和采用更为复杂的程序，在自己的具体工作情境中更好地发挥才干。&quot;,
    &quot;en&quot;: &quot;You can integrate your new ideas more easily, and thus harness your creativity more continuously, if you can quickly and flexibly change your working record. If it is easier to update any part of your working record to accommodate new developments in thought or circumstance, you will find it easier to incorporate more complex procedures in your way of doing things. This will probably allow you to accommodate the extra burden associated with, for instance, keeping and using special files whose contents are both contributed to and utilized by any current work in a flexible manner—which in turn enables you to devise and use even-more complex procedures to better harness your talents in your particular working situation.&quot;
  },
  &quot;2a22&quot;: {
    &quot;id&quot;: &quot;p_60&quot;,
    &quot;zh&quot;: &quot;这里最重要的一点是：某一项具体能力上的直接创新，可以对能力层级体系的其他部分产生深远影响。变化可以沿着能力层级向上传递：能够利用最初那项改进能力的高阶能力，可以重新组织，以充分利用这项变化，以及中间层次能力随之发生的变化。变化也可以沿着层级向下传递：高层的新能力，可能使低层原本潜藏的改进机会变得可用。那些潜在能力过去在体系中无法使用，却会因为高层出现新能力而获得用武之地。&quot;,
    &quot;en&quot;: &quot;The important thing to appreciate here is that a direct new innovation in one particular capability can have far-reaching effects throughout the rest of your capability hierarchy. A change can propagate up through the capability hierarchy; higher-order capabilities that can utilize the initially changed capability can now reorganize to take special advantage of this change and of the intermediate higher-capability changes. A change can propagate down through the hierarchy as a result of new capabilities at the high level and modification possibilities latent in lower levels. These latent capabilities may previously have been unusable in the hierarchy and become usable because of the new capability at the higher level.&quot;
  },
  &quot;2a24&quot;: {
    &quot;id&quot;: &quot;p_62&quot;,
    &quot;zh&quot;: &quot;我们的目标，是弄清如何积极寻求提高人类智力活动效能的可能性。为此，必须认识到：我们要准备好沿着这些由新可能性构成的链条，在整个能力层级体系中追索——这要求采取系统性途径；还必须认识到，应当着眼于把遍布层级体系的新旧能力重新组织起来，以综合形成新的能力——这要求采取“系统工程”的途径。&quot;,
    &quot;en&quot;: &quot;To our objective of deriving orientation about possibilities for actively pursuing an increase in human intellectual effectiveness, it is important to realize that we must be prepared to pursue such new-possibility chains throughout the entire capability hierarchy (calling for a system approach). It is also important to realize that we must be oriented to the synthesis of new capabilities from reorganization of other capabilities, both old and new, that exist throughout the hierarchy (calling for a \&quot;system-engineering\&quot; approach).&quot;
  },
  &quot;2a4&quot;: {
    &quot;id&quot;: &quot;p_38&quot;,
    &quot;zh&quot;: &quot;我们的文化已经发展出一些手段，使我们能够把凭借基本能力所能做的那些小事组织起来，从而理解真正复杂的情境，并完成提出和实施问题解决办法的过程。我们把这些扩展人类能力的方式称为“增强手段”，并将其分为四个基本类别：&quot;,
    &quot;en&quot;: &quot;Our culture has evolved means for us to organize the little things we can do with our basic capabilities so that we can derive comprehension from truly complex situations, and accomplish the processes of deriving and implementing problem solutions. The ways in which human capabilities are thus extended are here called augmentation means, and we define four basic classes of them:&quot;
  },
  &quot;2a4a&quot;: {
    &quot;id&quot;: &quot;p_39&quot;,
    &quot;zh&quot;: &quot;1. 人工器具（Artifacts）：为人的舒适、为操作物体或材料，以及为操作符号而设计的实物。&quot;,
    &quot;en&quot;: &quot;Artifacts—physical objects designed to provide for human comfort, for the manipulation of things or materials, and for the manipulation of symbols.&quot;
  },
  &quot;2a4b&quot;: {
    &quot;id&quot;: &quot;p_40&quot;,
    &quot;zh&quot;: &quot;2. 语言（Language）：个人把自己的世界图景划分成各种概念、用这些概念在头脑中构建世界模型的方式；也包括他赋予这些概念的符号，以及他在有意识地操作概念——也就是“思考”——时使用这些符号的方式。&quot;,
    &quot;en&quot;: &quot;Language—the way in which the individual parcels out the picture of his world into the concepts that his mind uses to model that world, and the symbols that he attaches to those concepts and uses in consciously manipulating the concepts (\&quot;thinking\&quot;).&quot;
  },
  &quot;2a4c&quot;: {
    &quot;id&quot;: &quot;p_41&quot;,
    &quot;zh&quot;: &quot;3. 方法体系（Methodology）：个人用来组织以目标为中心的活动——也就是问题解决活动——的方法、程序、策略等。&quot;,
    &quot;en&quot;: &quot;Methodology—the methods, procedures, strategies, etc., with which an individual organizes his goal-centered (problem-solving) activity.&quot;
  },
  &quot;2a4d&quot;: {
    &quot;id&quot;: &quot;p_42&quot;,
    &quot;zh&quot;: &quot;4. 训练（Training）：使人在运用上述第1、2、3类手段时，其技能达到切实有效水平所需的训练与养成。&quot;,
    &quot;en&quot;: &quot;Training—the conditioning needed by the human being to bring his skills in using Means 1, 2, and 3 to the point where they are operationally effective.&quot;
  },
  &quot;2a5&quot;: {
    &quot;id&quot;: &quot;p_43&quot;,
    &quot;zh&quot;: &quot;因此，我们要改进的系统，可以理解为：一个受过训练的人，加上他所使用的人工器具、语言与方法体系。我们所设想的新系统，将把计算机以及由计算机控制的信息存储、处理和显示装置纳入人工器具之中。这里讨论的概念框架，主要着眼于人的这样一种能力：在整合的系统中，切实有效地利用这些设备。&quot;,
    &quot;en&quot;: &quot;The system we want to improve can thus be visualized as a trained human being together with his artifacts, language, and methodology. The explicit new system we contemplate will involve as artifacts computers, and computer-controlled information-storage, information-handling, and information-display devices. The aspects of the conceptual framework that are discussed here are primarily those relating to the human being&#x27;s ability to make significant use of such equipment in an integrated system.&quot;
  },
  &quot;2a6&quot;: {
    &quot;id&quot;: &quot;p_44&quot;,
    &quot;zh&quot;: &quot;所有增强手段都贯穿着某种结构或组织方式。一位未经训练的原住民无法在车流中驾驶汽车，是因为他无法一下子跨越自己的文化背景，与拥有汽车和交通系统的世界之间的鸿沟；但他可以通过有组织的训练，一步一步地学会有效而安全地驾驶。换言之，人的头脑，无论在学习还是行动中，都不是依靠大跨度的跳跃，而是通过经过组织、形成结构的一系列步骤来前进；每一步都依赖于此前的步骤。&quot;,
    &quot;en&quot;: &quot;Pervading all of the augmentation means is a particular structure or organization. While an untrained aborigine cannot drive a car through traffic, because he cannot leap the gap between his cultural background and the kind of world that contains cars and traffic, it is possible to move step by step through an organized training program that will enable him to drive effectively and safely. In other words, the human mind neither learns nor acts by large leaps, but by steps organized or structured so that each one depends upon previous steps.&quot;
  },
  &quot;2a8&quot;: {
    &quot;id&quot;: &quot;p_46&quot;,
    &quot;zh&quot;: &quot;每个思考过程或行动过程，都由子过程组成。譬如，画一道铅笔笔画、写一个字母，或制定一个计划，都是这样的例子。画一道铅笔笔画，需要把许多彼此分立的肌肉动作组织起来；同样，画出特定笔画，以及规划一个字母的写法，本身也是复杂过程，而它们又成为写出整个字母的子过程。&quot;,
    &quot;en&quot;: &quot;Every process of thought or action is made up of sub-processes. Let us consider such examples as making a pencil stroke, writing a letter of the alphabet, or making a plan. Quite a few discrete muscle movements are organized into the making of a pencil stroke; similarly, making particular pencil strokes and making a plan for a letter are complex processes in themselves that become sub-processes to the over-all writing of an alphabetic character.&quot;
  },
  &quot;2b1&quot;: {
    &quot;id&quot;: &quot;p_64&quot;,
    &quot;zh&quot;: &quot;能够在我们的文化中有效行动的人，其实已经得到了相当程度的“增强”。人感知刺激、进行各种心智操作，以及与外部世界交流的基本能力，是在一个系统中发挥作用的。这个系统就是H-LAM/T系统：个人借助自己受过训练、学会使用的语言、人工器具与方法体系而得到增强。此外，我们认为，提高个人在社会活动中的效能，应当作为一个系统工程问题来处理；也就是说，应以面向综合构建的方式，把H-LAM/T系统当作一个相互作用的整体来研究。&quot;,
    &quot;en&quot;: &quot;Individuals who operate effectively in our culture have already been considerably \&quot;augmented.\&quot; Basic human capabilities for sensing stimuli, performing numerous mental operations, and for communicating with the outside world, are put to work in our society within a system—an H-LAM/T system—the individual augmented by the language, artifacts, and methodology in which he is trained. Furthermore, we suspect that improving the effectiveness of the individual as he operates in our society should be approached as a system-engineering problem—that is, the H-LAM/T system should be studied as an interacting whole from a synthesis-oriented approach.&quot;
  },
  &quot;2b3&quot;: {
    &quot;id&quot;: &quot;p_66&quot;,
    &quot;zh&quot;: &quot;提高个人运用其基本能力的效能，就是重新设计系统中可改变部分的问题。这个系统持续从事的活动包括在人头脑中形成理解、解决问题等过程，而这两类过程都受人的动机、目的与意志支配。重新设计系统执行这些过程的能力，意味着重新设计整个或部分能力库层级体系。要重新设计一种结构，必须尽可能了解其基本材料和组成部分在结构中的使用方式；除此之外，还要学会根据整体功能及其目的来观察、测量、分析和评价它。在这里，没有任何一种现有分析理论，能够独自胜任对整个系统表现的分析与评估。因此，要寻求改进的系统，就必须采用实验方法。&quot;,
    &quot;en&quot;: &quot;Increasing the effectiveness of the individual&#x27;s use of his basic capabilities is a problem in redesigning the changeable parts of a system. The system is actively engaged in the continuous processes (among others) of developing comprehension within the individual and of solving problems; both processes are subject to human motivation, purpose, and will. To redesign the system&#x27;s capability for performing these processes means redesigning all or part of the repertoire hierarchy. To redesign a structure, we must learn as much as we can of what is known about the basic materials and components as they are utilized within the structure; beyond that, we must learn how to view, to measure, to analyze, and to evaluate in terms of the functional whole and its purpose. In this particular case, no existing analytic theory is by itself adequate for the purpose of analyzing and evaluating over-all system performance; pursuit of an improved system thus demands the use of experimental methods.&quot;
  },
  &quot;2c1a&quot;: {
    &quot;id&quot;: &quot;p_73&quot;,
    &quot;zh&quot;: &quot;当人们看见一个计算机系统正在执行非常复杂的任务时，表面上看到的是一台能够完成某些极其精密过程的机器。如果观察者是外行，他对于这种精密能力来源的理解，可能会赋予机器某种神秘力量，仿佛信息能够穿过具有知觉和智能的综合思考装置，自动得到处理。实际上，这种精密能力来自一个十分巧妙的组织层级。要在系统中追寻智能的来源，就必须沿着功能组织与物理组织的层层结构向下走，而这些层次会变得越来越基本。&quot;,
    &quot;en&quot;: &quot;When one looks at a computer system that is doing a very complex job, he sees on the surface a machine that can execute some extremely sophisticated processes. If he is a layman, his concept of what provides this sophisticated capability may endow the machine with a mysterious power to sweep information through perceptive and intelligent synthetic thinking devices. Actually, this sophisticated capability results from a very clever organizational hierarchy so that pursuit of the source of intelligence within this system would take one down through layers of functional and physical organization that become successively more primitive.&quot;
  },
  &quot;2c1e&quot;: {
    &quot;id&quot;: &quot;p_77&quot;,
    &quot;zh&quot;: &quot;如果这时再问：智能究竟体现在哪里？我们就不得不承认，它分布在功能过程的整个层级之中，难以单独指认；这个层级的基础，一直延伸到我们理解深度以下的自然过程。如果有什么单一因素是这种“智能”所依赖的，那似乎就是组织。生物学家和生理学家使用“协同效应”（synergism）一词。《韦氏大辞典》第二版把它解释为：“彼此分立的作用主体协同行动，使总效果大于各自独立作用效果之和……”这个词似乎可以直接用于这里。我们可以说，若要指出智能的真正来源，协同效应最有可能是那个答案。&quot;,
    &quot;en&quot;: &quot;If we then ask ourselves where that intelligence is embodied, we are forced to concede that it is elusively distributed throughout a hierarchy of functional processes—a hierarchy whose foundation extends down into natural processes below the depth of our comprehension. If there is any one thing upon which this &#x27;intelligence depends&#x27; it would seem to be organization. The biologists and physiologists use a term \&quot;synergism\&quot; to designate (from Webster&#x27;s Unabridged Dictionary, Second Edition) the \&quot;...cooperative action of discrete agencies such that the total effect is greater than the sum of the two effects taken independently...\&quot; This term seems directly applicable here, where we could say that synergism is our most likely candidate for representing the actual source of intelligence&quot;
  },
  &quot;2c2a&quot;: {
    &quot;id&quot;: &quot;p_80&quot;,
    &quot;zh&quot;: &quot;在本研究过程中，有人曾几次开玩笑地说，我们所追求的其实是一种“智能放大器”。这个说法最初被认为出自W. 罗斯·阿什比。[2,3] 起初，我们拒绝采用这个词，因为在当时看来，我们唯一能够期待的，是使人现有的智能与要处理的问题更好地匹配，而不是让人本身变得更聪明。但上一节所阐明的那些概念，使我们认识到，这个词实际上似乎很适合我们的目标。&quot;,
    &quot;en&quot;: &quot;It has been jokingly suggested several times during the course of this study that what we are seeking is an \&quot;intelligence amplifier.\&quot; (The term is attributed originally to W. Ross Ashby[2,3]. At first this term was rejected on the grounds that in our view one&#x27;s only hope was to make a better match between existing human intelligence and the problems to be tackled, rather than in making man more intelligent. But deriving the concepts brought out in the preceding section has shown us that indeed this term does seem applicable to our objective.&quot;
  },
  &quot;2c2b&quot;: {
    &quot;id&quot;: &quot;p_81&quot;,
    &quot;zh&quot;: &quot;接受“智能放大”这个说法，并不意味着试图提高人类天生的智能。之所以说它适合我们增强人类智力的目标，是因为最终形成的实体，将比一个没有这些辅助的人表现出更多可以称为“智能”的东西。通过把人的智力能力组织成更高层次的协同结构，我们就放大了人的智能。真正拥有放大后智能的，是由此形成的H-LAM/T系统；其中，LAM/T这些增强手段，构成了人的智能放大器。&quot;,
    &quot;en&quot;: &quot;Accepting the term \&quot;intelligence amplification\&quot; does not imply any attempt to increase native human intelligence. The term \&quot;intelligence amplification\&quot; seems applicable to our goal of augmenting the human intellect in that the entity to be produced will exhibit more of what can be called intelligence than an unaided human could; we will have amplified the intelligence of the human by organizing his intellectual capabilities into higher levels of synergistic structuring. What possesses the amplified intelligence is the resulting H-LAM/T system, in which the LAM/T augmentation means represent the amplifier of the human&#x27;s intelligence.&quot;
  },
  &quot;2c2c&quot;: {
    &quot;id&quot;: &quot;p_82&quot;,
    &quot;zh&quot;: &quot;放大自身智能时，我们运用的，是自然演化在发展人类基本能力时所遵循的协同组织原则。我们在发展增强手段时所做的，是建造一个上层结构：它以自然结构为基础，成为后者的人造延伸。从增强手段不断演化的角度看，在一种切实的意义上，“人工智能”的发展其实已经持续了好几个世纪。&quot;,
    &quot;en&quot;: &quot;In amplifying our intelligence, we are applying the principle of synergistic structuring that was followed by natural evolution in developing the basic human capabilities. What we have done in the development of our augmentation means is to construct a superstructure that is a synthetic extension of the natural structure upon which it is built. In a very real sense, as represented by the steady evolution of our augmentation means, the development of \&quot;artificial intelligence\&quot; has been going on for centuries.&quot;
  },
  &quot;2c3a&quot;: {
    &quot;id&quot;: &quot;p_84&quot;,
    &quot;zh&quot;: &quot;在H-LAM/T系统中，人和人工器具是仅有的物理组成部分。系统最终能够具有什么能力，取决于它们各自的能力。前面说过，系统中的任何复合过程，最终都可以分解为纯人过程与纯器具过程，这已经隐含了上述意思。因此，H-LAM/T系统包含两个彼此分开的活动域：一个由人代表，所有纯人过程都在其中发生；另一个由器具代表，所有纯器具过程都在其中发生。在任何复合过程中，这两个活动域都会相互协作，而这要求能量在二者之间交换，其中很大一部分能量交换仅仅是为了传递信息。图1描绘了这种双域观念，也包含下面将要讨论的其他概念。&quot;,
    &quot;en&quot;: &quot;The human and the artifacts are the only physical components in the H-LAM/T system. It is upon their capabilities that the ultimate capability of the system will depend. This was implied in the earlier statement that every composite process of the system decomposes ultimately into explicit-human and explicit-artifact processes. There are thus two separate domains of activity within the H-LAM/T system: that represented by the human, in which all explicit-human processes occur; and that represented by the artifacts, in which all explicit-artifact processes occur. In any composite process, there is cooperative interaction between the two domains, requiring interchange of energy (much of it for information exchange purposes only). Figure 1 depicts this two-domain concept and embodies other concepts discussed below.&quot;
  },
  &quot;2c3c&quot;: {
    &quot;id&quot;: &quot;p_87&quot;,
    &quot;zh&quot;: &quot;当一个纯人过程与一个纯器具过程耦合时，交换就在这一“界面”上发生。许多时候，这些相互耦合的过程，正是专为这种交换设计的，目的是使另外一些更深藏于各自活动域、承担更重要任务的纯人过程与纯器具过程，在功能上相互匹配。例如，手指和手的运动——纯人过程——使打字机的按键连杆运动起来，也就是与纯器具过程发生耦合。但这些只是整个匹配过程的一部分；真正需要衔接的，是人内部更深层的、决定打出某个词的过程，以及器具内部更深层的、实际把墨迹印到纸上的过程。&quot;,
    &quot;en&quot;: &quot;Exchange across this \&quot;interface\&quot; occurs when an explicit-human process is coupled to an explicit-artifact process. Quite often these coupled processes are designed for just this exchange purpose, to provide a functional match between other explicit-human and explicit-artifact processes buried within their respective domains that do the more significant things. For instance, the finger and hand motions (explicit human processes) activate key-linkage motions in the typewriter (couple to explicit-artifact processes). But these are only part of the matching processes between the deeper human processes that direct a given word to be typed and the deeper artifact processes that actually imprint the ink marks on the paper.&quot;
  },
  &quot;2c3d&quot;: {
    &quot;id&quot;: &quot;p_88&quot;,
    &quot;zh&quot;: &quot;外部世界通过与个人或其器具交换能量，同我们的H-LAM/T系统发生相互作用。为适应这种交换，也常常需要专门设计一些过程。不过，本研究直接关注的是系统内部，关注那些确实参与或有可能重要地参与以下活动的内部过程：帮助人形成理解，并追求人的目标。我们关心的是这些过程怎样影响系统在上述活动中的效能。&quot;,
    &quot;en&quot;: &quot;The outside world interacts with our H-LAM/T system by the exchange of energy with either the individual or his artifact. Again, special processes are often designed to accommodate this exchange. However, the direct concern of our present study lies within the system, with the internal processes that are and can be significantly involved in the effectiveness of the system in developing the human&#x27;s comprehension and pursuing the human&#x27;s goals.&quot;
  },
  &quot;2c4a&quot;: {
    &quot;id&quot;: &quot;p_90&quot;,
    &quot;zh&quot;: &quot;在继续直接讨论H-LAM/T系统之前，让我们先看一些背景材料。人类智力能力的发展，可以从下面这个历史序列来考察：&quot;,
    &quot;en&quot;: &quot;Before we pursue further direct discussion of the H-LAM/T system, let us examine some background material. Consider the following historical progression in the development of our intellectual capabilities:&quot;
  },
  &quot;2c4a1&quot;: {
    &quot;id&quot;: &quot;p_91&quot;,
    &quot;zh&quot;: &quot;（1）概念操作。人类通过生物演化获得了形成抽象与概念的能力，从而超越了较低等的生命形式。他们能够在一定程度上在头脑中操作这些概念，并以抽象方式思考情境。他们的心智能力使他们可以从具体事例中形成一般概念，从一般概念预测具体事例，把概念联系起来、记住它们，等等。这里说的是尚未语言化的原初概念。例如，一个人任由身后的门关上，却突然在头脑中看到：后面跟着的人，正端着一杯热咖啡和一些黏乎乎的点心。在这件即将发生的事情的诸多方面中，咖啡洒出、点心被挤坏的情形，不知怎么就立刻被抽象出来，并同个人责任感以及对这些后果的反感联系在一起。紧接着，一个解决办法以形象的形式进入头脑：迅速停步，向后伸出手臂，以适当的动作和时机挡住门，避免碰撞。这个办法随即被接受并付诸行动。仅凭这种不借助符号的概念操作，我们大概就能建造原始住所，发展战争与狩猎策略，玩游戏，开恶作剧。但在这一生物演化阶段——也就是我们今天仍然处于的阶段——还蕴含着进一步提高智力活动效能的潜力。&quot;,
    &quot;en&quot;: &quot;(1) Concept Manipulation—Humans rose above the lower forms of life by evolving the biological capability for developing abstractions and concepts. They could manipulate these concepts within their minds to a certain extent, and think about situations in the abstract. Their mental capabilities allowed them to develop general concepts from specific instances, predict specific instances from general concepts, associate concepts, remember them, etc. We speak here of concepts in their raw, unverbalized form. For example, a person letting a door swing shut behind him suddenly visualizes the person who follows him carrying a cup of hot coffee and some sticky pastries. Of all the aspects of the pending event, the spilling of the coffee and the squashing of the pastry somehow are abstracted immediately, and associated with a concept of personal responsibility and a dislike for these consequences. But a solution comes to mind immediately as an image of a quick stop and an arm stab back toward the door, with motion and timing that could prevent the collision, and the solution is accepted and enacted. With only non-symbolic concept manipulation, we could probably build primitive shelter, evolve strategies of war and hunt, play games, and make practical jokes. But further powers of intellectual effectiveness are implicit in this stage of biological evolution (the same stage we are in today).&quot;
  },
  &quot;2c4a3&quot;: {
    &quot;id&quot;: &quot;p_93&quot;,
    &quot;zh&quot;: &quot;（3）手工的外部符号操作。人类又发展出一些手段，把部分符号操作活动外化，尤其是把符号表达为图形。这是利用生物演化所赋予的心智能力、去形成理解和解决问题的又一个重要进步。它补充了个人的记忆能力与形成心象的能力。这里我们不讨论言语和书写所促成的人类合作的价值，尽管两者都属于外部符号操作；我们只讨论以手工方式形成图形化符号表示的手段，例如木棍与沙地、铅笔与纸和橡皮、直尺或圆规，等等。个人今天进行概念操作——也就是思考——的方式，其演化主要就与这类外部符号操作手段联系在一起。&quot;,
    &quot;en&quot;: &quot;(3) Manual, External, Symbol Manipulation—Another significant step toward harnessing the biologically evolved mental capabilities in pursuit of comprehension and problem solutions came with the development of the means for externalizing some of the symbol-manipulation activity, particularly in graphical representation. This supplemented the individual&#x27;s memory and ability to visualize. (We are not concerned here with the value derived from human cooperation made possible by speech and writing, both forms of external symbol manipulation. We speak of the manual means of making graphical representations of symbols—a stick and sand, pencil and paper and eraser, straight edge or compass, and so on.) It is principally this kind of means for external symbol manipulation that has been associated with the evolution of the individual&#x27;s present way of doing his concept manipulation (thinking).&quot;
  },
  &quot;2c4e&quot;: {
    &quot;id&quot;: &quot;p_97&quot;,
    &quot;zh&quot;: &quot;沃尔夫假说认为：“一种文化的世界观，受该文化所使用语言的结构限制。”但在语言与人类推理能力的演化中，似乎还应考虑另一个因素。我们提出下面这个与沃尔夫假说相关的假说：一种文化所使用的语言，以及有效进行智力活动的能力，在演化过程中，都直接受到个人用来控制外部符号操作的手段的影响。为便于指称，我们把它称为“新沃尔夫假说”。&quot;,
    &quot;en&quot;: &quot;The Whorfian hypothesis states that \&quot;the world view of a culture is limited by the structure of the language which that culture uses.\&quot; But there seems to be another factor to consider in the evolution of language and human reasoning ability. We offer the following hypothesis, which is related to the Whorfian hypothesis: Both the language used by a culture, and the capability for effective intellectual activity are directly affected during their evolution by the means by which individuals control the external manipulation of symbols. (For identification, we will refer to this as the Neo-Whorfian hypothesis.)&quot;
  },
  &quot;2c4f&quot;: {
    &quot;id&quot;: &quot;p_98&quot;,
    &quot;zh&quot;: &quot;如果能够较容易地证明新沃尔夫假说，而且能够弄清外部符号操作手段如何同时影响语言和思维方式，我们就会得到一个研究人类增强可能性的有用工具。为了展开讨论，让我们暂且假定新沃尔夫假说成立，看看能够作出哪些有关推论。&quot;,
    &quot;en&quot;: &quot;If the Neo-Whorfian hypothesis could be proved readily, and if we could see how our means of externally manipulating symbols influence both our language and our way of thinking, then we would have a valuable instrument for studying human-augmentation possibilities. For the sake of discussion, let us assume the Neo-Whorfian hypothesis to be true, and see what relevant deductions can be made.&quot;
  },
  &quot;2c4g&quot;: {
    &quot;id&quot;: &quot;p_99&quot;,
    &quot;zh&quot;: &quot;如果个人在身体之外操作思考辅助符号的手段，确实直接影响他的思维方式，那么原来的沃尔夫假说还会带来一重附加影响。外部符号操作手段直接影响语言，而语言又通过沃尔夫假说所描述的联系，间接影响思维方式。这样，我们进行外部符号操作的方式，就有两条途径可以影响我们的思考。&quot;,
    &quot;en&quot;: &quot;If the means evolved for an individual&#x27;s external manipulation of his thinking-aid symbols indeed directly affect the way in which he thinks, then the original Whorfian hypothesis would offer an added effect. The direct effect of the external-symbol-manipulation means upon language would produce an indirect effect upon the way of thinking via the Whorfian-hypothesis linkage. There would then be two ways for the manner in which our external symbol manipulation was done to affect our thinking.&quot;
  },
  &quot;2c4h&quot;: {
    &quot;id&quot;: &quot;p_100&quot;,
    &quot;zh&quot;: &quot;对于我们设想的H-LAM/T系统变化——具体说，就是把数字计算机的能力整合进个人的智力活动——可以采取这样一种看法：我们正在引入全新而极为先进的外部符号操作手段。接着，我们要确定，由此能够使语言与思维方式产生哪些有益变化。这使我们想到，个人智力能力的演化，还可以有第四个阶段：&quot;,
    &quot;en&quot;: &quot;One way of viewing the H-LAM/T system changes that we contemplate—specifically, integrating the capabilities of a digital computer into the intellectual activity of individual humans—is that we are introducing new and extremely advanced means for externally manipulating symbols. We then want to determine the useful modifications in the language and in the way of thinking that could result. This suggests a fourth stage to the evolution of our individual-human intellectual capability:&quot;
  },
  &quot;2c4h1&quot;: {
    &quot;id&quot;: &quot;p_101&quot;,
    &quot;zh&quot;: &quot;（4）自动化的外部符号操作。在这一阶段，人用来表示其所操作概念的符号，可以被排列在眼前，可以移动、存储、调出，还可以按照极为复杂的规则进行处理。借助专门设计、能够与人协作的技术装置，所有这些操作，只需人提供极少的信息，就能得到非常迅速的响应。把目前的想象推到极限，这样的装置可以是一台能够与我们迅速、轻松交流的计算机，连接着三维彩色显示器。它能在显示器中构建极为复杂精妙的图像，也能根据人的指示，自动对这些图像的一部分或全部执行多种过程。这些显示与处理可以提供有用的服务，既有简单的，也可能有奇异新颖的；它们还可能涉及我们从未想象过的概念。正如处在第二阶段、尚未使用图形辅助的人，不可能预见条形图、长除法或卡片资料系统一样。&quot;,
    &quot;en&quot;: &quot;(4) Automated external symbol manipulation—In this stage, symbols with which the human represents the concepts he is manipulating can be arranged before his eyes, moved, stored, recalled, operated upon according to extremely complex rules—all in very rapid response to a minimum amount of information supplied by the human, by means of special cooperative technological devices. In the limit of what we might now imagine, this could be a computer, with which we could communicate rapidly and easily, coupled to a three-dimensional color display within which it could construct extremely sophisticated images—with the computer being able to execute a wide variety of processes upon parts or all of these images in automatic response to human direction. The displays and processes could provide helpful services—we could imagine both simple and exotic varieties—and could involve concepts that we have never yet imagined (as the pre-graphic thinker of Stage 2 would be unable to predict the bar graph, the process of long division, or a card file system).&quot;
  },
  &quot;2c4j&quot;: {
    &quot;id&quot;: &quot;p_103&quot;,
    &quot;zh&quot;: &quot;为了寻找一些简单办法，弄清新沃尔夫假说可能意味着什么，我们可以设想几种较为直接的方式，提高外部符号操作能力，再试着想象语言与思维方法可能随之发生的变化。实际上，反过来思考更简单：设想一种会降低外部符号操作能力的改变。这使我们能够采取一种既简单又有效的经验性方法。于是，我们做了下面这个实验。&quot;,
    &quot;en&quot;: &quot;In search of some simple ways to determine what the Neo-Whorfian hypothesis might imply, we could imagine some relatively straightforward means of increasing our external symbol-manipulation capability and try to picture the consequent changes that could evolve in our language and methods of thinking. Actually, it turned out to be simpler to invert the problem and consider a change that would reduce our capability for external symbol manipulation. This allowed an empirical approach which proved both simple and effective. We thus performed the following experiment:&quot;
  },
  &quot;2c4k&quot;: {
    &quot;id&quot;: &quot;p_104&quot;,
    &quot;zh&quot;: &quot;具有与我们同等能力的大脑，也可能演化于这样一种环境：其中器具材料与肌肉力量的比例关系，使最精巧的书写工具——相当于铅笔——在形状和重量上，对使用者来说，就像一块砖对我们一样难以操控；这里假定我们的肌肉没有专门受过应付这种工具的训练。我们把一支铅笔绑在一块砖上，实际试了一试。图2把结果与打字、普通铅笔书写作了比较。用“砖头铅笔”时，我们写得更慢，也更不精确。如果想写快些，就得把字写得更大。而且，把同一段文字用砖头铅笔写两遍，就会使未经训练的手和手臂感到疲劳。&quot;,
    &quot;en&quot;: &quot;Brains of power equal to ours could have evolved in an environment where the combination of artifact materials and muscle strengths were so scaled that the neatest scribing tool (equivalent to a pencil, possible had a shape and mass as manageable as a brick would be to us-assuming that our muscles were not specially conditioned to deal with it. We fastened a pencil to a brick and experimented. Figure 2 shows the results, compared with typewriting and ordinary pencil writing. With the brick pencil, we are slower and less precise. If we want to hurry the writing, we have to make it larger. Also, writing the passage twice with the brick-pencil tires the untrained hand and arm.&quot;
  },
  &quot;2c4l&quot;: {
    &quot;id&quot;: &quot;p_105&quot;,
    &quot;zh&quot;: &quot;倘若这就是我们手工进行图形化符号操作的唯一手段，我们的文明会怎样发展？首先，支持商业与政府组织的记录活动，很可能采取与今天完全不同的形式，社会结构也无疑会沿着不同路径演化。另外，计算以及把经过仔细推理的长篇论证写下来，都会变得费力。这将削弱个人对复杂新概念进行试验的意愿，降低学习速度与有用成果的产出速度，甚至可能使许多人根本不愿再从事扩展理解的工作。因此，文化中演化出的概念将会不同；代表这些概念的符号体系很可能也会不同，会更加节省书写动作。由此看来，一种文化用来进行外部符号操作的具体手段，很可能直接影响其成员的思维与语言。这为我们的新沃尔夫假说提供了少量直觉上的支持。&quot;,
    &quot;en&quot;: &quot;How would our civilization have matured if this had been the only manual means for us to use in graphical manipulation of symbols? For one thing, the record keeping that enables the organization of commerce and government would probably have taken a form so different from what we know that our social structure would undoubtedly have evolved differently. Also, the effort in doing calculations and writing down extensive and carefully reasoned argument would dampen individual experimentation with sophisticated new concepts, to lower the rate of learning and the rate of useful output, and perhaps to discourage a good many people from even working at extending understanding. The concepts that would evolve within our culture would thus be different, and very likely the symbology to represent them would be different—much more economical of motion in their writing It thus seems very likely that our thoughts and our language would be rather directly affected by the particular means used by our culture for externally manipulating symbols, which gives little intuitive substantiation to our Neo-Whorfian hypothesis.&quot;
  },
  &quot;2c4m&quot;: {
    &quot;id&quot;: &quot;p_107&quot;,
    &quot;zh&quot;: &quot;为了进一步思考这一假说的含义，可以考虑下面这个假想的器具发展。它代表另一类外部符号操作，而这种操作本来可能产生相当大的影响。假设在几代人以前，还处于早期阶段的技术发展出了一种器具：它本质上是一台高速、半自动的查表装置，价格低到几乎人人都能购买，体积和重量又小到可以随身携带。再假设，制造商——也就是出版者——出售的可更换卡匣装有供查阅的信息；一个卡匣能够容纳相当于一部完整大型词典的内容；经过练习的普通人，总能在三秒之内找到一段释义，并把它显示在装置表面。技术发明的际遇、商业兴趣与公众接受程度，原本就有可能共同促成这样一种东西。&quot;,
    &quot;en&quot;: &quot;To reflect further upon the implications of this hypothesis, the following hypothetical artifact development can be considered, representing a different type of external symbol manipulation that could have had considerable effect. Suppose that our young technology of a few generations ago had developed an artifact that was essentially a high speed, semi-automatic table-lookup device—cheap enough for almost everyone to afford and small and light enough to be carried on the person. Assume that the individual cartridges sold by manufacturers (publishers) contained the look-up information, that one cartridge could hold the equivalent of an unabridged dictionary, and that a one-paragraph definition could always be located and displayed on the face of the device by the average practiced individual in less than three seconds. The fortunes of technological invention, commercial interest, and public acceptance just might have evolved something like this.&quot;
  },
  &quot;2c4n&quot;: {
    &quot;id&quot;: &quot;p_108&quot;,
    &quot;zh&quot;: &quot;如果查找资料如此容易，我们的词汇会怎样发展？探索他人知识领域的习惯会怎样改变？如果每个人都能如此迅速、轻松地查出适用规则，实际组织工作的精密程度会怎样提高？教育系统又会怎样变化，来利用学生、教师以及管理人员所拥有的这种新的外部符号操作能力？&quot;,
    &quot;en&quot;: &quot;If it were so very easy to look things up, how would our vocabulary develop, how would our habits of exploring the intellectual domains of others shift, how might the sophistication of practical organization mature (if each person can so quickly and easily look up applicable rules), how would our education system change to take advantage of this new external symbol-manipulation capability of students and teachers (and administrators)?&quot;
  },
  &quot;2c5b1&quot;: {
    &quot;id&quot;: &quot;p_113&quot;,
    &quot;zh&quot;: &quot;这里的“材料”，指人和器具各自活动域中的那些能力；能力库层级体系中的一切其他能力，都必须由它们构建而成。每一种基本能力，都代表一种可用来建造系统的功能性构件。要彻底重设计系统，就需要盘点所有可用的基本能力。由于我们现在是在探索认识问题的视角，还没有提出具体研究活动的建议，所以可以更详细地讨论、界定“基本能力”的含义，而不必先考虑实际完成这份清单需要多少研究工作。&quot;,
    &quot;en&quot;: &quot;\&quot;Materials\&quot; in this context are those capabilities in the human and in the artifact domains from which all other capabilities in the repertoire hierarchy must be constructed. Each such basic capability represents a type of functional component with which the system can be built, and a thorough job of redesigning the system calls for making an inventory of the basic capabilities available. Because we are exploring for perspective, and not yet recommending research activities, we are free to discuss and define in more detail what we mean by \&quot;basic capability\&quot;, without regard to the amount of research involved in making an actual inventory.&quot;
  },
  &quot;2c5b2&quot;: {
    &quot;id&quot;: &quot;p_114&quot;,
    &quot;zh&quot;: &quot;人和器具这两个活动域，可以分别考察其基本能力。在每个活动域中，又可根据某项基本能力是否已经用于我们的增强手段，区分两类。第一类——已经使用的能力——可以通过系统分析现有能力层级来寻找。例如，从层级中的任一位置选取一项能力，问自己：在所设想的增强研究可以考虑的范围内，是否存在某种手段，能够对它作出有益改变？如果有，它就不是基本能力，但可以继续分解，最终得到一组基本能力。沿着层级向下走，会开始遇到一些无法作出有益改变的能力，它们就构成基本能力清单。不论从层级中的哪一项能力开始递归分解，最终每一条分支都会终止于某项基本能力。从不同能力出发进行这种分解式搜索，最终就能揭示该层级或增强系统所使用的全部基本能力。对一个高阶能力的分解，常常会有许多不同分支终止于同一项基本能力，因为同一项基本能力往往会用于许多不同的高阶能力。&quot;,
    &quot;en&quot;: &quot;The two domains, human and artifact, can be explored separately for their basic capabilities. In each we can isolate two classes of basic capability; these classes are distinguished according to whether or not the capability has been put to use within out augmentation means. The first class (those in use) can be found in a methodical manner by analyzing present capability hierarchies. For example, select a given capability, at any level in the hierarchy, and ask yourself if it can be usefully changed by any means that can be given consideration in the augmentation research contemplated. If it can, then it is not basic but it can be decomposed into an eventual set of basic capabilities. As you proceed down through the hierarchy, you will begin to encounter capabilities that cannot be usefully changed, and these will make up your inventory of basic capabilities. Ultimately, every such recursive decomposition of a given capability in the hierarchy will find every one of its branching paths terminated by basic capabilities. Beginning such decomposition search with different capabilities in the hierarchy will eventually uncover all of those basic capabilities used within that hierarchy or augmentation system. Many of the branching paths in the decomposition of a given higher-order capability will terminate in the same basic capability, since a given basic capability will often be used within many different higher-order capabilities.&quot;
  },
  &quot;2c5b4&quot;: {
    &quot;id&quot;: &quot;p_116&quot;,
    &quot;zh&quot;: &quot;在任何具体情境中开始这项盘点工作之前，都必须先确立一些标准：H-LAM/T系统中哪些可能的改变，可以被认真纳入考虑？例如，某些研究情境可能必须排除那些需要大量重新训练的改变，或者要求人做出有失体面行为的改变；另一些情境则可能允许需要多年专门训练、极昂贵设备，或使用特殊药物的改变。&quot;,
    &quot;en&quot;: &quot;Before this inventorying task can be pursued in any specific instance, some criteria must be established as to what possible changes within the H-LAM/T system can be given serious consideration. For instance, some research situations might have to disallow changes which require extensive retraining, or which require undignified behavior by the human. Other situations might admit changes requiring years of special training, very expensive equipment, or the use of special drugs.&quot;
  },
  &quot;2c5c1a&quot;: {
    &quot;id&quot;: &quot;p_120&quot;,
    &quot;zh&quot;: &quot;从基本能力构建复杂能力，所依据的根本原则是结构化，也就是我们称为“协同式”的那一种结构化：把一组要素组织起来，产生的效果大于它们各自效果的简单相加。也许“有目的的”结构化或组织化，同样能够表达我们的意思；但我们还不确定，为满足本研究需要，结构化这个概念应怎样继续成熟，因此暂时保留“协同式”这一特殊限定。我们越来越意识到，几乎在每一件考察的物理事物和概念事物之中，这种结构都重要而普遍；由一层层这样的组织所形成的层级形式，也似乎无处不在。&quot;,
    &quot;en&quot;: &quot;The fundamental principle used in building sophisticated capabilities from the basic capabilities is structuring—the special type of structuring (which we have termed synergetic) in which the organization of a group of elements produces an effect greater than the mere addition of their individual effects. Perhaps \&quot;purposeful\&quot; structuring (or organization) would serve us as well, but since we aren&#x27;t sure yet how the structuring concept must mature for our needs, we shall tentatively stick with the special modifier, \&quot;synergetic.\&quot; We are developing a growing awareness of the significant and pervasive nature of such structure within every physical and conceptual thing we inspect, where the hierarchical form seems almost universally present as stemming from successive levels of such organization.&quot;
  },
  &quot;2c5c1c&quot;: {
    &quot;id&quot;: &quot;p_122&quot;,
    &quot;zh&quot;: &quot;不过，在我们希望开展工作的能力层级上，区分若干不同类型的结构化，似乎很有用，尽管每一类从根本上说，都是对基本物理过程的组织。我们暂时区分了五种，但还不能确定，在考虑增强人类智力的问题时，最终需要使用多少种，也不能确定怎样划分和细分物理过程组织的这些不同表现。我们使用的五个名称是：“心智结构化”“概念结构化”“符号结构化”“过程结构化”和“物理结构化”。&quot;,
    &quot;en&quot;: &quot;But at the level of the capability hierarchy where we wish to work, it seems useful to us to distinguish several different types of structuring—even though each type is fundamentally a structuring of the basic physical processes. Tentatively we have isolated five such types—although we are not sure how many we shall ultimately want to use in considering the problem of augmenting the human intellect, nor how we might divide and subdivide these different manifestations of physical-process structuring. We use the terms \&quot;mental structuring,\&quot; \&quot;concept structuring,\&quot; \&quot;symbol structuring,\&quot; \&quot;process structuring,\&quot; and \&quot;physical structuring.\&quot;&quot;
  },
  &quot;2c5c2a&quot;: {
    &quot;id&quot;: &quot;p_124&quot;,
    &quot;zh&quot;: &quot;我们把有意识和无意识的心象、联想或概念——或者任何实际组织在人类头脑中的东西——在内部的组织，称为“心智结构化”。这种组织以某种方式使人获得理解，并为他对环境作出判断、直觉把握、推断和有意义的行动提供基础。心理学中有一个术语“认知结构”，到目前为止，它似乎正好对应我们所要表达的心智结构概念。但在更加确定心理学界接受的含义，以及我们自己的概念框架真正需要什么之前，我们还不打算采用这个术语。&quot;,
    &quot;en&quot;: &quot;Mental structuring is what we call the internal organization of conscious and unconscious mental images, associations, or concepts (or whatever it is that is organized within the human mind) that somehow manages to provide the human with understanding and the basis for such as judgment, intuition, inference, and meaningful action with respect to his environment. There is a term used in psychology, cognitive structure, which so far seems to represent just what we want for our concept of mental structure, but we will not adopt it until we become more sure of what the accepted psychological meaning is and of what we want for our conceptual framework.&quot;
  },
  &quot;2c5c2b&quot;: {
    &quot;id&quot;: &quot;p_125&quot;,
    &quot;zh&quot;: &quot;就目前的目的而言，没有必要纠缠于：究竟什么基本的心智“事物”被组织起来，什么机制完成了这种组织，又是什么机制利用已经形成的结构。我们认为可以相当有把握地作如下假定：学习涉及大脑内部某种有意义的组织；无论被这样组织、结构化起来的究竟是什么，它都为产生个人行为的心智机制，提供了一个可运作的个人世界模型。我们进一步假定，在H-LAM/T系统中，当人作出使复杂问题得以解决的关键决定或关键行动时，它将源于那一时刻他的心智结构状态。从这个角度看，在那一刻之前，系统围绕该问题所做活动的基本目的，就是发展人的心智结构，使其达到能够由心智机制产生这一关键行动的状态。&quot;,
    &quot;en&quot;: &quot;For our present purpose, it is irrelevant to worry over what the fundamental mental \&quot;things\&quot; being structured are, or what mechanisms are accomplishing the structuring or making use of what has been structured. We feel reasonably safe in assuming that learning involves some kind of meaningful organization within the brain, and that whatever is so organized or structured represents the operating model of the individual&#x27;s universe to the mental mechanisms that derive his behavior. And further, our assumption is that when the human in our H/LAM system makes the key decision or action that leads to the solution of a complex problem, it will stem from the state of his mental structure at that time. In this view then, the basic purpose of the system&#x27;s activity on that problem up to that point has been to develop his mental structure to the state from which the mental mechanisms could derive the key action.&quot;
  },
  &quot;2c5c2d&quot;: {
    &quot;id&quot;: &quot;p_127&quot;,
    &quot;zh&quot;: &quot;我们并不知道，心智结构的发展，究竟更像哪一种情形：（a）培育一座花园——提供良好环境、播下种子、去除争夺养分的杂草和有害虫类，但除此之外，只能让自然过程自行展开；（b）培养一支篮球队——必须大量练习技能、配合模式与策略，才能让自然过程逐渐把它们编织成一个整体；还是（c）制造一台机器——把精心制作的零件按照精确规划装配起来，使自然现象立即产生预定功能。我们不知道其中的过程，但我们能够、也已经建立了一些经验性关系，把人所获得的经验，与他表现出的理解和能力发展联系起来。我们认为，在近期的人类智力增强研究中，要发展更好的手段，服务于人的心智结构的形成与运用，将完全依赖过去与未来的经验性发现。&quot;,
    &quot;en&quot;: &quot;We don&#x27;t know whether a mental structure is developed in a manner analogous to (a) development of a garden, where one provides a good environment, plants the seeds, keeps competing weeds and injurious pests out, but otherwise has to let natural processes take their course, or to (b) development of a basketball team, where much exercise of skills, patterns, and strategies must be provided so that natural processes can slowly knit together an integration, or to (c) development of a machine, where carefully formed elements are assembled in a precise, planned manner so that natural phenomena can immediately yield planned function. We don&#x27;t know the processes, but we can and have developed empirical relationships between the experiences given a human and the associated manifestations of developing comprehension and capability, and we see the near-future course of the research toward augmenting the human&#x27;s intellect as depending entirely upon empirical findings (past and future) for the development of better means to serve the development and use of mental structuring in the human.&quot;
  },
  &quot;2c5c3a&quot;: {
    &quot;id&quot;: &quot;p_130&quot;,
    &quot;zh&quot;: &quot;在这个框架中，我们形成了一个工作假定：我们之所以似乎能够提供有利于心智结构发展的经验，是因为概念在其中充当了“交换媒介”。我们把概念看作一种工具，可以被心智机制把握和使用，可以被天然的心智材料与过程构成、解释和运用。如果给概念配上一个明确的“把手”，也就是一个代表它的符号，这些机制往往就更容易把握和处理它。不知通过什么方式，心智机制能够学会有意义地操作符号的心象——或某种类似的东西——并且安然确信，与之关联的概念操作随时可以被调用。&quot;,
    &quot;en&quot;: &quot;Within our framework we have developed the working assumption that the manner in which we seem to be able to provide experiences that favor the development of our mental structures is based upon concepts as a \&quot;medium of exchange.\&quot; We view a concept as a tool that can be grasped and used by the mental mechanisms, that can be composed, interpreted, and used by the natural mental substances and processes. The grasping and handling done by these mechanisms can often be facilitated if the concept is given an explicit \&quot;handle\&quot; in the form of a representative symbol. Somehow the mental mechanisms can learn to manipulate images (or something) of symbols in a meaningful way and remain calmly confident that the associated conceptual manipulations are within call.&quot;
  },
  &quot;2c5c3b&quot;: {
    &quot;id&quot;: &quot;p_131&quot;,
    &quot;zh&quot;: &quot;概念似乎可以组织成结构，因为一个新概念可以由若干既有概念组织而成。就目前而言，我们可以把“概念结构”看作这样一种东西：我们可能试着为自己在纸上构建它，或者通过有意识的思维过程使用它，又或者在认真讨论时试着把它传达给别人。我们假定，要传递某一单位的理解，就存在一种可以被有意识地构建和展示的概念结构；把它以适当方式呈现给某个人，就能在他头脑中映射成相应的心智结构，为他表现出“理解了”的行为提供基础。我们的工作假定还包括：有些概念结构比另一些更适合这一目的，因为个人更容易把它们映射为能够运作的心智结构，或者因为所形成的心智结构能够带来更高程度的理解与更好的问题解决办法，也可能兼具这两方面优点。&quot;,
    &quot;en&quot;: &quot;Concepts seem to be structurable, in that a new concept can be composed of an organization of established concepts. For present purposes, we can view a concept structure as something which we might try to develop on paper for ourselves or work with by conscious thought processes, or as something which we try to communicate to one another in serious discussion. We assume that, for a given unit of comprehension to be imparted, there is a concept structure (which can be consciously developed and displayed) that can be presented to an individual in such a way that it is mapped into a corresponding mental structure which provides the basis for that individual&#x27;s \&quot;comprehending\&quot; behavior. Our working assumption also considers that some concept structures would be better for this purpose than others, in that they would be more easily mapped by the individual into workable mental structures, or in that the resulting mental structures enable a higher degree of comprehension and better solutions to problems, or both.&quot;
  },
  &quot;2c5c3c&quot;: {
    &quot;id&quot;: &quot;p_132&quot;,
    &quot;zh&quot;: &quot;概念结构常常作为文化演化的一部分而成长：既可能在一个广泛的社会群体中大规模展开，也可能在个人的活动领域中小规模发生。但概念结构也能够直接被设计或修改。本研究的一项基本假说是：可以发展出更好的概念结构；当这些结构映射到人的心智结构中时，将显著改善他理解复杂问题情境、寻找解决办法的能力。&quot;,
    &quot;en&quot;: &quot;A concept structure often grows as part of a cultural evolution—either on a large scale within a large segment of society, or on a small scale within the activity domain of an individual. But it is also something that can be directly designed or modified, and a basic hypothesis of our study is that better concept structures can be developed—structures that when mapped into a human&#x27;s mental structure will significantly improve his capability to comprehend and to find solutions within his complex-problem situations.&quot;
  },
  &quot;2c5c3d&quot;: {
    &quot;id&quot;: &quot;p_133&quot;,
    &quot;zh&quot;: &quot;自然语言为使用者提供了一套现成的概念结构，帮助建立基本的心智结构，并允许相对灵活、通用的概念结构化。我们把语言视为增强人类智力的基本手段之一；在我们的用法中，“语言”涵盖了人可能利用的一切概念结构化。&quot;,
    &quot;en&quot;: &quot;A natural language provides its user with a ready-made structure of concepts that establishes a basic mental structure, and that allows relatively flexible, general-purpose concept structuring. Our concept of language as one of the basic means for augmenting the human intellect embraces all of the concept structuring which the human may make use of.&quot;
  },
  &quot;2c5c4a&quot;: {
    &quot;id&quot;: &quot;p_135&quot;,
    &quot;zh&quot;: &quot;我们所谓“语言”的另一个重要部分，是概念如何被表示，也就是符号与符号结构。例如，把词组织成短语、句子、段落和专著，以及图表、清单、示意图、表格等。同一个概念结构，可以用无穷多种不同的符号结构来表示。其中有些形式更有利于人的知觉与认知机制寻找、理解那些重要或感兴趣的概念内容。例如，包含许多数值数据的概念结构，通常用阿拉伯数字表示会比罗马数字好得多；而图形结构又很可能比表格结构更好。&quot;,
    &quot;en&quot;: &quot;The other important part of our \&quot;language\&quot; is the way in which concepts are represented—the symbols and symbol structures. Words structured into phrases, sentences, paragraphs, monographs—charts, lists, diagrams, tables, etc. A given structure of concepts can be represented by any of an infinite number of different symbol structures, some of which would be much better than others for enabling the human perceptual and cognitive apparatus to search out and comprehend the conceptual matter of significance and/or interest to the human. For instance, a concept structure involving many numerical data would generally be much better represented with Arabic rather than Roman numerals and quite likely a graphic structure would be better than a tabular structure.&quot;
  },
  &quot;2c5c4b&quot;: {
    &quot;id&quot;: &quot;p_136&quot;,
    &quot;zh&quot;: &quot;然而，重要的不只是符号结构的形式。问题解决者处于一连串概念活动之中，其活动进程服务于当下的心智需要。这些需要的次序和性质变化很大，但对每一种需要而言，都可能有一种符号结构形式特别有效，能给人带来显著帮助。&quot;,
    &quot;en&quot;: &quot;But it is not only the form of a symbol structure that is important. A problem solver is involved in a stream of conceptual activity whose course serves his mental needs of the moment. The sequence and nature of these needs are quite variable, and yet for each need he may benefit significantly from a form of symbol structuring that is uniquely efficient for that need.&quot;
  },
  &quot;2c5c4c&quot;: {
    &quot;id&quot;: &quot;p_137&quot;,
    &quot;zh&quot;: &quot;因此，除了能够构建和呈现什么形式的符号结构，我们也非常关心：把一种形式转换为另一种形式，以及找到并呈现新材料，可以做到多快、多灵活。&quot;,
    &quot;en&quot;: &quot;Therefore, besides the forms of symbol structures that can be constructed and portrayed, we are very much concerned with the speed and flexibility with which one form can be transformed into another, and with which new material can be located and portrayed.&quot;
  },
  &quot;2c5c4d&quot;: {
    &quot;id&quot;: &quot;p_138&quot;,
    &quot;zh&quot;: &quot;我们通常习惯把符号结构看成纸面上的一组标记。想要看到另一种符号结构视图时，就会想到把注意力移到纸面的另一处，或换上一张纸。但另一种视图也可以这样产生：从当前文本中抽取所有与论证中“考虑A”有关的陈述，重新排序；或者把其中所有指定的生僻词，替换成自己的定义。借助计算机控制的显示系统，这种“视图生成”完全可行，而且构成一种非常重要、值得在其上继续构建的能力。&quot;,
    &quot;en&quot;: &quot;We are generally used to thinking of our symbol structures as a pattern of marks on a sheet of paper. When we want a different symbol-structure view, we think of shifting our point of attention on the sheet, or moving a new sheet into position. But another kind of view might be obtained by extracting and ordering all statements in the local text that bear upon consideration A of the argument—or by replacing all occurrences of specified esoteric words by one&#x27;s own definitions. This sort of \&quot;view generation\&quot; becomes quite feasible with a computer-controlled display system, and represents a very significant capability to build upon.&quot;
  },
  &quot;2c5c4e&quot;: {
    &quot;id&quot;: &quot;p_139&quot;,
    &quot;zh&quot;: &quot;当计算机替我们操作符号，并在屏幕上生成符号的呈现时，我们就不必再把观看显示内容，理解为直接观看“存储着的那个符号结构”；而面对笔记本、备忘录和书籍时，我们通常就是这样想的。只要计算机能够呈现与我们所理解的信息组织形式相一致的符号结构，至于它内部实际存储的是什么，就不必由我们操心。&quot;,
    &quot;en&quot;: &quot;With a computer manipulating our symbols and generating their portrayals to us on a display, we no longer need think of our looking at the symbol structure which is stored—as we think of looking at the symbol structures stored in notebooks, memos, and books. What the computer actually stores need be none of our concern, assuming that it can portray symbol structures to us that are consistent with the form in which we think our information is structured.&quot;
  },
  &quot;2c5c4f&quot;: {
    &quot;id&quot;: &quot;p_140&quot;,
    &quot;zh&quot;: &quot;一个既定概念结构，可以用一种完全适合计算机内部符号处理方式的符号结构表示。各种特征与关系，都可以得到明确标识，而使用者可能永远不会直接看到这些标识。事实上，相比一个人能够实际在纸上构建或使用的结构，这种结构化在准确映射复杂概念结构方面，具有大得多的潜力。&quot;,
    &quot;en&quot;: &quot;A given concept structure can be represented with a symbol structure that is completely compatible with the computer&#x27;s internal way of handling symbols, with all sorts of characteristics and relationships given explicit identifications that the user may never directly see. In fact, this structuring has immensely greater potential for accurately mapping a complex concept structure than does a structure an individual would find it practical to construct or use on paper.&quot;
  },
  &quot;2c5c4g&quot;: {
    &quot;id&quot;: &quot;p_141&quot;,
    &quot;zh&quot;: &quot;屏幕上的二维呈现，只是整个结构的某个有限视图；而计算机内部，则有一个n维映像中的相应部分代表这个“视图”。计算机能够在二者之间来回转换。如果人在视图中添加或修改内容，计算机就会按照自己适用的符号与组织方式，把变化整合进内部映像的符号结构中，并由此自动检测出他可能产生的某一部分概念不一致之处。&quot;,
    &quot;en&quot;: &quot;The computer can transform back and forth between the two-dimensional portrayal on the screen, of some limited view of the total structure, and the aspect of the n-dimensional internal image that represents this \&quot;view.\&quot; If the human adds to or modifies such a \&quot;view,\&quot; the computer integrates the change into the internal-image symbol structure (in terms of the computer&#x27;s favored symbols and structuring) and thereby automatically detects a certain proportion of his possible conceptual inconsistencies.&quot;
  },
  &quot;2c5c4h&quot;: {
    &quot;id&quot;: &quot;p_142&quot;,
    &quot;zh&quot;: &quot;因此，在这件工具——计算机——内部，存在一个作为内部映像的计算机符号结构。我们可以学会塑造它错综复杂的联系与多维特性，以前所未有的精确程度，来表示我们正在构建或使用的概念结构。这个内部结构的形式，可能几乎无法由人直接观察并理解，除非只看极小的片段。&quot;,
    &quot;en&quot;: &quot;Thus, inside this instrument (the computer) there is an internal-image, computer-symbol structure whose convolutions and multi-dimensionality we can learn to shape to represent to hitherto unattainable accuracy the concept structure we might be building or working with. This interna1 structure may have a form that is nearly incomprehensible to the direct inspection of a human (except in minute chunks).&quot;
  },
  &quot;2c5c4i&quot;: {
    &quot;id&quot;: &quot;p_143&quot;,
    &quot;zh&quot;: &quot;但是，只需让人相对于这个内部映像，向工具说明自己当下的特定概念需要，计算机就会在丝毫不扰乱自身内部参照结构的情况下，按需要进行拉伸、弯折、折叠、抽取和切分，以自己的内部组织方式，组合出一个作为回答的子结构。然后，它会采用适合该情境的一套标准转换规则，在显示器上向人呈现一个符号结构。这个结构专为人的快速、准确感知与理解而设计，所呈现的正是内部子结构所涉及的概念内容。&quot;,
    &quot;en&quot;: &quot;But let the human specify to the instrument his particular conceptual need of the moment, relative to this internal image. Without disrupting its own internal reference structure in the slightest, the computer will effectively stretch, bend, fold, extract, and cut as it may need in order to assemble an internal substructure that is its response, structured in its own internal way. With the set of standard translation rules appropriate to the situation, it portrays to the human via its display a symbol structure designed for his quick and accurate perception and comprehension of the conceptual matter pertinent to this internally composed substructure.&quot;
  },
  &quot;2c5c5a&quot;: {
    &quot;id&quot;: &quot;p_146&quot;,
    &quot;zh&quot;: &quot;H-LAM/T系统中几乎所有与本研究直接相关的活动，都涉及为了服务心智结构，而操作概念结构与符号结构。因此，在这个系统中，我们最想发展的过程，是那些能够对这三种结构进行操作的过程。这就把我们带到第四种结构化：过程结构化。&quot;,
    &quot;en&quot;: &quot;Essentially everything that goes on within the H-LAM/T system and that is of direct interest here involves the manipulation of concept and symbol structures in service to the mental structure. Therefore, the processes within the H-LAM/T system that we are most interested in developing are those that provide for the manipulation of all three types of structure. This brings us to the fourth category of structuring, process structuring.&quot;
  },
  &quot;2c5c5b&quot;: {
    &quot;id&quot;: &quot;p_147&quot;,
    &quot;zh&quot;: &quot;按照目前的用法，“过程结构化”包括对过程与过程结构的组织、研究、修改和执行。概念结构化与符号结构化合在一起，代表增强手段中的语言成分；过程结构化则代表方法体系成分，实际上还略多一些。前面对过程结构的讨论已经足够，这里无须再解释，举一两个例子即可。要让打字机听从我的指挥，我的手和手指的各个过程——或动作——就必须协同组织起来。我整个工作日中的一连串行动，也应当共同服务于某个总体专业目标。&quot;,
    &quot;en&quot;: &quot;As we are currently using it, the term process structuring includes the organization, study, modification, and execution of processes and process structures. Whereas concept structuring and symbol structuring together represent the language component of our augmentation means, process structuring represents the methodology component (plus a little more, actually). There has been enough previous discussion of process structures that we need not describe the notion here, beyond perhaps an example or two. The individual processes (or actions) of my hands and fingers have to be cooperatively organized if the typewriter is to do my bidding. My successive actions throughout my working day are meant to cooperate toward a certain over-all professional goal.&quot;
  },
  &quot;2c5c5c&quot;: {
    &quot;id&quot;: &quot;p_148&quot;,
    &quot;zh&quot;: &quot;许多过程结构，是用来组织、执行、监督和评估其他过程结构的。另有许多过程结构，则用于形成和操作符号结构；而那些符号结构的用途，又常常是支持过程结构化中所涉及的概念工作。&quot;,
    &quot;en&quot;: &quot;Many of the process structures are applied to the task of organizing, executing, supervising, and evaluating other process structures. Many of them are applied to the formation and manipulation of symbol structures (the purpose of which will often be to support the conceptual labor involved in process structuring).&quot;
  },
  &quot;2c5c6a&quot;: {
    &quot;id&quot;: &quot;p_150&quot;,
    &quot;zh&quot;: &quot;物理结构化，是我们目前在概念框架中使用的五种类型中的最后一种，其含义几乎不言自明。就增强手段的实际物理构造而言，它大体代表其中的器具成分。&quot;,
    &quot;en&quot;: &quot;Physical structuring, the last of the five types which we currently use in our conceptual framework, is nearly self-explanatory. It pretty well represents the artifact component of our augmentation means, insofar as their actual physical construction is concerned.&quot;
  },
  &quot;2c5c7a&quot;: {
    &quot;id&quot;: &quot;p_152&quot;,
    &quot;zh&quot;: &quot;本节讨论中有一个非常重要的特征，需要特别注意：H-LAM/T系统中的不同类型结构化彼此依赖。完成每一类结构化的能力，都依赖于完成其他一种或几种结构化的能力。这里假定系统运行期间，其物理结构基本保持不变，因此暂不讨论物理结构化对其他因素的依赖。&quot;,
    &quot;en&quot;: &quot;A very important feature to be noted from the discussion in this section bears upon the interdependence among the various types of structuring which are involved in the H-LAM/T system, where the capability for doing each type of structuring is dependent upon the capability for doing one or more of the other types of structuring. (Assuming that the physical structuring of the system remains basically unchanged during the system&#x27;s operation, we exclude its dependence upon other factors in this discussion.)&quot;
  },
  &quot;2c5c7b&quot;: {
    &quot;id&quot;: &quot;p_153&quot;,
    &quot;zh&quot;: &quot;这种相互依赖，实际上具有循环的、自我强化的性质，对我们非常重要。我们已经看到，心智结构化的能力，沿着依赖链最终有赖于那些使符号结构操作成为可能的过程结构化，包括人的、器具的和复合的过程结构化。但同样明显的是，过程结构化不仅依赖人和器具的基本过程能力，还依赖人学会执行过程的能力；同样重要的，是人能够从自己的能力库中选择、组织和修改过程，构建一个自己可以执行的高阶过程。因此，构建和执行过程的能力，部分依赖人的心智结构化；而人的心智结构化，又通过概念与符号结构化，部分依赖其过程结构化；后者再部分依赖心智结构化，如此循环。&quot;,
    &quot;en&quot;: &quot;This interdependence actually has a cyclic, regenerative nature to it which is very significant to us. We have seen how the capability for mental structuring is finally dependent, down the chain, upon the process structuring (human, artifact, composite) that enables symbol-structure manipulation. But it also is evident that the process structuring is dependent not only upon basic human and artifact process capabilities, but upon the ability of the human to learn how to execute processes—and no less important, upon the ability of the human to select, organize, and modify processes from his repertoire to structure a higher-order process that he can execute. Thus, a capability for structuring and executing processes is partially dependent upon the human&#x27;s mental structuring, which in turn is partially dependent upon his process structuring (through concept and symbol structuring), which is partially dependent upon his mental structuring, etc.&quot;
  },
  &quot;2c5c7c&quot;: {
    &quot;id&quot;: &quot;p_154&quot;,
    &quot;zh&quot;: &quot;这一切意味着：通过更好的过程结构化——最初也许是借助好得多的器具——显著改善符号结构操作，应当使我们能够进一步改善概念结构与心智结构的操作；而这些改善又能使我们组织、执行更强大的符号操作过程。大多数人初次考虑计算机之类装置如何增强人类智力时，想到的只是一次性的改进。与考虑这种循环强化的相互作用所呈现的图景相比，那种一次性改进的图景要贫乏得多。&quot;,
    &quot;en&quot;: &quot;All of this means that a significant improvement in symbol-structure manipulation through better process structuring (initially perhaps through much better artifacts) should enable us to develop improvements in concept and mental-structure manipulations that can in turn enable us to organize and execute symbol-manipulation processes of increased power. To most people who initially consider the possibilities for computer-like devices augmenting the human intellect, it is only the one-pass improvement that comes to mind, which presents a picture that is relatively barren compared to that which emerges when one considers this regenerative interaction.&quot;
  },
  &quot;2c5c7d&quot;: {
    &quot;id&quot;: &quot;p_155&quot;,
    &quot;zh&quot;: &quot;我们有把握期待：关于怎样操作和呈现符号结构，将会发展出强大得多的概念，以及相应更复杂的操作过程。在最初一轮中，如果没有增强系统所提供的、更好的符号结构化、概念结构化和心智结构化，人根本无力组织和执行这些过程。它们超出了我们当前的使用能力，因而一直没有被发展出来；但在增强手段的未来发展中，这些新概念与新过程将带来巨大的能力收益。&quot;,
